name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: |
          node --check public/app.js
          node --check public/graph-worker.js
          node --check public/markdown-worker.js
          node --check public/modules/paper-texture.js
          node --check public/modules/path-utils.js
          node --check public/modules/export-utils.js
          node --check public/modules/editor-utils.js
          node --check public/modules/preview-utils.js
          node --check frontend/editor-core.js

      - name: Build editor bundle
        run: npm run build:editor

      # 分享共享核心由 shared/share-core.js 生成；生成物必须已提交且与源同步，
      # 否则「桌面端与云端各用一份旧逻辑」这类漂移会悄悄上线。
      - name: Rebuild share core and verify no drift
        run: |
          npm run build:share
          git diff --exit-code -- public/modules/share-core.js cloud/share-core.js

      # 静态守卫：缓存戳一致性 / 无第三方 CDN / 分享页不得直读表 …
      - name: Static guards
        run: npm run check

      - name: Run tests
        run: npm test

  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # 路径/ Host 守卫是纯 std 逻辑，单独编译成测试二进制，不依赖 WebView2 运行时
      - name: Path & host guard tests (standalone)
        shell: bash
        run: |
          printf '#[path = "src/path_guard.rs"]\nmod path_guard;\n' > guard_test.rs
          rustc --edition 2021 --test guard_test.rs -o guard_test.exe
          ./guard_test.exe
