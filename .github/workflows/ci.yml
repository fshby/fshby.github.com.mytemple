name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: |
          node --check server.js
          node --check server/rag.js
          node --check server/frontmatter.js
          node --check server/agent-policy.js
          node --check server/license.js
          node --check server/doc-views.js
          node --check server/converter.js
          node --check server/utils.js
          node --check public/app.js
          node --check public/graph-worker.js
          node --check public/markdown-worker.js
          node --check public/modules/paper-texture.js
          node --check public/modules/path-utils.js

      - name: Run tests
        run: npm test
