name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: |
          node --check public/app.js
          node --check public/graph-worker.js
          node --check public/markdown-worker.js
          node --check public/modules/paper-texture.js
          node --check public/modules/path-utils.js
          node --check public/modules/export-utils.js
          node --check public/modules/editor-utils.js
          node --check public/modules/preview-utils.js
          node --check frontend/editor-core.js

      - name: Build editor bundle
        run: npm run build:editor

      - name: Run tests
        run: npm test

  rust-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
