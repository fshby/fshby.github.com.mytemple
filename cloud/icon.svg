<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="知识库云端">
  <!--
    品牌标记：屋顶（上拱弧）+ 知识核心（圆点）+ 展开的书（下垂 V）。
    三条笔画 + 一个点，几何完全对称，16px 下仍有可辨识的剪影。
    与 APK 自适应图标（apk/android/app/src/main/res/drawable/ic_launcher_foreground.xml）
    同一母题；改这里必须同步那边。
  -->
  <defs>
    <linearGradient id="mtTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a6c4d"/>
      <stop offset="1" stop-color="#5b5138"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#mtTile)"/>
  <g fill="none" stroke="#f4ead6" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 25.5 Q32 9.5 53 25.5"/>
    <path d="M17 44 L32 51.5 L47 44"/>
  </g>
  <circle cx="32" cy="35.5" r="4.3" fill="#f4ead6"/>
</svg>
