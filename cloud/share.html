<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>知识库云端 · 分享的笔记</title>

  <!-- 内容安全策略：访客看的正文来自**别人分享的内容**，是最需要纵深防御的一面。
       脚本只允许同源（/share.js、/markdown-worker.js、/vendor/*）与**那一条**固定的哈希
       （注入到网页文档帧里的高度上报脚本，见 share.js 的 HTML_FRAME_RESIZE_SCRIPT），
       其余内联脚本一律拒绝；
       图片允许 data:（随分享带走的 base64）；连接只允许自己这个域名。
       注：HTML 文档是以 srcdoc 沙箱帧呈现的，帧内脚本由 sandbox 令牌控制，不受这里限制。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-r8/iiifp0vQLvZNddylhZfbaLv72IskZQn4CEfSetCM='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://mytemple-cloud.app.workbuddy.host; frame-src 'self' data: blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />

  <!-- 抓取器（微信 / 各 IM 的链接预览）不执行 JS，拿不到单篇标题，
       所以这里给的是**通用品牌信息**：链接卡片至少明确是以什么产品分享的。
       单篇标题在页面加载后由脚本改写 document.title（只影响浏览器标签）。 -->
  <meta name="description" content="有人用 MyTemple 知识库给你分享了一篇笔记，点开即可阅读。" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="MyTemple 知识库" />
  <meta property="og:title" content="MyTemple 知识库 · 分享的笔记" />
  <meta property="og:description" content="有人用 MyTemple 知识库给你分享了一篇笔记，点开即可阅读。" />
  <!-- og:image 必须带 sharecode：抓取器不执行 JS、也没有 cookie，裸路径会被平台 403
       「链接不完整」，卡片就没有配图（值同 cloud-config.js 的 shareCode）。 -->
  <meta property="og:image" content="https://mytemple-cloud.app.workbuddy.host/og-cover.png?sharecode=XEPPD6GHYK" />
  <meta name="theme-color" content="#6b5f45" />

  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/share.css?v=cloud-26" />
</head>
<body>
  <!-- 顶部品牌条：进页第一眼就有来源感 -->
  <header class="brand-bar">
    <span class="brand-tile" aria-hidden="true">
      <svg viewBox="0 0 64 64" focusable="false">
        <g fill="none" stroke="#f4ead6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 25.5 Q32 9.5 53 25.5" />
          <path d="M17 44 L32 51.5 L47 44" />
        </g>
        <circle cx="32" cy="35.5" r="5.2" fill="#f4ead6" />
      </svg>
    </span>
    <span class="brand-name">知识库云端</span>
    <a class="brand-cta" href="https://mytemple.fshby.cc/" target="_blank" rel="noopener">打开官网</a>
  </header>

  <main>
    <!-- 加载中 -->
    <section id="stateLoading" class="state">
      <div class="spinner" aria-hidden="true"></div>
      <p>正在打开这篇笔记…</p>
    </section>

    <!-- 不可用（链接错误 / 已删除 / 已过期 / 网络失败） -->
    <section id="stateGone" class="state" hidden>
      <h2 id="goneTitle">这个分享链接已经不在了</h2>
      <p id="goneDesc">链接可能已被分享者删除，或已到期自动失效，也可能输入有误。</p>
      <a class="go" href="https://mytemple.fshby.cc/" target="_blank" rel="noopener">了解 MyTemple 知识库</a>
    </section>

    <!-- 正文 -->
    <article id="stage" class="wrap" hidden>
      <h1 id="docTitle" class="doc-title"></h1>
      <p id="docMeta" class="doc-meta"></p>
      <div id="docBody" class="markdown-body share-body"></div>
      <!-- 正文末尾的署名水印：被截图二次转发也带得走官网短链 -->
      <p class="doc-watermark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 25.5 Q32 9.5 53 25.5" />
            <path d="M17 44 L32 51.5 L47 44" />
          </g>
          <circle cx="32" cy="35.5" r="5.2" fill="currentColor" />
        </svg>
        <span>由 MyTemple 知识库分享 · <a href="https://mytemple.fshby.cc/" target="_blank" rel="noopener">mytemple.fshby.cc</a></span>
      </p>
    </article>

    <!-- 目录索引：markdown 渲染出标题大纲后才会显示（无标题文档自动隐藏）。
         长文快速跳转：浮动按钮 → 右侧抽屉，点条目平滑滚动到对应标题。 -->
    <button id="tocFab" class="toc-fab" type="button" aria-label="打开本文目录" hidden>目录</button>
    <div id="tocMask" class="toc-mask" hidden></div>
    <aside id="tocDrawer" class="toc-drawer" aria-label="本文目录" hidden>
      <div class="toc-head">
        <span class="toc-head-title">本文目录</span>
        <button id="tocClose" class="toc-close" type="button" aria-label="关闭目录">&times;</button>
      </div>
      <nav id="tocList" class="toc-list"></nav>
    </aside>

    <noscript>
      <section class="state">
        <h2>需要开启 JavaScript</h2>
        <p>这篇笔记由 MyTemple 知识库分享，需要浏览器执行脚本才能渲染。</p>
      </section>
    </noscript>
  </main>

  <!-- 底部常驻推广条：不遮挡正文（body 已留出等高留白） -->
  <footer class="promo-bar">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="#f4ead6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 25.5 Q32 9.5 53 25.5" />
        <path d="M17 44 L32 51.5 L47 44" />
      </g>
      <circle cx="32" cy="35.5" r="5.2" fill="#f4ead6" />
    </svg>
    <span>由 MyTemple 知识库生成</span>
    <a href="https://mytemple.fshby.cc/" target="_blank" rel="noopener">mytemple.fshby.cc</a>
  </footer>

  <script src="/cloud-config.js"></script>
  <script src="/share.js?v=cloud-26" type="module"></script>
</body>
</html>
