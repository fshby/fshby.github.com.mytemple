<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>知识库云端 · 分享的笔记</title>

  <!-- 抓取器（微信 / 各 IM 的链接预览）不执行 JS，拿不到单篇标题，
       所以这里给的是**通用品牌信息**：链接卡片至少明确是以什么产品分享的。
       单篇标题在页面加载后由脚本改写 document.title（只影响浏览器标签）。 -->
  <meta name="description" content="有人用 MyTemple 知识库给你分享了一篇笔记，点开即可阅读。" />
  <meta property="og:type" content="article" />
  <meta property="og:site_name" content="MyTemple 知识库" />
  <meta property="og:title" content="MyTemple 知识库 · 分享的笔记" />
  <meta property="og:description" content="有人用 MyTemple 知识库给你分享了一篇笔记，点开即可阅读。" />
  <meta property="og:image" content="https://mytemple-cloud.app.workbuddy.host/og-cover.png" />
  <meta name="theme-color" content="#6b5f45" />

  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/share.css?v=cloud-19" />
</head>
<body>
  <!-- 顶部品牌条：进页第一眼就有来源感 -->
  <header class="brand-bar">
    <span class="brand-tile" aria-hidden="true">
      <svg viewBox="0 0 64 64" focusable="false">
        <g fill="none" stroke="#f4ead6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 25.5 Q32 9.5 53 25.5" />
          <path d="M17 44 L32 51.5 L47 44" />
        </g>
        <circle cx="32" cy="35.5" r="5.2" fill="#f4ead6" />
      </svg>
    </span>
    <span class="brand-name">知识库云端</span>
    <a class="brand-cta" href="https://mytemple.fshby.cc/" target="_blank" rel="noopener">打开官网</a>
  </header>

  <main>
    <!-- 加载中 -->
    <section id="stateLoading" class="state">
      <div class="spinner" aria-hidden="true"></div>
      <p>正在打开这篇笔记…</p>
    </section>

    <!-- 不可用（链接错误 / 已撤销 / 已删除 / 网络失败） -->
    <section id="stateGone" class="state" hidden>
      <h2 id="goneTitle">这个分享链接已经不在了</h2>
      <p id="goneDesc">链接可能已被分享者撤销，或者输入有误。</p>
      <a class="go" href="https://mytemple.fshby.cc/" target="_blank" rel="noopener">了解 MyTemple 知识库</a>
    </section>

    <!-- 正文 -->
    <article id="stage" class="wrap" hidden>
      <h1 id="docTitle" class="doc-title"></h1>
      <p id="docMeta" class="doc-meta"></p>
      <div id="docBody" class="markdown-body share-body"></div>
      <!-- 正文末尾的署名水印：被截图二次转发也带得走官网短链 -->
      <p class="doc-watermark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 25.5 Q32 9.5 53 25.5" />
            <path d="M17 44 L32 51.5 L47 44" />
          </g>
          <circle cx="32" cy="35.5" r="5.2" fill="currentColor" />
        </svg>
        <span>由 MyTemple 知识库分享 · <a href="https://mytemple.fshby.cc/" target="_blank" rel="noopener">mytemple.fshby.cc</a></span>
      </p>
    </article>

    <noscript>
      <section class="state">
        <h2>需要开启 JavaScript</h2>
        <p>这篇笔记由 MyTemple 知识库分享，需要浏览器执行脚本才能渲染。</p>
      </section>
    </noscript>
  </main>

  <!-- 底部常驻推广条：不遮挡正文（body 已留出等高留白） -->
  <footer class="promo-bar">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <g fill="none" stroke="#f4ead6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 25.5 Q32 9.5 53 25.5" />
        <path d="M17 44 L32 51.5 L47 44" />
      </g>
      <circle cx="32" cy="35.5" r="5.2" fill="#f4ead6" />
    </svg>
    <span>由 MyTemple 知识库生成</span>
    <a href="https://mytemple.fshby.cc/" target="_blank" rel="noopener">mytemple.fshby.cc</a>
  </footer>

  <script src="/cloud-config.js"></script>
  <script src="/share.js?v=cloud-19"></script>
</body>
</html>
