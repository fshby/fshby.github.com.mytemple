万物与我为一”体现的理念是（）。","o":["绿水青山就是金山银山","人与自然是生命共同体","保护环境就是保护生产力","良好的生态环境是最普惠的民生福祉"],"a":[1],"src":"2025年4月真题","n":15,"t":"单选","e":"中华民族向来尊重自然、 热爱自然， 绵延5000 多年的中华文明孕育着丰富的生态文化。 “天地与我并生，而万物与我为一”的“天人合一”思想是中华文明的鲜明特色和独特标识， 代表着我们祖先对处理人与自然关系的重要认识。","c":"第十二章 建设社会主义生态文明","p":""},{"id":40,"stem":"我国解决生态环境问题的治本之策是（）。","o":["自由放任发展","最快速度淘汰落后产能","绿色低碳发展","最大力度发展化石能源"],"a":[2],"src":"2025年4月真题","n":16,"t":"单选","e":"绿色发展是新发展理念的重要内容，是发展观的一场深刻革命。习近平指出：“绿色发展，就其要义来讲，是要解决好人与自然和谐共生问题。”要加快推动发展方式绿色低碳转型，坚持把绿色低碳发展作为解决生态环境问题的治本之策，加快形成绿色生产方式和生活方式，厚植高质量发展的绿色底色。","c":"第十二章 建设社会主义生态文明","p":""},{"id":41,"stem":"总体国家安全观的宗旨是（）。","o":["人民安全","科技安全","军事安全","数据安全"],"a":[0],"src":"2025年4月真题","n":17,"t":"单选","e":"总体国家安全观以人民安全为宗旨，坚持国家安全一切为了人民、一切依靠人民，始终把保护人民安全放在最重要的位置，充分发挥广大人民群众积极性、主动性、创造性，汇聚起维护国家安全的强大力量。","c":"第十三章 维护和塑造国家安全","p":""},{"id":42,"stem":"党的二十大将\"统筹发展和安全\"写入党章，其中、安全解决的是（）。","o":["动力问题","策略问题","方向问题","保障问题"],"a":[3],"src":"2025年4月真题","n":18,"t":"单选","e":"党的二十大强调“统筹发展和安全”，并将其写入党章。以习近平同志为核心的党中央着眼统筹发展和安全、把握国家安全主动权，明确提出加快构建新安全格局。发展和安全是两件大事。发展解决的是动力问题，是推动国家和民族赓续绵延的根本支撑；安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石。","c":"第十三章 维护和塑造国家安全","p":""},{"id":43,"stem":"新时代人民军队的使命任务，概括起来就是（）。","o":["一不怕死，二不怕苦","六个必须坚持","三个主体，三个补充","四个战略支撑"],"a":[3],"src":"2025年4月真题","n":19,"t":"单选","e":"进入新时代，以习近平同志为核心的党中央着眼实现中华民族伟大复兴这个国家和民族最高利益，对人民军队使命任务作出新定位、提出新要求，括起来就是“四个战略支撑”。","c":"第十四章 建设巩固国防和强大人民军队","p":""},{"id":44,"stem":"全面推进国防和军队现代化新\"三步走\"战略安排中， 到本世纪中叶要实现的目标是 （）。","o":["实现建军一百年奋斗目标","本世纪实现机械化、信息化","把人民军队全面建成世界一流军","基本实现国防和军队现代化！"],"a":[2],"src":"2025年4月真题","n":20,"t":"单选","e":"到本世纪中叶把人民军队全面建成世界一流军队。党的十九届五中全会进一步充实了国防和军队现代化的目标任务和发展步骤， 明确提出确保2027 年实现建军一百年奋斗目标。 这形成了国防和军队现代化新“三步走”战略安排。","c":"第十四章 建设巩固国防和强大人民军队","p":""},{"id":45,"stem":"一国两制”伟大构想，首先运用于解决（）。","o":["台湾问题","香港和澳门问题","地区发展问题","突发热点问题"],"a":[1],"src":"2025年4月真题","n":21,"t":"单选","e":"一国两制”伟大构想，最早是针对台湾问题提出来的，首先运用于解决香港和澳门问题。","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":""},{"id":46,"stem":"我国对外工作的根本任务是（）。","o":["维护国家利益","与邻为善，以邻为伴","推进大国协调合作","相互尊重、包容"],"a":[0],"src":"2025年4月真题","n":22,"t":"单选","e":"维护国家利益这一我国对外工作的根本任务没有变，也不能变。","c":"综合 / 跨章节","p":""},{"id":47,"stem":"在全人类共同价值中，体现人类共同追求的理念是（）。","o":["团结合作","平衡与协调","民主自由","安全与稳定"],"a":[2],"src":"2025年4月真题","n":23,"t":"单选","e":"全人类共同价值包含当今时代人类价值观优秀成果，和平与发展是人类的共同事业， 公平正义是人类的共同理想，民主自由是人类的共同追求。","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":""},{"id":48,"stem":"新时代党的根本性建设是（）。","o":["组织建设","思想建设","作风建设","政治建设"],"a":[3],"src":"2025年4月真题","n":24,"t":"单选","e":"党的政治建设是党的根本性建设。","c":"第十七章 全面从严治党","p":""},{"id":49,"stem":"新时代推进反腐败斗争的鲜明特征是（）。","o":["标本兼治","从重从严","循序渐进","和风细雨"],"a":[0],"src":"2025年4月真题","n":25,"t":"单选","e":"标本兼治是新时代推进反腐败斗争的鲜明特征。","c":"第十七章 全面从严治党","p":""},{"id":50,"stem":"新时代坚持和发展中国特色社会主义，必须坚定四个自信。在四个自信中更基础，更广泛更深厚的自信是（）","o":["道路自信","理论自信","制度自信","文化自信"],"a":[3],"src":"2025年10月真题","n":1,"t":"单选","e":"文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"22"},{"id":51,"stem":"新时代我国社会主要矛盾是（）","o":["重点突破和整体推进的矛盾","各区域各领域之间发展不平衡的矛盾","人民日益增长的物质文化需要同落后的社会生产之间的矛盾","人民日益增长的美好生活需求和不平衡不充分的发展之间的矛盾"],"a":[3],"src":"2025年10月真题","n":2,"t":"单选","e":"党的十八大以来，经过科学分析，我们党及时作出我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾的重大战略判断。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"25"},{"id":52,"stem":"走和平发展道路是中国式现代化的一个特色，其承继的中华优秀传统文化的理念是（）","o":["天人合一","协和万邦","革故鼎新","取长补短"],"a":[1],"src":"2025年10月真题","n":3,"t":"单选","e":"中国式现代化是走和平发展道路的现代化。中华民族经历了西方列强侵略、凌辱的悲惨历史，深知决不能走西方依靠战争、殖民、掠夺等方式实现现代化的老路。中华民族 “有崇尚和平的文化基因，渴望和平、追求发展始终是中国人民的精神特征，历来强调强”“” “”不执弱富不侮贫，主张协和万邦。","c":"第十章 建设社会主义文化强国","p":"46"},{"id":53,"stem":"党的领导的最高原则是（）","o":["巩固党执政的阶级基础","党中央集中统一领导","厚植党执政的群众基础","加强党执政的经济基础"],"a":[1],"src":"2025年10月真题","n":4,"t":"单选","e":"党中央集中统一领导是党的领导的最高原则，是党保持团结统一和强大战斗力、不断取得胜利的关键所在。","c":"第三章 坚持党的全面领导","p":"66"},{"id":54,"stem":"我们党最大的政治优势是（）","o":["密切联系群众","批评与自我批评","理论联系实际","谦虚谨慎戒骄戒躁"],"a":[0],"src":"2025年10月真题","n":5,"t":"单选","e":"我们党的最大政治优势是密切联系群众，党执政后的最大危险是脱离群众。习近平 “指出： 坚持立党为公、执政为民，始终保持党同人民群众的血肉联系，是马克思主义政”党与生俱来的政治品质和最高从政道德，是衡量党的先进性的根本标尺。","c":"第十七章 全面从严治党","p":"79"},{"id":55,"stem":"改革发展稳定三者密不可分，其中改革是（）","o":["前提","基础","动力","目的"],"a":[2],"src":"2025年10月真题","n":6,"t":"单选","e":"改革发展稳定是我国社会主义现代化建设的三个重要支点。改革是经济社会发展的强大动力，发展是解决一切经济社会问题的关键，稳定是改革发展的前提。","c":"第五章 全面深化改革开放","p":"103"},{"id":56,"stem":"在新发展理念中，注重解决发展内外联动问题的是（）","o":["共享发展","绿色发展","开放发展","协调发展"],"a":[2],"src":"2025年10月真题","n":7,"t":"单选","e":"开放是国家繁荣发展的必由之路，开放发展注重的是解决发展内外联动问题，必须推动形成更大范围、更宽领域、更深层次对外开放格局，不断增强我国国际经济合作和竞争新优势。","c":"第五章 全面深化改革开放","p":"115"},{"id":57,"stem":"实施乡村振兴战略的总目标是（）","o":["城乡融合发展","农业农村现代化","保障粮食供给","农业农村优先发展"],"a":[1],"src":"2025年10月真题","n":8,"t":"单选","e":"实施乡村振兴战略，农业农村现代化是总目标，坚持农业农村优先发展是总方针， 产业兴旺、生态宜居、乡风文明、治理有效、生活富裕是总要求，建立健全城乡融合发展体制机制和政策体系是制度保障。","c":"第六章 推动高质量发展","p":"131"},{"id":58,"stem":"在国家发展中始终具有基础性、先导性、全局性地位的是（）","o":["教育","人才","科技","资源"],"a":[0],"src":"2025年10月真题","n":9,"t":"单选","e":"教育是国家经济社会发展的支撑力量，在国家发展中始终具有基础性先导性全局性地位。","c":"第七章 教育、科技、人才","p":"141"},{"id":59,"stem":"全体人民共同持续参与、各个民族共同平等享有体现了全过程人民民主具有 （）","o":["稳定性","广泛性","实用性","针对性"],"a":[1],"src":"2025年10月真题","n":10,"t":"单选","e":"全过程人民民主是最广泛的民主。全过程人民民主是全体人民共同持续参与，各个民族共同平等享有，不同地域、不同领域、不同层级、不同群体均实现全面覆盖的民主体系，是最广泛的民主。","c":"第八章 发展全过程人民民主","p":"168"},{"id":60,"stem":"习近平法治思想的主要内容集中体现为（）","o":["三个务必","六个必须坚持","七个着力","十一个坚持"],"a":[3],"src":"2025年10月真题","n":11,"t":"单选","e":"习近平法治思想的主要内容集中体现为十一个坚持:坚持党对全面依法治国的领导；坚持以人民为中心；坚持中国特色社会主义法治道路；坚持依宪治国、依宪执政；坚持在法治轨道上推进国家治理体系和治理能力现代化；坚持建设中国特色社会主义法治体系；坚持依法治国、依法执政、依法行政共同推进，法治国家、法治政府、法治社会一体建设；坚持全面推进科学立法、严格执法、公正司法、全民守法；坚持统筹推进国内法治 “和涉外法治；坚持建设德才兼备的高素质法治工作队伍；坚持抓住领导干部这个关键少”数。","c":"第九章 全面依法治国","p":"182"},{"id":61,"stem":"全面推进依法治国的总抓手是（）","o":["建设中国特色社会主义法治体系","正确处理政治和法治关系","坚持依法治国和以德治国相结合","正确处理改革和法治关系"],"a":[0],"src":"2025年10月真题","n":12,"t":"单选","e":"全面依法治国是一个庞大的系统工程，涉及改革发展稳定、内政外交国防、治党治 “国治军等各个方面。习近平指出： 全面推进依法治国涉及很多方面，在实际工作中必须有一个总揽全局、牵引各方的总抓手，这个总抓手就是建设中国特色社会主义法治体系。","c":"第九章 全面依法治国","p":"189"},{"id":62,"stem":"六合同风四海一家体现的中华文明的突出特性是（）","o":["创新性","和平性","连续性","统一性"],"a":[3],"src":"2025年10月真题","n":13,"t":"单选","e":"六合同风四海一家的核心是强调天下各地风俗统一、民众如同一家人，体现了中华文明统一性的突出特性。","c":"第十章 建设社会主义文化强国","p":""},{"id":63,"stem":"新时代新征程解决民生问题的总钥匙是（）","o":["统筹","发展","管理","治理"],"a":[1],"src":"2025年10月真题","n":14,"t":"单选","e":"发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"266"},{"id":64,"stem":"2024 年 12 月 4 日,我国被联合国教科文组织列入非物质文化遗产代表作名录的是（）","o":["春节","端午节","中秋节","重阳节"],"a":[0],"src":"2025年10月真题","n":15,"t":"单选","e":"2024 年 12 月 4 日，我国被联合国教科文组织列入非物质文化遗产代表作名录的 “—— ”是春节中国人庆祝传统新年的社会实践。","c":"第十章 建设社会主义文化强国","p":""},{"id":65,"stem":"绿色发展的要义是（）","o":["解决好人与人和谐相处问题","处理好中国与世界的关系","解决好人与自然和谐共生的问题","处理好国家与社会的关系"],"a":[2],"src":"2025年10月真题","n":16,"t":"单选","e":"绿色是永续发展的必要条件和人民对美好生活追求的重要体现，绿色发展注重的是解决人与自然和谐共生问题，必须实现经济社会发展和生态环境保护协同共进，加快发展方式绿色转型，推动形成绿色低碳的生产方式和生活方式。","c":"第十二章 建设社会主义生态文明","p":"115"},{"id":66,"stem":"全球携手共建清洁美丽世界,应对生态环境挑战,必须坚持的原则是（）","o":["单边主义","多边主义","利己主义","孤立主义"],"a":[1],"src":"2025年10月真题","n":17,"t":"单选","e":"建设人与自然和谐共生的地球家园，要顺应世界各国人民对美好生态环境的需要， 以绿色转型为驱动，坚持多边主义，推动全球环境治理体系更加公平合理，携手共建清洁美丽世界。","c":"第十二章 建设社会主义生态文明","p":"255"},{"id":67,"stem":"构建新安全格局,应对各领域安全风险和挑战的首要任务是维护（）","o":["政治安全","太空安全","金融安全","网络安全"],"a":[0],"src":"2025年10月真题","n":18,"t":"单选","e":"构建统筹各领域安全的新安全格局，必须把维护政治安全作为应对各领域安全风险挑战的首要任务。政治安全是国家安全的根本。","c":"第十三章 维护和塑造国家安全","p":"267"},{"id":68,"stem":"人民军队的主责主业是备战打仗,必须树立唯一的根本的标准是（）","o":["领导力","组织力","战斗力","执行力"],"a":[2],"src":"2025年10月真题","n":19,"t":"单选","e":"人民军队永远是战斗队，人民军队的生命力在于战斗力，主责主业是备战打仗。把战斗力作为唯一的根本的标准，是有效履行人民军队根本职能的要求，也是提高军队建设质量和效益的要求。","c":"第十四章 建设巩固国防和强大人民军队","p":"291"},{"id":69,"stem":"一国两制方针最高原则是（）","o":["维护国家主权、安全、发展利益","全面管治权和高度自治权相统一","爱国者治港、 爱国者治澳","依法治港治澳"],"a":[0],"src":"2025年10月真题","n":20,"t":"单选","e":"维护国家主权、安全、发展利益是一国两制方针的最高原则，在这个前提下，香港、澳门保持原有的资本主义制度长期不变，享有高度自治权。","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":"299"},{"id":70,"stem":"新时代党解决台湾问题的总体方略中,统一的战略支撑是坚持（）","o":["推动两岸关系融合发展","粉碎台独分裂图谋","决不放弃使用武力","反对外部势力干涉"],"a":[2],"src":"2025年10月真题","n":21,"t":"单选","e":"面贯彻新时代党解决台湾问题的总体方略，必须坚持党中央对对台工作的集中统一领导，这是统一的根本保深刻回答了推进祖国统一的一系列重大理论和实践问题，是我们党对台新时代党解决台湾问题的总体方略内涵丰富、逻辑严密、系统完备，位；坚持 “在祖国大陆发展进步基础上解决台湾问题，这是统一的战略思路；坚持和平统一、一国” “”两制基本方针，这是统一的大政方针；坚持一个中国原则和九二共识 ,这是统一的政治基础；坚持推动两岸关系和平发展、融合发展，这是统一的实践途径；坚持团结台湾同 “”胞、争取台湾民心，这是统一的根本动力；坚持粉碎台独分裂图谋，这是统一的必然要求；坚持反对外部势力干涉，这是统一的外部条件；坚持绝不承诺放弃使用武力，这是统一的战略支撑。P310-P311","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":"310"},{"id":71,"stem":"推动构建新型国际关系的原则是（）","o":["外交为民，共同发展","相互尊重、公平正义、合作共赢","总体稳定、均衡发展","反对冷战思维，反对双重标准"],"a":[1],"src":"2025年10月真题","n":22,"t":"单选","e":"推动构建新型国际关系，就是要秉持相互尊重、公平正义、合作共赢原则，走出一条对话而不对抗、结伴而不结盟的国与国交往新路。","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":"323"},{"id":72,"stem":"共建一带一路应该坚持的理念是（）","o":["双赢、多赢、共赢","平等、平均、平衡","互商、互谅、互利","开放、绿色、廉洁"],"a":[3],"src":"2025年10月真题","n":23,"t":"单选","e":"共建一带一路 ,秉持共商共建共享原则，坚持开放、绿色、廉洁理念，以高标准、可持续、惠民生为目标，全面推进政策沟通、设施联通、贸易畅通、资金融通、民心相通，努力建设和平之路、繁荣之路、开放之路、绿色之路、创新之路、文明之路。","c":"第五章 全面深化改革开放","p":"334"},{"id":73,"stem":"摆在党的建设总体布局首位的是（）","o":["纪律建设","组织建设","思想建设","政治建设"],"a":[3],"src":"2025年10月真题","n":24,"t":"单选","e":"党的政治建设是党的根本性建设。把政治建设纳入党的建设总体布局并摆在首位， 是新时代我们党对马克思主义党建理论的重大创新，体现了我们党对共产党执政规律的深刻认识，有着充分的理论和实践依据。P344-345","c":"第十七章 全面从严治党","p":"344"},{"id":74,"stem":"我们党给出的跳出历史周期率的第二个答案是（）","o":["社会革命","民主","自我革命","集中"],"a":[2],"src":"2025年10月真题","n":25,"t":"单选","e":"跳出历史周期率问题，是关系党千秋伟业的一个重大问题。党的自我革命是跳出历史周期率的第二个答案。P356 26、【简答题】“”两个结合的完整表述是什么? 答案：“”两个结合：马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合。P4 27、【简答题】 “”实现第一个百年目标后我们党协调推进的四个全面战略布局是什么? 答案：全面深化改革、全面依法治国、全面建设社会主义现代化国家、全面从严治党。P29-P32 28、【简答题】如何构建新发展格局? 答案：（1）着力推动实施扩大内需战略同深化供给侧结构性改革有机结合；（2）着力发展实体经济；（3）着力加快科技自立自强；（4）着力推动产业链供应链优化升级。P125-P129 29、【简答题】简述党在新时代的强军目标? 答案：党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。P282-P284 30、【简答题】怎样理解当今世界正在经历百年未有之大变局? 答案：(1)世界多极化、经济全球化、社会信息化、文化多样化深入发展，和平、发展、 合作、共赢的历史潮流不可阻挡；世界面临的不稳定性不确定性突出，全球性问题加剧， 人类处在一个危机交织叠加、风险日益增多的时代。 (2) 国际力量对比深刻变化。 (3)新一轮科技革命和产业变革深入发展。 (4)国际体系和国际秩序深度调整。P316-P317 31、【论述题】不谋全局者，不足谋一域。改革推进到现在，必须在深入调查研究的基础上提出全面深化改革的顶层设计和总体规划，提出改革的战略目标、战略重点、优先顺序、主攻 “方向、工作机制、推进方式，提出改革总体方案、路线图、时间表。这也应该同两个一百” “”年奋斗目标相适应。实现两个一百年奋斗目标，要以改革开放为抓手，要有相应的改革开放举措。- 摘自《习近平著作选读》第一卷，人民出版社 2023 年版，试述全面深化改革路线图的主要内容。 答案：紧紧围绕使市场在资源配置中起决定性作用和更好发挥政府作用，深化经济体制改革；紧紧围绕坚持党的领导、人民当家作主、依法治国有机统一，深化政治体制改革；紧紧围绕建设社会主义核心价值体系、社会主义文化强国，深化文化体制改革；紧紧围绕更好保障和改善民生、促进社会公平正义，深化社会体制改革；紧紧围绕建设美丽中国，深化生态文明体制改革；紧紧围绕提高科学执政、民主执政、依法执政水平，深化党的建设制度改革。P99","c":"第五章 全面深化改革开放","p":"356"},{"id":75,"stem":"中国特色社会主义事业总体布局是（）","o":["五位一体","四个全面","十个明确","一国两制"],"a":[0],"src":"真题模拟","n":1,"t":"单选","e":"明确中国特色社会主义事业总体布局是经济建设、政治建设、文化建设、社会建设、生态文明建设五位一体。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"6"},{"id":76,"stem":"习近平新时代中国特色社会主义思想创立的时代背景是（）","o":["两个大局”同步交织、相互激荡","全球治理体系正在发生深刻变革","国际力量对比正在发生近代以来最具革命性的变化","中国发挥着世界和平建设者、全球发展贡献者、国际秩序维护者的重要作用"],"a":[0],"src":"真题模拟","n":2,"t":"单选","e":"世界百年未有之大变局加速演进。世界之变、时代之变、历史之变正以前所未有的方式展开，新一轮科技革命和产业变革深入发展，国际体系和国际秩序深度调整，和平、发展，合作、共赢的历史潮流不可阻挡，“东升西降”的发展趋势日益显著。与此同时，世界进入新的动荡变革期，冷战思维和集团政治回潮，单边主义、保护主义抬头，经济全球化遭遇逆流，和平赤字、发展赤字、安全赤字、治理赤字加重，人类社会又一次站在历史的十字路口。面对复杂多变的国际环境带来的新矛盾新挑战，以习近平同志为核心的党中央深刻把握中国和世界关系的历史性变化，深刻回答“人类社会何去何从”的历史之同，既在谋求我国发展中促进世界共同发展，又在世界共同发展中推进我国发展，为解决世界经济、国际安全、全球治理、人类文明发展等一系列重大问题提供了新的方向、新的方案、新的选择。习近平新时代中国特色社会主义思想，正是在把握世界发展大势、维护人类共同利益、推动中国与世界携手并进的过程中创立并不断丰富发展的。","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":""},{"id":77,"stem":"如果把习近平新时代中国特色社会主义思想比作一座理论大厦，（）就是支撑整座大厦的主体部分。","o":["八个明确","十个明确","十四个坚持","十三个方面成就"],"a":[1],"src":"真题模拟","n":3,"t":"单选","e":"十个明确”是习近平新时代中国特色社会主义思想的主体内容，集中体现了这一思想体系的主要观点和基本精神，构成了这一思想体系的四梁八柱，发挥着统摄作用。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"7"},{"id":78,"stem":"如何跳出治乱兴衰的历史周期率？经过百年奋斗特别是党的十八大以来新的实践，我们党给出了第二个答案，这就是（）","o":["人民监督","民主新路","自我革命","自我净化"],"a":[2],"src":"真题模拟","n":4,"t":"单选","e":"面对党面临的重大风险考验和党内存在的突出问题，以习近平同志为核心的党中央坚定不移坚持和加强党的全面领导，坚定不移推进全面从严治党，深入推进新时代党的建设新的伟大工程，找到了自我革命这个跳出治乱兴衰历史周期率的第二个答案，管党治党宽松软状况得到根本扭转，我们这个世界上最大的马克思主义执政党更加团结统一、更加坚强有力。","c":"第十七章 全面从严治党","p":"3"},{"id":79,"stem":"习近平新时代中国特色社会主义思想续写了（）新篇章。","o":["马克思主义中国化时代化","新时代新作为","高质量发展","新发展理念"],"a":[0],"src":"真题模拟","n":5,"t":"单选","e":"习近平新时代中国特色社会主义思想继承和发展马克思列宁主义、毛泽东思想、邓小平理论、“三个代表”重要思想、科学发展观，是马克思主义在当代中国发展的最新理论成果，开辟了马克思主义中国化时代化新境界。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"9"},{"id":80,"stem":"（）是中华民族的根和魂，是中国特色社会主义植根的文化沃土。","o":["中国特色社会主义经济","中国特色社会主义政治","中国特色社会主义制度","中国特色社会主义文化"],"a":[3],"src":"真题模拟","n":6,"t":"单选","e":"习近平新时代中国特色社会主义思想坚持把马克思主义基本原理同中华优秀传统文化相结合，不断夯实马克思主义中国化时代化的历史基础和群众基础。只有植根本国、本民族历史文化沃土，马克思主义真理之树才能根深叶茂。习近平新时代中国特色社会主义思想坚定历史自信、文化自信，坚持古为今用、推陈出新，把马克思主义思想精髓同中华优秀传统文化精华贯通起来、同人民群众日用而不觉的共同价值观念融通起来，将中华民族的伟大精神和丰富智慧更深层次地注入马克思主义，聚变为新的理论优势，不断赋予科学理论鲜明的中国特色，让马克思主义更深地扎根于中国的土地上、扎根于亿万人民的心中。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"5"},{"id":81,"stem":"习近平新时代中国特色社会主义思想根植于（）。","o":["坚持党的领导","坚持马克思主义","坚持和发展中国特色社会主义实践","坚持人民民主专政"],"a":[2],"src":"真题模拟","n":7,"t":"单选","e":"习近平新时代中国特色社会主义思想，植根于新时代坚持和发展中国特色社会主义的伟大实践，坚持理论指导和实践探索相统一，在指导实践、推动实践中展现出巨大真理力量和独特思想魅力，是经过实践检验、富有实践伟力的强大思想武器.","c":"第一章 新时代坚持和发展中国特色社会主义","p":"13"},{"id":82,"stem":"坚持和发展中国特色社会主义，总任务是（）。","o":["完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化","建设中国特色社会主义法治体系、建设社会主义法治国家","实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国","建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队"],"a":[2],"src":"真题模拟","n":8,"t":"单选","e":"明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴.","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"6"},{"id":83,"stem":"全面深化改革的总目标是（）。","o":["坚定道路自信、理论自信、制度自信、文化自信","完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化","建设中国特色社会主义法治体系、建设社会主义法治国家","坚持和发展中国特色社会主义"],"a":[1],"src":"真题模拟","n":9,"t":"单选","e":"明确全面深化改革总目标是完善和发展中国特色社会主义制度、推进国家治理体系和治理能力现代化.","c":"第五章 全面深化改革开放","p":"6"},{"id":84,"stem":"习近平新时代中国特色社会主义思想内容十分丰富，涵盖改革发展稳定、内政外交国防、治党治国治军等各个领域、各个方面，构成了一个系统完整、逻辑严密、相互贯通的思想理论体系。下面是指导思想层面的表述的是（）。","o":["四个全面","十四个坚持","十个明确","四个伟大"],"a":[2],"src":"真题模拟","n":10,"t":"单选","e":"十个明确”是习近平新时代中国特色社会主义思想的主体内容，集中体现了这一思想体系的主要观点和基本精神，构成了这一思想体系的四梁八柱，发挥着统摄作用。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"7"},{"id":85,"stem":"实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国。这是（）。","o":["坚持和发展中国特色社会主义的总依据","坚持和发展中国特色社会主义的总布局","坚持和发展中国特色社会主义的总任务","坚持和发展中国特色社会主义的总安排"],"a":[2],"src":"真题模拟","n":11,"t":"单选","e":"明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"6"},{"id":86,"stem":"把握历史新方位，顺应时代新特点，党的十九大提出分（）实现全面建成社会主义现代化强国的战略安排。","o":["两个阶段","三个阶段","四个阶段","五个阶段"],"a":[0],"src":"真题模拟","n":12,"t":"单选","e":"明确坚持和发展中国特色社会主义，总任务是实现社会主义现代化和中华民族伟大复兴，在全面建成小康社会的基础上，分两步走在本世纪中叶建成富强民主文明和谐美丽的社会主义现代化强国，以中国式现代化推进中华民族伟大复兴。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"6"},{"id":87,"stem":"新时代要坚持以人民为中心，在推动社会全面进步中促进（）的全面发展。","o":["人","经济","政治","文化"],"a":[0],"src":"真题模拟","n":13,"t":"单选","e":"十个明确\"中，明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想，发展全过程人民民主，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"6"},{"id":88,"stem":"党的十九届六中全会进一步明确，必须坚持（）的发展思想，发展全过程人民民主，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展","o":["群众路线是根本工作路线","党的建设","经济社会协调发展","以人民为中心"],"a":[3],"src":"真题模拟","n":14,"t":"单选","e":"十个明确\"中，明确新时代我国社会主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾，必须坚持以人民为中心的发展思想，发展全过程人民民主，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展。","c":"第八章 发展全过程人民民主","p":"6"},{"id":89,"stem":"（）的发展理念，相互贯通、相互促进，是具有内在联系的集合体，要统一贯彻，不能顾此失彼，也不能相互替代。","o":["改革、和谐、绿色、开放、共享","创新、协调、和谐、开放、共赢","创新、和谐、绿色、开放、发展","创新、协调、绿色、开放、共享"],"a":[3],"src":"真题模拟","n":15,"t":"单选","e":"把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全.","c":"第五章 全面深化改革开放","p":"7"},{"id":90,"stem":"建设充分发挥（），更好发挥政府作用的经济体制。","o":["市场作用","服务业动能","社会作用","社会福利补给"],"a":[0],"src":"真题模拟","n":16,"t":"单选","e":"明确必须坚持和完善社会主义基本经济制度，使市场在资源配置中起决定性作用，更好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全；明确党在新时代的强军目标。","c":"第六章 推动高质量发展","p":"7"},{"id":91,"stem":"关于党在新时代的强军目标，下列说法正确的是（）","o":["力争到本世纪中叶基本实现国防和军队现代化","到2035年把人民军队全面建成世界一流军队","确保到2020年全面实现机械化","建设一支听党指挥、能打胜仗、作风优良的人民军队"],"a":[3],"src":"真题模拟","n":17,"t":"单选","e":"明确党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队；","c":"第十四章 建设巩固国防和强大人民军队","p":"7"},{"id":92,"stem":"进入新时代的重要依据是（）","o":["发展的不平衡","社会主要矛盾变化","发展的不充分","社会基本矛盾变化"],"a":[1],"src":"真题模拟","n":18,"t":"单选","e":"中国特色社会主义进入新时代，是我国社会主要矛盾发生新变化的反映。社会主要矛盾状况及其变化，是认识把握社会发展阶段性特征的重要依据。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"23"},{"id":93,"stem":"中华民族迎来了从站起来、富起来、强起来的伟大飞跃，实现（）进入了不可逆转的历史进程。","o":["中华民族伟大复兴","全面推进乡村振兴","全面建成小康社会","建设社会主义现代化"],"a":[0],"src":"真题模拟","n":19,"t":"单选","e":"中国人民的前进动力更加强大、奋斗精神更加昂扬、必胜信念更加坚定，焕发出更为强烈的历史自觉和主动精神，中国共产党和中国人民正信心百倍推进中华民族从站起来、富起来到强起来的伟大飞跃。改革开放和社会主义现代化建设深入推进，书写了经济快速发展和社会长期稳定两大奇迹新篇章，我国发展具备了更为坚实的物质基础、更为完善的制度保证，实现中华民族伟大复兴进入了不可逆转的历史进程。","c":"第五章 全面深化改革开放","p":"28"},{"id":94,"stem":"新时代十年的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、（）上具有里程碑意义。","o":["共和国史","中华民族发展史","人类文明发展史","社会主义建设史"],"a":[1],"src":"真题模拟","n":20,"t":"单选","e":"新时代的伟大变革，在党史、新中国史、改革开放史、社会主义发展史、中华民族发展史上具有里程碑意义。","c":"第五章 全面深化改革开放","p":"28"},{"id":95,"stem":"经过长期努力，中国特色社会主义进入新时代，这是我国发展新的（）。","o":["历史地位","历史时期","历史阶段","历史方位"],"a":[3],"src":"真题模拟","n":21,"t":"单选","e":"中国特色社会主义是党和人民历经千辛万苦、付出巨大代价取得的根本成就，是实现中华民族伟大复兴的必由之路。党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"14"},{"id":96,"stem":"党的十八大以来，我们党的全部理论和实践探索都是围绕（）这个主题来展开、深化和拓展的。","o":["什么是社会主义，怎样建设社会主义","建设一个什么样的党，怎样建设党","实现什么样发展，怎样发展","坚持和发展中国特色社会主义"],"a":[3],"src":"真题模拟","n":22,"t":"单选","e":"中国特色社会主义是党和人民历经千辛万苦、付出巨大代价取得的根本成就。是实现中华民族伟大复义的必由之路。党的十八大以来，中国特色社会主义进入新时代，这是我国发展新的历史方位。以习近平同志为核心的党中央团结带领全党全国各族人民砥砺前行，推动党和国家事业取得历史性成就、发生历史性变革，使中国特色社会主义展现出强大生命力。要更加自觉地坚定中国特色社会主义道路自信、理论自信、制度自信、文化自信，以奋发有为的精神，一以贯之地把新时代中国特色社会主义不断推向前进。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"14"},{"id":97,"stem":"中国特色社会主义的战略布局是（）。","o":["十个明确","十四个坚持","四个全面","五位一体"],"a":[2],"src":"真题模拟","n":23,"t":"单选","e":"新时代中国特色社会主义是我们党领导人民进行伟大社会革命的成果，也是我们党领导人民进行伟大社会革命的继续，必须一以贯之进行下去。要全面贯彻党的基本理论、基本路线、基本方略，统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局，以咬定青山不放松的定力持续奋斗，谱写新时代中国特色社会主义更加绚丽的华章。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"29"},{"id":98,"stem":"中国特色社会主义的总体布局是（）。","o":["三位一体","四位一体","五位一体","六位一体"],"a":[2],"src":"真题模拟","n":24,"t":"单选","e":"新时代中国特色社会主义是我们党领导人民进行伟大社会革命的成果，也是我们党领导人民进行伟大社会革命的继续，必须一以贯之进行下去。要全面贯彻党的基本理论、基本路线、基本方略，统筹推进“五位一体”总体布局和协调推进“四个全面”战略布局，以咬定青山不放松的定力持续奋斗，谱写新时代中国特色社会主义更加绚丽的华章。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"29"},{"id":99,"stem":"我们坚持和发展中国特色社会主义，推动物质文明、政治文明、精神文明、社会文明、生态文明协调发展，成功推进和拓展了（），创造了人类文明新形态。","o":["西方式现代化","中心式现代化","中国特色现代化","中国式现代化"],"a":[3],"src":"真题模拟","n":25,"t":"单选","e":"要按照“五位一体”总体布局的整体性目标要求，坚持以经济建设为中心，努力推动社会主义物质文明、政治文明、精神文明、社会文明、生态文明协调发展，不断推进和拓展中国式现代化，不断丰富和发展人类文明新形态。","c":"第十章 建设社会主义文化强国","p":"31"},{"id":100,"stem":"实现中国梦必须走中国道路，这就是（）。","o":["中华民族大团结之路","社会发展之路","人民民主专政之路","中国特色社会主义道路"],"a":[3],"src":"真题模拟","n":26,"t":"单选","e":"实践证明，中国特色社会主义道路是中国走向发展繁荣的正确道路。实现中华民族伟大复兴的途径,实现中国梦的途径.","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":101,"stem":"中国特色社会主义事业的领导核心是（）","o":["民进党","民盟","中国共产党","中国国民党"],"a":[2],"src":"真题模拟","n":27,"t":"单选","e":"党同人民群众始终保持血肉联系，中国共产党在世界形势深刻变化的历史进程中始终走在时代前列，在应对国内外各种风险和考验的历史进程中始终成为全国人民的主心骨，在坚持和发展中国特色社会主义的历史进程中始终成为坚强领导核心。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"28"},{"id":102,"stem":"改革开放以来党的全部理论和实践的主题是（）","o":["中华民族的伟大复兴","中国道路","中国特色社会主义","解放和发展生产力"],"a":[2],"src":"真题模拟","n":29,"t":"单选","e":"改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是：开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度，发展了中国特色社会主义文化。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"20"},{"id":103,"stem":"（）是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。","o":["文化自信","文化自觉","文化软实力","中国特色社会主义文化"],"a":[0],"src":"真题模拟","n":30,"t":"单选","e":"我们说要坚定中国特色社会主义道路自信、理论自信、制度自信，说到底是要坚定文化自信，文化自信是更基础、更广泛、更深厚的自信，是一个国家、一个民族发展中最基本、最深沉、最持久的力量。","c":"第十章 建设社会主义文化强国","p":"22"},{"id":104,"stem":"扎实推动共同富裕，不断增强人民群众（）","o":["获得感、满足感、安定感","获得感、幸福感、安全感","得到感、满足感、安全感","得到感、幸福感、安定感"],"a":[1],"src":"真题模拟","n":31,"t":"单选","e":"人民生活全方位改善，社会治理水平大幅度提升，人民群众获得感、幸福感、安全感显著增强.","c":"第十一章 以保障和改善民生为重点加强社会建设","p":"28"},{"id":105,"stem":"二十大报告指出，从现在起，中国共产党的（）就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标。","o":["根本任务","重要目标","中心任务","根本目的"],"a":[2],"src":"真题模拟","n":32,"t":"单选","e":"实现中华民族伟大复兴，是中国共产党的历史使命。新时代新征程中国共产党的中心任务，就是团结带领全国各族人民全面建成社会主义现代化强国、实现第二个百年奋斗目标，以中国式现代化全面推进中华民族伟大复兴。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"36"},{"id":106,"stem":"2021年中国实现了9899万农村贫困人口全部脱贫，832个贫困县全部摘帽，12.8万个贫困村全部出列，区域性整体贫困得到解决，完成了消除（）的艰巨任务。","o":["区域贫困","绝对贫困","整体贫困","相对贫困"],"a":[1],"src":"真题模拟","n":33,"t":"单选","e":"我国脱贫攻坚战取得了全面胜利，现行标准下9899万农村贫困人口全部脱贫，832个贫困县全部摘帽，128万个贫困村全部出列，区城性整体贫困得到解决，完成了消除绝对贫困的艰巨任务，创造了又一个彪炳更册的人间奇速！这是中国人民的伟大光荣，是中国共产党的伟大光荣，是中华民族的伟大光荣！一习近平在全国脱贫攻坚总结表彰大会上的讲话.","c":"第十一章 以保障和改善民生为重点加强社会建设","p":"38"},{"id":107,"stem":"通过自身的不断发展与强大，继承并创造中华民族的优秀文化以及先进的文明成果，进而使中华民族再次处于世界领先的地位，再次以高昂的姿态屹立于世界民族之林，这是（）的表现。","o":["人民幸福","民族振兴","国家富强","社会稳定"],"a":[1],"src":"真题模拟","n":34,"t":"单选","e":"实现中华民族伟大复兴的中国梦，本质是国家富强、民族振兴、人民幸福。国家富强，就是要在全面建成小康社会基础上，全面建成富强民主文明和谐美丽的社会主义现代化强国；民族振兴，就是要使中华民族更加坚强有力地自立于世界民族之林，为大类作出新的更大的贡献；人民幸福，就是要坚持以人民为中心，增进人民福祉，促进人的全面发展，朝着共同富裕方向稳步前进。","c":"第十章 建设社会主义文化强国","p":"37"},{"id":108,"stem":"中华民族伟大复兴的中国梦是（）相统一的梦。","o":["国家情怀、民族情怀、人民情怀","国家情怀、民族情怀、社会情怀","民族情怀、世界情怀、人民情怀","国家情怀、家庭情怀、人民情怀"],"a":[0],"src":"真题模拟","n":35,"t":"单选","e":"中国梦把国家的追求、民族的向往、人民的期盼融为一体，是国家的梦、民族的梦，也是每一个中国人的梦。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"37"},{"id":109,"stem":"实现中国梦必须凝聚中国力量，这就是（）。","o":["各族人民大团结的力量","中国共产党的领导力量","中高速增长的经济力量。","保障有力的军事力量"],"a":[0],"src":"真题模拟","n":36,"t":"单选","e":"要大力弘扬团结奋斗精神，不断巩固全国各族人民大团结，充分发挥亿万人民的创造伟力，形成同心共圆中国梦的强大合力，继续把中华民族伟大复兴的历史伟业推向前进！","c":"第一章 新时代坚持和发展中国特色社会主义","p":"54"},{"id":110,"stem":"两个一百年”的奋斗目标中第一个百年目标是（）。","o":["建立一个独立的完整的工业体系和国民经济体系","基本实现社会主义现代化","建成更高水平的小康社会","建成社会主义现代化国家"],"a":[2],"src":"真题模拟","n":37,"t":"单选","e":"2021年7月1日，习近平在庆祝中国共产党成立100周年大会上庄严宣告：“经过全党全国各族人民持续奋斗，我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题，正在意气风发向着全面建成社会主义现代化强国的第二个百年奋斗目标迈进。全面建成小康社会是我国社会主义现代化进程中的一座重要里程碑。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"38"},{"id":111,"stem":"全面建设社会主义现代化国家进程中的第一个阶段，从2020年到2035年，（）。","o":["把我国建设成富强民主文明和谐美丽的社会主义现代化强国","实现中华民族伟大复兴的中国梦","全面建成小康社会","基本实现社会主义现代化"],"a":[3],"src":"真题模拟","n":38,"t":"单选","e":"全面建成小康社会不是终点，而是新生活、新奋斗的起点。党的十九大作出了从全而建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排。党的二十大进一步明确，全面建成社会主义现代化强国总的战略安排是分两步走：从2020年到 2035年基本实现社会主义现代化；从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"40"},{"id":112,"stem":"改革开放之后，我们党提出的“三步走”战略的第三步，即基本实现现代化，将提前（）年完成。","o":["12年","15年","18年","30年"],"a":[1],"src":"真题模拟","n":39,"t":"单选","e":"全面建成社会主义现代化强国的战略安排，把基本实现社会主义现代化的时间提前了15年，提出了全面建设社会主义现代化国家、全面推进中华民族伟大复兴的更高目标，明确了全面建成社会主义现代化强国的时间表，为当前和今后一个历史时期我国发展指明了方向、规划了蓝图。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"41"},{"id":113,"stem":"从全面建设社会主义现代化国家进程的阶段安排看来，到2035年，我国将（）。","o":["全面建成小康社会","实现中华民族伟大复兴的中国梦","把我国建设成为富强美丽文明和谐的社会现代化强国。","基本实现社会主义现代化"],"a":[3],"src":"真题模拟","n":40,"t":"单选","e":"全面建成小康社会不是终点，而是新生活、新奋斗的起点。党的十九大作出了从全而建成小康社会到基本实现社会主义现代化，再到全面建成社会主义现代化强国的战略安排。党的二十大进一步明确，全面建成社会主义现代化强国总的战略安排是分两步走：从2020年到 2035年基本实现社会主义现代化；从2035年到本世纪中叶把我国建成富强民主文明和谐美丽的社会主义现代化强国。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"40"},{"id":114,"stem":"党的十九大提出，到（）“各方面制度更加完善，国家治理体系和治理能力现代化基本实现”。","o":["2035年","2030年","2025年","2020年"],"a":[0],"src":"真题模拟","n":41,"t":"单选","e":"到2035年，我国发展的总体目标是：经济实力、科技实力、综合国力大幅跃升，人均国内生产总值迈上新的大台阶，达到中等发达国家水平；基本实现国家治理体系和治理能力现代化，全过程人民民主制度更加健全，基本建成法治国家、法治政府、法治社会；国家安全体系和能力全面加强，基本实现国防和军队现代化等。","c":"第九章 全面依法治国","p":"40"},{"id":115,"stem":"我们既不走封闭僵化的老路，也不走改旗易帜的邪路，要坚定不移走（）。","o":["中国特色社会主义道路","经济社会发展道路","人民民主专政的道路","文化强国之路"],"a":[0],"src":"真题模拟","n":42,"t":"单选","e":"坚持中国特色社会主义道路。中国式现代化举的是中国特色社会主义旗帜，走的是中国特色社会主义道路。推进中国式现代化，必须坚持以经济建设为中心，坚持四项基本原则，坚持改革开放，坚持独立自主、自力更生，坚持道不变、志不改，既不走封闭僵化的老路，也不走改旗易帜的邪路，始终坚持和发展中国特色社会主义。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"50"},{"id":116,"stem":"中国共产党的初心和使命是（）","o":["推翻三座大山，建立新中国","为中国人民谋幸福、为中华民族谋复兴","让全体中国人都过上更好的日子","实现祖国统一大业"],"a":[1],"src":"真题模拟","n":43,"t":"单选","e":"全面建成小康社会，高质量完成了社会主义现代化建设“三步走”战略的第二步，使中华民族伟大复兴向前迈出新的一大步。如期全面建成小康社会，兑现了党向人民、向历史作出的庄严承诺，践行了党为中国人民谋幸福、为中华民族谋复兴的初心使命。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"39"},{"id":117,"stem":"（）是实现中华民族伟大复兴的根本保证。","o":["中华民族团结","中国人民主体地位","社会和谐","中国共产党"],"a":[3],"src":"真题模拟","n":44,"t":"单选","e":"中国共产党领导是实现中华民族伟大复兴的根本保证。只有坚持中国共产党的领导，才能以坚定的必胜信念、强烈的历史自觉和主动精神，凝聚起全党全国各族人民为实现中华民族伟大复兴攻坚克难、团结奋斗的磅礴伟力，确保中华民族伟大复兴号巨轮劈波斩浪、扬帆远航。","c":"第八章 发展全过程人民民主","p":"59"},{"id":118,"stem":"《中国共产党党章》明确规定，中国共产党是中国工人阶级的先锋队，同时是（）。","o":["中国人民的先锋队","中华民族的先锋队","中国人民和中华民族的先锋队","中国新阶层的先锋队"],"a":[2],"src":"真题模拟","n":45,"t":"单选","e":"中国共产党的自身优势是中国特色社会主义制度优势的主要来源。中国共产党是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队，集中了全民族先进分子，具有广泛坚实的阶级基础、群众基础和社会基础，是中国特色社会主义事业的领导核心。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"60"},{"id":119,"stem":"历史和现实证明，（）就没有中国特色社会主义的产生与发展。","o":["没有中国共产党的指导","没有中国共产党的组织","没有中国共产党的领导","没有中国共产党的监督"],"a":[2],"src":"真题模拟","n":46,"t":"单选","e":"没有中国共产党的领导，人民当家作主的愿望就无法实现。习近平指出：“中国共产党的领导，就是支持和保证人民实现当家作主。”党领导人民确立并不断巩固我们国家的国体、政体、根本制度、基本制度、重要制度和各方面的制度机制，形成了人民当家作主的制度体系。党领导人民大力推进社会主义民主政治建设，人民依法享有广泛、充分、真实的民主，真正成为国家、社会和自己命运的主人。在中国，只有坚持中国共产党的领导，人民当家作主才能得到可靠保障.","c":"第八章 发展全过程人民民主","p":"58"},{"id":120,"stem":"（）是我国的根本领导制度，居于统领地位。","o":["党的组织原则","党的政治原则","党的领导制度","党的性质宗旨"],"a":[2],"src":"真题模拟","n":47,"t":"单选","e":"坚持和加强党的领导的制度体系不断完善，明确党的领导制度是我国的根本领导制度，建立健全维护党中央权威和集中统一领导的各项制度，进一步完善党对重大工作的领导体制，完善各级党委（党组）工作制度，形成了横向到边、纵向到底的坚持党的全面领导制度体系，党的全面领导的政治优势得到更加充分发挥。","c":"第三章 坚持党的全面领导","p":"61"},{"id":121,"stem":"坚持党总揽全局、协调各方的领导核心地位，（）形象地说，这就像“众星捧月”，这个“月”就是中国共产党。","o":["习近平","邓小平","毛泽东","江泽民"],"a":[0],"src":"真题模拟","n":48,"t":"单选","e":"我国社会主义政治制度优越性的一个突出特点是党总揽全局、协调各方的领导核心作用，形象地说是“众星捧月”，这个“月”就是中国共产党。 一一习近平在省部级主要领导干部学习贯彻党的十八届四中 P 71","c":"第三章 坚持党的全面领导","p":""},{"id":122,"stem":"党的任何组织和成员必须以实际行动维护党中央的权威，必须服从党中央集中统一领导，这是党的领导的（）。","o":["前提基础","必然选择","最高原则","最终目标"],"a":[2],"src":"真题模拟","n":49,"t":"单选","e":"事在四方，要在中央。党中央集中统一领导是党的领导的最高原则。是党保持团结统一和强大战斗力、不断取得胜利的关键所在。","c":"第三章 坚持党的全面领导","p":"66"},{"id":123,"stem":"坚持全面深化改革的原则是（）","o":["坚持和完善中国特色社会主义制度","坚持以人民为中心","坚持党对改革的集中统一领导","坚持改革开放"],"a":[2],"src":"真题模拟","n":50,"t":"单选","e":"坚持党的全面领导是坚持和发展中国特色社会主义的必由之路。习近平指出，“中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，中国共产党是最高政治领导力量，坚持党中央集中统一领导是最高政治原则””。必须坚持党对一切工作的领导，不断健全和完善党的领导制度体系，确保党始终成为中国特色社会主义事业的坚强领导核心。","c":"第三章 坚持党的全面领导","p":"56"},{"id":124,"stem":"党的领导是担负文化使命、实现中华民族伟大复兴的（）","o":["根本方向","根本保证","精神标识","重要基础"],"a":[1],"src":"真题模拟","n":51,"t":"单选","e":"中国共产党领导是实现中华民族伟大复兴的根本保证。只有坚持中国共产党的领导，才能以坚定的必胜信念、强烈的历史自觉和主动精神，凝聚起全党全国各族人民为实现中华民族伟大复兴攻坚克难、团结奋斗的磅礴伟力，确保中华民族伟大复兴号巨轮劈波斩浪、扬帆远航。","c":"第十章 建设社会主义文化强国","p":"59"},{"id":125,"stem":"（）是贯彻习近平新时代中国特色社会主义思想的一根红线。","o":["人民立场","人民主体","人民至上","人民幸福"],"a":[2],"src":"真题模拟","n":52,"t":"单选","e":"人民性是马克思主义的本质属性和鲜明品格。坚持以人民为中心，是新时代坚持和发展中国特色社会主义的根本立场，是贯穿党治国理政全部活动的一条红线。必须坚持人民至上，站稳人民立场、把握人民愿望、尊重人民创造、集中人民智慧，不断实现人民对美好生活的向往，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展。坚持人民至上，是我们党百年奋斗的宝贵历史经验，也是新时代党治国理政的根本价值取向。要坚持把人民对美好生活的向往作为党的奋斗目标，把人民作为党的工作的最高裁决者和最终评判者，充分调动和激发全体人民的积极性主动性创造性，紧紧依靠人民创造新的历史伟业。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"80"},{"id":126,"stem":"中国共产党的性质决定了党的宗旨是（）。","o":["立党为公、执政为民","以人为本、执政为民","全心全意为人民服务","为实现共产主义而奋斗"],"a":[2],"src":"真题模拟","n":53,"t":"单选","e":"党代表最广大人民的根本利益，这就要求党必须始终坚持全心全意为人民服务的宗旨。","c":"综合 / 跨章节","p":"77"},{"id":127,"stem":"中国共产党作为马克思主义政党，其最大的政治优势是（）。","o":["一切从实际出发","理论联系实际","密切联系群众","批评与自我批评"],"a":[2],"src":"真题模拟","n":54,"t":"单选","e":"我们党的最大政治优势是密切联系群众，党执政后的最大危险是脱离群众。习近平指出：“坚持立党为公、执政为民，始终保持党同人民群众的血肉联系，是马克思主义政党与生俱来的政治品质和最高从政道德，是衡量党的先进性的根本标尺。”","c":"第十七章 全面从严治党","p":"79"},{"id":128,"stem":"江山就是人民、人民就是江山深刻揭示了（）","o":["人民与政权之间的辩证关系","人民与政府之间的辩证关系","人民与中国共产党之间的辩证关系","人民与国家主权之间的辩证关系"],"a":[0],"src":"真题模拟","n":55,"t":"单选","e":"中国共产党来自人民、依靠人民，党的一切奋斗都是为了人民。习近平指出：“江山就是人民，人民就是江山。中国共产党领导人民打江山、守江山，守的是人民的心。”要坚持以人民为中心的执政理念，始终保持同人民群众的血肉联系，始终接受人民批评和监督，始终同人民同呼吸、共命运、心连心。体现了人民与政权之间的关系。","c":"第四章 坚持以人民为中心","p":"74"},{"id":129,"stem":"（）是中国共产党的根本政治立场，是马克思主义政党区别于其他政党的显著标志。","o":["一个中国原则","人民立场","为中国人民谋幸福","为中华民族谋复兴"],"a":[1],"src":"真题模拟","n":56,"t":"单选","e":"政治立场是一个政党观察、认识、处理政治问题的立足点，反映了这个政党的世界观、方法论和执政理念，体现了这个政党的根本属性。人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一根本立场，就要坚持以人民为中心的执政理念，将其贯穿于党和国家事业发展各方面。","c":"第三章 坚持党的全面领导","p":"79"},{"id":130,"stem":"（）是马克思主义最鲜明的品格","o":["人民性","科学性","开放性","时代性"],"a":[0],"src":"真题模拟","n":57,"t":"单选","e":"人民性是马克思主义的本质属性和鲜明品格。坚持以人民为中心，是新时代坚持和发展中国特色社会主义的根本立场，是贯穿党治国理政全部活动的一条红线。必须坚持人民至上，站稳人民立场、把握人民愿望、尊重人民创造、集中人民智慧，不断实现人民对美好生活的向往，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"74"},{"id":131,"stem":"习近平总书记指出：“时代是出卷人，我们是答卷人，（）是阅卷人。","o":["人民","公民","政府","国家"],"a":[0],"src":"真题模拟","n":58,"t":"单选","e":"我们党是全心全意为人民服务的党，党的执政水平和执政成效不是由自己说了算，必须而且只能由人民来评判。习近平指出：“时代是出卷人，我们是答卷人，人民是阅卷人。”要始终把人民放在心中最高位置，树立正确的政绩观，以人民满意不满意作为检验工作的最终评判标准。","c":"第四章 坚持以人民为中心","p":"82"},{"id":132,"stem":"（）是社会主义的本质要求，是人民群众的共同期盼。","o":["美好生活","共同富裕","消灭剥削","共同致富"],"a":[1],"src":"真题模拟","n":59,"t":"单选","e":"共同富裕是中国特色社会主义的本质要求，是中国式现代化的重要特征。坚持以人民为中心的发展思想，真正做到发展成果由人民共享，就必须落实到扎实推进全体人民共同富裕上，在推动共同富裕过程中促进人的全面发展。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"87"},{"id":133,"stem":"（）始终是党的生命线和根本工作路线，是我们党永葆青春活力和战斗力的重要传家宝。","o":["群众路线","经济路线","人民立场","政治立场"],"a":[0],"src":"真题模拟","n":60,"t":"单选","e":"习近平指出：“群众路线是我们党的生命线和根本工作路线，是我们党永青春活力和战斗力的重要传家宝。”我们党是在同人民群众的密切联系中成长、发展、壮大起来的，是靠宜传群众、组织群众、依靠群众起家的。","c":"第四章 坚持以人民为中心","p":"84"},{"id":134,"stem":"（）是中国共产党的根本政治立场。","o":["人民地位","人民立场","群众路线","实事求是"],"a":[1],"src":"真题模拟","n":61,"t":"单选","e":"人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一根本立场，就要坚持以人民为中心的执政理念，将其贯穿于党和国家事业发展各方面。","c":"第四章 坚持以人民为中心","p":"78"},{"id":135,"stem":"我们党讲宗旨，讲了很多话，但说到底还是（）这句话。","o":["以人民为中心","为人民服务","坚持人民主体地位","群众路线是根本工作路线"],"a":[1],"src":"真题模拟","n":62,"t":"单选","e":"党代表最广大人民的根本利益，这就要求党必须始终坚持全心全意为人民服务的宗旨。习近平指出：“我们讲宗旨，讲了很多话，说到底还是为人民服务这句话。”人民是党执政的最大底气，也是党执政最深厚的根基。","c":"第四章 坚持以人民为中心","p":"77"},{"id":136,"stem":"坚持以人民为中心的发展思想，在高质量发展中促进共同富裕，正确处理（）的关系，构建初次分配、再分配、三次分配协调配套的基础性制度安排。","o":["效率和公平","收入和分配","经济和社会","政府和市场"],"a":[0],"src":"真题模拟","n":63,"t":"单选","e":"扎实推进共同富裕，必须坚持正确的原则和科学的思路。促进共同富裕，要把握好鼓励勤劳创新致富、坚持基本经济制度、尽力而为量力而行、坚持循序渐进的原则。总的思路是，坚持以人民为中心的发展思想，在高质量发展中促进共同富裕，正确处理效率和公平的关系，构建初次分配、再分配、三次分配协调配套的基础性制度安排，加大税收、社保、转移支付等调节力度并提高精准性，扩大中等收入群体比重，增加低收入群体收入，合理调节高收入，取缔非法收入，形成中间大、两头小的橄榄型分配结构，促进社会公平正义，促进人的全面发展，使全体人民朝着共同富裕目标扎实迈进。","c":"第四章 坚持以人民为中心","p":"88"},{"id":137,"stem":"坚持中国特色国家安全道路，必须坚持总体国家安全观，以（）为宗旨。","o":["经济安全","军事安全","政治安全","人民安全"],"a":[3],"src":"真题模拟","n":64,"t":"单选","e":"在维护国家安全中，坚持以人民安全为宗旨。","c":"第十三章 维护和塑造国家安全","p":"86"},{"id":138,"stem":"经济改革的方向是要让（）在资源配置中发挥决定性作用。","o":["科技","创新","政府","市场"],"a":[3],"src":"真题模拟","n":65,"t":"单选","e":"全面深化改革必须牢牢把握总目标，实施好“六个紧紧围绕”的路线图。紧紧围绕使市场在资源配置中起决定性作用和更好发挥政府作用，深化经济体制改革.","c":"第五章 全面深化改革开放","p":"99"},{"id":139,"stem":"党的（）是划时代的，实现改革由局部探索、破冰突围到系统集成、全面深化的转变，开创了我国改革开放新局面。","o":["十八大","十八届三中全会","十九大","十九届六中全会"],"a":[1],"src":"真题模拟","n":66,"t":"单选","e":"党的十一届三中全会是划时代的，开启了改革开放和社会主义现代化建设新时期。党的十八届三中全会也是划时代的，实现改革由局部探索、破冰突围到系统集成、全面深化的转变，开创了我国改革开放新局面。","c":"第五章 全面深化改革开放","p":"93"},{"id":140,"stem":"我国坚持对内对外开放相互促进、（）更好结合，推动贸易和投资自由化便利化。","o":["引进来”和“走出去","国内和国际双循环","一带一路","新发展理念"],"a":[0],"src":"真题模拟","n":67,"t":"单选","e":"党的十八大以来，我们坚定不移扩大对外开放，实行更加积极主动的开放战略，坚持对内对外开放相互促进、“引进来”和“走出去”更好结合，推动贸易和投资自由化便利化，构建面向全球的高标准自由贸易区网络，共建“一带一路”成为当今世界深受欢迎的国际公共产品和国际合作平台，我国国际经济合作和竞争新优势不断增强。","c":"第五章 全面深化改革开放","p":"109"},{"id":141,"stem":"（）是决定当代中国命运的关键一招，也是决定实现“两个一百年奋斗目标、实现中华民族伟大复兴的关键一招。","o":["科教兴国","从严治党","依法治国","改革开放"],"a":[3],"src":"真题模拟","n":68,"t":"单选","e":"改革开放是当代中国最显著的特征、最壮丽的气象。进人新时代，改革开放到了一个新的重要关头。习近平强调：“改革开放是决定当代中国命运的关键一招，也是决定实现‘两个一百年’奋斗目标、实现中华民族伟大复兴的关键一招。”③中国要前进，必须全面深化改革开放。","c":"第五章 全面深化改革开放","p":"91"},{"id":142,"stem":"党的二十大报告指出，我们以巨大的政治勇气全面深化改革，打响改革攻坚战，各领域基础性制度框架基本建立，许多领域实现历史性变革、系统性重塑、（）","o":["整体性重构","协同性重构","开放性重构","彻底性重构"],"a":[0],"src":"真题模拟","n":69,"t":"单选","e":"面对改革开放进入攻坚期和深水区的新形势、新要求，以习近平同志为核心的党中央以巨大的政治勇气打响改革攻坚战，加强党对全面深化改革开放的集中统一领导，以全局观念和系统思维谋划推进改革，冲破思想观念束缚，突破利益固化藩篱，坚决破除各方面体制机制弊端，着力解决新矛盾、应对新挑战，把全面深化改革开放引向深入。从夯基垒台、立柱架梁，到全面推进、积厚成势，再到加强系统集成、协同高效，蹄疾步稳、有力有序解决各领域各方面体制性障碍、机制性梗阻、政策性创新问题，推动许多领域实现历史性变革、系统性重塑、整体性重构，全面深化改革开放取得历史性成就。","c":"第五章 全面深化改革开放","p":"94"},{"id":143,"stem":"（）作出了全面深化改革的决定。","o":["党的十八大","党的十八届三中全会","党的十九大","党的十九届六中全会"],"a":[1],"src":"真题模拟","n":70,"t":"单选","e":"中国要前进，就要全面深化改革开放；除了全面深化改革开放，别无他途。2013年11月，党的十八届三中全会通过《中共中央关于全面深化改革若干重大问题的决定》，对全面深化改革进行总体擘画，确定了全面深化改革的总目标、战略重点、优先顺序、主攻方向、工作机制、推进方式和时间表、路线图，实现了改革理论和政策的一系列新的重大突破。","c":"第五章 全面深化改革开放","p":"93"},{"id":144,"stem":"推进改革的目的是要不断推进我国社会主义制度（），赋予社会主义新的生机活力。","o":["自我完善和发展","现实性和实效性","人民性和整体性","整体推进和全面发展"],"a":[0],"src":"真题模拟","n":71,"t":"单选","e":"必须坚持和改善党的全面领导、坚持和完善中国特色社会主义制度。改革开放是对社会主义生产关系和上层建筑的调整，使之适应生产力和经济基础发展的新要求，是社会主义制度的自我完善和发展，而不是改弦易张。","c":"第五章 全面深化改革开放","p":"96"},{"id":145,"stem":"综合分析国际国内形势和我国发展条件，党的十九大提出我们要全面建成小康社会，实现第一个百年奋斗目标，然后再乘势而上开启（）新征程。","o":["全面建成小康社会","全面建设社会主义现代化国家","基本实现社会主义现代化","中国特色社会主义事业"],"a":[1],"src":"真题模拟","n":72,"t":"单选","e":"习近平指出：“全面建成小康社会、实现第一个百年奋斗目标之后，我们要乘势而上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军，这标志着我国进人了一个新发展阶段。”新发展阶段是我国社会主义初级阶段历史进程中的一个重要阶段，是中国共产党带领人民迎来从站起来、富起来到强起来历史性跨越的新阶段，是全面建设社会主义现代化国家、向第二个百年奋斗目标进军的重要阶段。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"114"},{"id":146,"stem":"新发展格局最本质的特征是（）","o":["自主创新","科技自立自强","文化综合力的提高","实现高水平的自立自强"],"a":[3],"src":"真题模拟","n":73,"t":"单选","e":"着力加快科技自立自强。构建新发展格局最本质的特征是实现高水平的自立自强。","c":"第七章 教育、科技、人才","p":"129"},{"id":147,"stem":"（）是根据我国发展阶段、环境、条件变化提出来的，是重塑我国国际合作和竞争新优势的战略抉择，是把握未来发展主动权的战略性布局和先手棋。","o":["新发展理念","新发展格局","新发展阶段","新发展时期"],"a":[1],"src":"真题模拟","n":74,"t":"单选","e":"构建新发展格局是把握未来发展主动权的先手棋，不是被迫之举和权宜之计。从国际比较看，大国经济的特征都是内需为主导、内部可循环。我国作为世界第二大经济体和制造业第一大国，国内经济循环同国际经济循环的关系客观上早有调整的要求。在当前国际形势充满不稳定性不确定性的背景下，立足国内、依托国内大市场优势，充分挖掘内需潜力，有利于化解外部冲击和外需下降带来的影响，也有利于在极端情况下保证我国经济基本正常运行和社会大局总体稳定。","c":"第六章 推动高质量发展","p":"126"},{"id":148,"stem":"新发展理念中的（）注重解决发展动力问题。","o":["创新","绿色","开放","共享"],"a":[0],"src":"真题模拟","n":75,"t":"单选","e":"新发展理念具有丰富的科学内涵和具体的实践要求。创新是引领发展的第一动力，创新发展注重的是解决发展动力问题，必须坚持创新在我国现代化建设全局中的核心地位，让创新贯穿党和国家一切工作，全面提升创新能力和效率，把创新发展主动权牢牢掌握在自己手中。协调是持续健康发展的内在要求，协调发展注重的是解决发展不平衡问题，必须正确处理局部和全局、当前和长远、重点和非重点的关系，在发展中促进相对平衡，不断增强发展的整体性。","c":"第六章 推动高质量发展","p":"115"},{"id":149,"stem":"贯彻新发展理念，建设现代化经济体系，必须坚持质量第一，效益优先，以（）为主线。","o":["转变发展方式","优化经济结构","供给侧结构性改革","转换增长动力"],"a":[2],"src":"真题模拟","n":76,"t":"单选","e":"要保持经济社会发展稳定性，坚持稳中求进工作总基调，实行宏观政策要稳、产业政策要准、微观政策要活、改革政策要实、社会政策要托底的政策框架，以深化供给侧结构性改革为主线，以改革创新为根本动力，把实施扩大内需战略同深化供给侧结构性改革有机结合起来，加快构建新发展格局。","c":"第六章 推动高质量发展","p":"118"},{"id":150,"stem":"（）是永续发展的必要条件和人民对美好生活追求的重要体现．","o":["创新","绿色","开放","共享"],"a":[1],"src":"真题模拟","n":77,"t":"单选","e":"绿色是永续发展的必要条件和人民对美好生活追求的重要体现，绿色发展注重的是解决人与自然和谐共生问题，必须实现经济社会发展和生态环境保护协同共进，加快发展方式绿色转型，推动形成绿色低碳的生产方式和生活方式。","c":"第十二章 建设社会主义生态文明","p":"115"},{"id":151,"stem":"我们乘势而上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军，这标志着我国进入了一个（）","o":["新发展时期","新发展方位","新发展阶段","新发展格局"],"a":[2],"src":"真题模拟","n":78,"t":"单选","e":"经济工作从来都不是抽象的、孤立的，而是具体的、联系的，必须立足中华民族伟大复兴战略全局和世界百年未有之大变局来思考和谋划。习近平指出：“全面建成小康社会、实现第一个百年奋斗目标之后，我们要乘势而上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军，这标志着我国进入了一个新发展阶段。”新发展阶段是我国社会主义初级阶段历史进程中的一个重要阶段，是中国共产党带领人民迎来从站起来、富起来到强起来历史性跨越的新阶段，是全面建设社会主义现代化国家、向第二个百年奋斗目标进军的重要阶段。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":"114"},{"id":152,"stem":"我国经济已由_____阶段转向_____阶段，正处在转变发展方式、优化经济结构、转换增长动力的攻关期,建设现代化经济体系是跨越关口的迫切要求和我国发展的战略目标。（）","o":["高速增长；高水平发展","高速发展；高水平发展","高速增长；高质量发展","高速发展；高质量发展"],"a":[2],"src":"真题模拟","n":79,"t":"单选","e":"党的十八大以来，以习近平同志为核心的党中央着眼我国发展阶段、发展环境、发展条件变化，不断深化对经济形势和任务的认识。我国经济已由高速增长阶段转向高质量发展阶段。","c":"第六章 推动高质量发展","p":"113"},{"id":153,"stem":"（）是发展行动的先导。","o":["发展理念","发展格局","发展方向","发展策略"],"a":[0],"src":"真题模拟","n":80,"t":"单选","e":"新发展理念具有丰富的科学内涵和具体的实践要求。创新是引领发展的第一动力，创新发展注重的是解决发展动力问题，必须坚持创新在我国现代化建设全局中的核心地位，让创新贯穿党和国家一切工作，全面提升创新能力和效率，把创新发展主动权牢牢掌握在自己手中。","c":"第六章 推动高质量发展","p":"115"},{"id":154,"stem":"现代化经济体系必须坚持质量第一、（）优先。","o":["利益","速度","人才","效益"],"a":[3],"src":"真题模拟","n":81,"t":"单选","e":"推动高质量发展，要更好统筹质的有效提升和量的合理增长，始终坚持质量第一、效益优先，以效率变革、动力变革促进质量变革，加快形成可持续的高质量发展体制机制，不断增强经济竞争力、创新力、抗风险能力。","c":"第六章 推动高质量发展","p":"117"},{"id":155,"stem":"我国经济已由高速增长阶段转向（），正处在转变发展方式、优化经济结构、转换增长动力的攻关期。","o":["高质量发展阶段","中高速阶段","低速阶段","高水平发展阶段"],"a":[0],"src":"真题模拟","n":82,"t":"单选","e":"党的十八大以来，以习近平同志为核心的党中央着眼我国发展阶段、发展环境、发展条件变化，不断深化对经济形势和任务的认识。我国经济已由高速增长阶段转向高质量发展阶段。","c":"第六章 推动高质量发展","p":"113"},{"id":156,"stem":"国有企业是中国特色社会主义的重要物质基础和政治基础，关系（）地位的巩固，关系我们党的执政地位和执政能力，关系我国社会主义制度。","o":["人民主体","公有制主体","经济体制主体","社会发展主体"],"a":[1],"src":"真题模拟","n":83,"t":"单选","e":"公有制经济包括国有经济和集体经济，还包括混合所有制经济中的国有成分和集体成分。公有制经济是全体人民的宝贵财富，公有制主体地位不能动摇，国有经济主导作用不能动摇，这是我国各族人民共享发展成果的制度性保证，也是巩固党的执政地位、坚持我国社会主义制度的重要保证。必须坚持公有制主体地位，探索公有制多种实现形式，发挥国有经济战略支撑作用，推进国有经济布局优化和结构调整，增强国有经济竞争力、创新力、控制力、影响力、抗风险能力。国有企业是中国特色社会主义的重要物质基础和政治基础，是我们党执政兴国的重要支柱和依靠力量。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"121"},{"id":157,"stem":"我国构建面向全球的高标准自由贸易区网络，建设自由贸易试验区和海南自由贸易港，推动规则、规制、管理、标准等制度型开放，形成更大范围、更宽领域、（）对外开放格局。","o":["更高质量","更深层次","更加便捷","更加开放"],"a":[1],"src":"真题模拟","n":84,"t":"单选","e":"要科学认识国内大循环和国内国际双循环的关系，主动作为、善于作为，实施更大范围、更宽领域、更深层次的对外开放，提升国内国际双循环的效率和水平。要通过参与国际市场竞争，增强我国出口产品和服务竞争力，推动我国产业转型升级。","c":"第五章 全面深化改革开放","p":"128"},{"id":158,"stem":"党的十八届三中全会指出要使市场在资源配置中起（）","o":["主导性作用","决定性作用","基础性作用","辅助性作用"],"a":[1],"src":"真题模拟","n":85,"t":"单选","e":"以习近平同志为核心的党中央提出使市场在资源配置中起决定性作用，更好发挥政府作用，这是我们党在理论和实践上的重大推进，是对中国特色社会主义建设规律认识的一个新突破。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"124"},{"id":159,"stem":"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑.其中创新是（）","o":["第一生产力","第一资源","第一动力","第一关键"],"a":[2],"src":"真题模拟","n":86,"t":"单选","e":"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。全面建设社会主义现代化国家，教育是根本，科技是关键，人才是基础。必须坚持科技是第一生产力、人才是第一资源、创新是第一动力，坚持教育优先发展、科技自立自强、人才引领驱动，加快教育强国、科技强国、人才强国建设。","c":"第七章 教育、科技、人才","p":"135"},{"id":160,"stem":"现代化强国，必定是教育强国、（）、人才强国","o":["科技强国","文化强国","文明强国","军事强国"],"a":[0],"src":"真题模拟","n":87,"t":"单选","e":"现代化强国，必定是教育强国、科技强国、人才强国。","c":"第七章 教育、科技、人才","p":"136"},{"id":161,"stem":"习近平指出：“谁牵住了（）这个‘牛鼻子’，谁走好了这步先手棋，谁就能占领先机、赢得优势。","o":["教育兴国","科技创新","文化自信","人才强国"],"a":[1],"src":"真题模拟","n":88,"t":"单选","e":"习近平指出：“时代越是向前，知识和人才的重要性就愈发突出，教育的地位和作用就愈发凸显\"。“谁牵住了科技创新这个‘牛鼻子’，谁走好了科技创新这步先手棋，谁就能占领先机、赢得优势。”","c":"第七章 教育、科技、人才","p":"137"},{"id":162,"stem":"我国的基本国策是（）","o":["人才强国","教育兴国","科技创新","科教兴国"],"a":[3],"src":"真题模拟","n":89,"t":"单选","e":"科教兴国是我国的基本国策。实施科教兴国战略，要把教育摆在优先发展的战略地位，把科技创新作为提高社会生产力和综合国力的战略支撑，完善党对教育、科技工作的领导体制机制，不断优化我国科教事业发展总体布局，深化科教体制改革，促进科技和教育成果向现实生产力转化。","c":"第七章 教育、科技、人才","p":"138"},{"id":163,"stem":"（）是决定我国生存和发展的基础能力，对于更好掌握全球经济科技竞争先机具有战略意义。P140","o":["科技自立自强","坚持教育优先发展","人才引领驱动","创新应对竞争"],"a":[0],"src":"真题模拟","n":90,"t":"单选","e":"科技自立自强是决定我国生存和发展的基础能力，对于更好掌握全球经济科技竞争先机具有战略意义。","c":"第七章 教育、科技、人才","p":"140"},{"id":164,"stem":"建设（）是全面建成社会主义现代化强国的战略先导","o":["文明强国","军事强国","教育强国","科技强国"],"a":[2],"src":"真题模拟","n":91,"t":"单选","e":"建设教育强国是全面建成社会主义现代化强国的战略先导，是实现高水平科技自立自强的重要支撑，是促进全体人民共同富裕的有效途径，是以中国式现代化全面推进中华民族伟大复兴的基础工程。","c":"第七章 教育、科技、人才","p":"140"},{"id":165,"stem":"（）是国之大计、党之大计，是功在当代、利在千秋的德政工程","o":["改革","教育","创新","科技"],"a":[1],"src":"真题模拟","n":92,"t":"单选","e":"教育是国之大计、党之大计，是功在当代、利在千秋的德政工程，对提高人民综合素质、促进人的全面发展、增强中华民族创新创造活力、实现中华民族伟大复兴具有决定性意义。要深刻认识教育的重要战略地位，坚定不移办好中国特色社会主义教育，建设教育强国。","c":"第七章 教育、科技、人才","p":"141"},{"id":166,"stem":"落实立德树人根本任务，必须着力解决的问题中不包括（）","o":["培养什么人","为何培养人","怎样培养人","为谁培养人"],"a":[1],"src":"真题模拟","n":93,"t":"单选","e":"落实立德树人根本任务，必须着力解决好培养什么人、怎样培养人、为谁培养人的问题，这是教育的根本问题，也是建设教育强国的核心课题。","c":"第七章 教育、科技、人才","p":"142"},{"id":167,"stem":"发展教育的根本尺度是（）","o":["人民满意","国家满意","社会满意","领导满意"],"a":[0],"src":"真题模拟","n":94,"t":"单选","e":"人民满意是发展教育的根本尺度。加快建设教育强国，最终是办好人民满意的教育。要坚持以人民为中心发展教育，努力让每个人享有受教育的机会，获得发展自身、奉献社会、造福人民的能力，增强人民的教育获得感，不断满足人民对更好教育的期盼。","c":"第七章 教育、科技、人才","p":"144"},{"id":168,"stem":"（）是国家强盛之基、安全之要。","o":["科技自立自强","坚持教育优先发展","人才引领驱动","创新应对竞争"],"a":[0],"src":"真题模拟","n":95,"t":"单选","e":"科技自立自强是国家强盛之基、安全之要。","c":"第七章 教育、科技、人才","p":"146"},{"id":169,"stem":"中华民族自立于世界民族之林的奋斗基点是（）","o":["基础研究","战略研究","自主创新","自力更生"],"a":[3],"src":"真题模拟","n":96,"t":"单选","e":"自力更生是中华民族自立于世界民族之林的奋斗基点，自主创新是我们攀登世界科技高峰的必由之路。","c":"第七章 教育、科技、人才","p":"149"},{"id":170,"stem":"水积而鱼聚，木茂而鸟集。”体现的是（）","o":["培养人才是国家和民族长远发展大计","培养造就大批徳才兼备的高素质人才","把各方面优秀人才集聚到党和国家事业中来","坚持党的全面领导"],"a":[2],"src":"真题模拟","n":97,"t":"单选","e":"水积而鱼聚，木茂而鸟集。”建设人才强国，要坚持人才引领发展的战略地位，深化人才发展体制机制改革，营造识才爱才敬才用才的环境，把各方面优秀人才集聚到党和国家事业中来。","c":"第七章 教育、科技、人才","p":"154"},{"id":171,"stem":"（）维系着华夏大地上各个民族的团结统一，激励着一代代中华儿女为祖国发展繁荣不懈奋斗。","o":["伟大精神","爱国主义","民族团结","改革创新"],"a":[1],"src":"真题模拟","n":98,"t":"单选","e":"加强和促进海内外中华儿女大团结，要高举爱国主义、社会主义旗帜。爱国主义是中华民族精神的核心，维系着华夏大地上各个民族的团结统一，激励着一代又一代中华儿女为祖国发展繁荣而不懈奋斗。","c":"第十章 建设社会主义文化强国","p":"179"},{"id":172,"stem":"中国特色社会主义制度和国家治理体系是以（）为指导、植根中国大地、具有深厚中华文化根基、深得人民拥护的制度和治理体系。","o":["社会主义","中国特色社会主义","马克思主义","毛泽东思想"],"a":[2],"src":"真题模拟","n":99,"t":"单选","e":"中国特色社会主义政治制度，是中国共产党团结带领中国人民，坚持以马克思主义为指导，坚持从国情出发、从实际出发确立起来的人民当家作主制度体系。这一政治制度，既把握了长期形成的历史传承，又把握了走过的发展道路、积累的政治经验，形成的政治原则，还把握了现实要求、着眼解决现实问题，注重历史和现实、理论和实践、形式和内容有机统一，具有鲜明的中国特色、民族特色、时代特色。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"161"},{"id":173,"stem":"（）是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。","o":["民主集中制","中国共产党领导","全过程人民民主","人民当家作主"],"a":[2],"src":"真题模拟","n":100,"t":"单选","e":"人民民主是社会主义的生命，全过程人民民主是社会主义民主政治的本质属性。","c":"第八章 发展全过程人民民主","p":"158"},{"id":174,"stem":"（）是社会主义的生命，是全面建设社会主义现代化国家的应有之义。","o":["人民民主","中国共产党领导","人民民主专政","全国人民代表大会制度"],"a":[0],"src":"真题模拟","n":101,"t":"单选","e":"人民民主是全面建设社会主义现代化国家的应有之义。发展社会主义民主政治，是全面建设社会主义现代化国家的内在要求和重要目标。社会主义现代化是全体人民的现代化，必然要求具有高度发达的民主政治，以实现好、维护好、发展好最广大人民根本利益为出发点和落脚点，保障人民当家作主，不断推动人的全面发展。","c":"第八章 发展全过程人民民主","p":"159"},{"id":175,"stem":"民主好不好，（）最有发言权。","o":["人民","实践","国家","中国共产党"],"a":[0],"src":"真题模拟","n":102,"t":"单选","e":"评判一种民主形式好不好，实践最有说服力，人民最有发言权。全过程人民民主既能确保人民充分享有各方面权利，又能有效促进国家治理高效和社会和谐稳定，维护和保障人民群众的根本利益，是最广泛、最真实、最管用的民主。","c":"第八章 发展全过程人民民主","p":"168"},{"id":176,"stem":"加强新时代统一战线工作根本在于（）","o":["坚持党的领导","促进非公有制经济健康发展","加强海外爱国力量建设","做好网络统战工作"],"a":[0],"src":"真题模拟","n":103,"t":"单选","e":"统一战线是党领导的统一战线。党的领导是统一战线最鲜明的特征，坚持党的领导是统一战线最核心最根本的问题。加强新时代统一战线工作，根本在于坚持党的领导。","c":"第八章 发展全过程人民民主","p":"176"},{"id":177,"stem":"（）是社会主义的生命，没有民主就没有社会主义，就没有社会主义的现代化，就没有中华民族伟大复兴。","o":["人民民主","人民当家作主","以人民为中心","坚持人民的主体地位"],"a":[0],"src":"真题模拟","n":104,"t":"单选","e":"历史和实践证明，人民民主是社会主义的生命，没有民主就没有社会主义，就没有社会主义的现代化，就没有中华民族伟大复兴。社会主义愈发展，民主也愈发展。在全面建设社会主义现代化国家新征程上，要继续高举人民民主旗帜，坚定不移走适合中国国情的政治发展道路，为中国式民主发展不断注入新的动力。","c":"第八章 发展全过程人民民主","p":"160"},{"id":178,"stem":"全面阐释深刻全过程人民民主内涵的时间是（）","o":["2021年10月","2021年11月","2022年1月","2022年3月"],"a":[0],"src":"真题模拟","n":105,"t":"单选","e":"2021年10月，习近平在中央人大工作会议上对全过程人民民主重大理念和实践要求作出系统闸述。","c":"第八章 发展全过程人民民主","p":"165"},{"id":179,"stem":"（）是推进全面依法治国的根本保证。","o":["党的领导","人民当家作主","社会和谐稳定","经济社会发展"],"a":[0],"src":"真题模拟","n":106,"t":"单选","e":"走中国特色社会主义政治发展道路，必须坚持党的领导、人民当家作主、依法治国有机统一。党的领导是人民当家作主和依法治国的根本保证，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式，三者统一于我国社会主义民主政治伟大实践。","c":"第九章 全面依法治国","p":"163"},{"id":180,"stem":"（）是社会主义民主政治的本质特征。","o":["社会主义制度","党的领导","人民当家作主","依法治国"],"a":[2],"src":"真题模拟","n":107,"t":"单选","e":"走中国特色社会主义政治发展道路，必须坚持党的领导、人民当家作主、依法治国有机统一。党的领导是人民当家作主和依法治国的根本保证，人民当家作主是社会主义民主政治的本质特征，依法治国是党领导人民治理国家的基本方式，三者统一于我国社会主义民主政治伟大实践。","c":"第九章 全面依法治国","p":"163"},{"id":181,"stem":"党和人民共同意志体现并成为（）","o":["国体","政体","宪法和法律","全过程人民民主"],"a":[2],"src":"真题模拟","n":108,"t":"单选","e":"宪法是国家的根本法，是治国安邦的总章程，是党和人民意志的集中体现，是国家各种制度和法律法规的总依据，具有最高的法律地位、法律权威、法律效力。","c":"第八章 发展全过程人民民主","p":"190"},{"id":182,"stem":"国家以（）为根本法得以组织、运行和发展。","o":["党章","民法典","宪法","刑法"],"a":[2],"src":"真题模拟","n":109,"t":"单选","e":"宪法是国家的根本法，是治国安邦的总章程，是党和人民意志的集中体现，是国家各种制度和法律法规的总依据，具有最高的法律地位、法律权威、法律效力。","c":"第九章 全面依法治国","p":"190"},{"id":183,"stem":"（）是中国特色社会主义的本质要求和重要保障。","o":["全面建设社会主义现代化国家","全面依法治国","全面深化改革","全面从严治党"],"a":[1],"src":"真题模拟","n":110,"t":"单选","e":"法治是治国理政的基本方式。全面依法治国是坚持和发展中国特色社会主义的本质要求和重要保障。","c":"第九章 全面依法治国","p":"183"},{"id":184,"stem":"全面依法治国最广泛、最深厚的基础是（）","o":["党的领导","社会稳定","人民","社会主义民主"],"a":[2],"src":"真题模拟","n":111,"t":"单选","e":"坚持以人民为中心。全面依法治国最广泛、最深厚的基础是人民，必须坚持法治为了人民、依靠人民、造福人民、保护人民。","c":"第九章 全面依法治国","p":"186"},{"id":185,"stem":"（）是推进全面依法治国的总抓手。","o":["中国特色社会主义法治国家","中国特色社会主义法治体系","中国特色社会主义法治道路","中国特色社会主义法治制度"],"a":[1],"src":"真题模拟","n":112,"t":"单选","e":"进入新时代，党的十八届四中全会将建设中国特色社会主义法治体系、建设社会主义法治国家确定为全面推进依法治国的总目标。将建设中国特色社会主义法治体系确定为全面推进依法治国的总抓手，并作出顶层设计和战略部署。从形成中国特色社会主义法律体系到建设中国特色社会主义法治体系，是我们党深化对中国特色社会主义法治建设规律性认识形成的重大成果，为中国特色社会主义事业长远发展提供了有力法治支撑。","c":"第九章 全面依法治国","p":"190"},{"id":186,"stem":"（）是法治的生命线。","o":["公正","民主","诚信","和谐"],"a":[0],"src":"真题模拟","n":113,"t":"单选","e":"严格公正司法。公正司法是维护社会公平正义的最后一道防线。要深化司法体制综合配套改革，全面准确落实司法责任制，加快建设公正高效权威的社会主义司法制度。","c":"第九章 全面依法治国","p":"198"},{"id":187,"stem":"（）作为治国安邦的总章程和国家的根本法，具有最高的法律效力。","o":["民法","公务员法","政府组织法","宪法"],"a":[3],"src":"真题模拟","n":114,"t":"单选","e":"宪法是国家的根本法，是治国安邦的总章程，是党和人民意志的集中体现，是国家各种制度和法律法规的总依据，具有最高的法律地位、法律权威、法律效力。","c":"第九章 全面依法治国","p":"190"},{"id":188,"stem":"我国宪法规定：“中华人民共和国实行依法治国，建设社会主义法治国家”。（）是依法治国的前提。","o":["建立科学完备的法律体系","国家行政机关依法行政","司法机关公正司法.严格执法","加强法制教育，增强法制观念"],"a":[0],"src":"真题模拟","n":115,"t":"单选","e":"法律规范体系是以宪法为核心，由部门齐全、结构严谨、内部协调、体例科学、调整有效的法律规范所构成的有机整体。“立善法于天下，则天下治；立善法于一国，则一国治。”全面依法治国，必须加快完善中国特色社会主义法律体系，使之更加科学完备、统一权威。","c":"第九章 全面依法治国","p":"192"},{"id":189,"stem":"建设中国特色社会主义法治体系，必须坚持立法先行，抓住提高（）这个关键。","o":["立法规则","立法数量","立法原则","立法质量"],"a":[3],"src":"真题模拟","n":116,"t":"单选","e":"全面依法治国，必须加快完善中国特色社会主义法律体系，使之更加科学完备、统一权威。要抓住立法质量这个关键，深入推进科学立法，民主立法、依法立法，统筹立改废释纂，提高立法效率，增强立法系统性、整体性、协同性和时效性。","c":"第九章 全面依法治国","p":"192"},{"id":190,"stem":"党的（）通过的《中共中央关于全面推进依法治国若干重大问题的决定》，提出全面依法治国的总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。","o":["十八大","十八届三中全会","十八届四中全会","十九大"],"a":[2],"src":"真题模拟","n":117,"t":"单选","e":"法律是治国之重器，法治是国家治理体系和治理能力的重要依托。党的十八届四中全会通过《中共中央关于全面推进依法治国若干重大问题的决定》，规划了全面依法治国的总蓝图、路线图、施工图。","c":"第九章 全面依法治国","p":"183"},{"id":191,"stem":"全面依法治国，总目标是（）","o":["建设中国特色社会主义法治体系","建设中国特色社会主义法治体系，建设社会主义法治国家","建设社会主义法治国家","有法可依、有法必依、违法必究、执法必严"],"a":[1],"src":"真题模拟","n":118,"t":"单选","e":"全面依法治国是坚持和发展中国特色社会主义的本质要求和重要保障，是国家治理的一场深刻革命。全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家。","c":"第九章 全面依法治国","p":"199"},{"id":192,"stem":"我们讲坚持依宪治国、依宪执政，就包括坚持宪法确定的（）地位不动摇。","o":["人民当家作主","中国共产党领导","社会主义法治国家","宪法权威"],"a":[1],"src":"真题模拟","n":119,"t":"单选","e":"坚持依宪治国、依宪执政，就必须坚持宪法确定的中国共产党领导地位不动摇，坚持宪法确定的人民民主专政的国体和人民代表大会制度的政体不动摇。","c":"第九章 全面依法治国","p":"191"},{"id":193,"stem":"完善行政组织和行政程序法律制度，推进（）法定化。","o":["机构、职能、制度、程序、责任","机构、职责、权限、程序、任务","机构、职能、制度、程序、任务","机构、职能、权限、程序、责任"],"a":[3],"src":"真题模拟","n":120,"t":"单选","e":"扎实推进依法行政。构建职责明确、依法行政的政府治理体系，各级行政机关必须依法履行职责，实现政府各项工作法治化。转变政府职能，优化政府职责体系和组织结构，推进机构、职能、权限、程序、责任法定化，提高行政效率和公信力。深化事业单位改革，坚持优化协调高效。","c":"第九章 全面依法治国","p":"198"},{"id":194,"stem":"马克思主义中国化时代化的最新成果是（）","o":["习近平新时代中国特色社会主义思想","毛泽东思想","邓小平理论","三个代表”重要思想"],"a":[0],"src":"真题模拟","n":121,"t":"单选","e":"马克思主义始终是随着时代、实践、认识发展而发展的，习近平新时代中国特色社会主义思想是马克思主义中国化时代化最新成果，是当今时代最现实、最鲜活的马克思主义。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"208"},{"id":195,"stem":"习近平新时代中国特色社会主义思想深刻阐发了以（）为源头的中国共产党人的精神谱系。","o":["伟大抗疫精神","伟大建党精神","脱贫攻坚精神","新时代北斗精神"],"a":[1],"src":"真题模拟","n":122,"t":"单选","e":"人无精神则不立，国无精神则不强。精神是一个民族赖以长久生存的灵魂，唯有精神上达到一定的高度，这个民族才能在历史的洪流中屹立不倒、奋勇向前。100多年前，中国共产党的先驱们创建了中国共产党，形成了坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民的伟大建党精神。以伟大建党精神为源头的中国共产党人精神谱系，是党带领人民战胜艰难险阻、取得一个又一个伟大胜利的精神丰碑，是中华民族的宝贵精神财富。","c":"第十章 建设社会主义文化强国","p":"214"},{"id":196,"stem":"中国共产党人的精神谱系不包括（）","o":["井冈山精神","遵义会议精神","伟大抗疫精神","漳州110精神"],"a":[3],"src":"真题模拟","n":123,"t":"单选","e":"在百余年接续奋斗中，一代又一代中国共产党人弘扬伟大建党精神，展现出伟大的历史主动精神，锤炼出鲜明的政治品格，铸就了一系列伟大精神，构筑起中国共产党人精神谱系。新民主主义革命时期，铸就了井冈山精神、苏区精神、长征精神、遵义会议精神、延安精神、抗战精神、红岩精神、西柏坡精神等；社会主义革命和建设时期，铸就了抗美援朝精神、“两弹一星”精神、雷锋精神、焦裕禄精神、大庆精神（铁人精神）、红旗渠精神等；改革开放和社会主义现代化建设新时期，铸就了改革开放精神、特区精神、抗洪精神、抗击“非典”精神、抗震救灾精神、载人航天精神等；中国特色社会主义新时代，铸就了脱贫攻坚精神、抗疫精神、探月精神、新时代北斗精神等。中国共产党人精神谱系集中体现了党的坚定信念、根本宗旨、优良作风，凝聚着中国共产党人艰苦奋斗、牺牲奉献、开拓进取的伟大品格，已经深深融人党、国家、民族、人民的血脉和灵魂，成为民族精神和时代精神的重要组成部分，成为社会主义核心价值观的丰富滋养。","c":"第十章 建设社会主义文化强国","p":"215"},{"id":197,"stem":"应该坚守什么样的社会主义核心价值观不包括（）","o":["建设富强民主文明和谐的国家","建设自由平等公正法治的社会","培育爱国敬业诚信友善的公民","发展优秀传统文化"],"a":[3],"src":"真题模拟","n":124,"t":"单选","e":"核心价值观，承载着一个民族、一个国家的精神追求，体现着一个社会评判是非曲直的价值标准。以富强、民主、文明、和谐，自由、平等、公正、法治，爱国、敬业、诚信、友善为基本内容的社会主义核心价值观，把涉及国家、社会、公民的价值要求融为一体，回答了我们要建设什么样的国家、建设什么样的社会、培育什么样的公民的重大问题。","c":"第十章 建设社会主义文化强国","p":"212"},{"id":198,"stem":"（）是一个民族赖以维系的精神纽带，是一个国家共同的思想道德基础。","o":["社会主义核心价值观","核心价值观","理想信念","社会主义核心价值体系"],"a":[1],"src":"真题模拟","n":125,"t":"单选","e":"核心价值观是一个民族赖以维系的精神纽带，是一个国家共同的思想道德基础。习近平指出：“如果没有共同的核心价值观，一个民族、一个国家就会魂无定所、行无依归。”","c":"第十章 建设社会主义文化强国","p":"212"},{"id":199,"stem":"一个国家、一个民族的强盛，总是以文化兴盛为支撑的，中华民族伟大复兴需要以（）发展繁荣为条件。","o":["社会主义经济","社会主义制度","中华文化","社会主义文化"],"a":[2],"src":"真题模拟","n":126,"t":"单选","e":"文化兴则国运兴，文化强则民族强。实现中华民族伟大复兴，必然要求推动中华文化繁荣兴盛，建设社会主义文化强国。","c":"第十章 建设社会主义文化强国","p":"200"},{"id":200,"stem":"（）是中华文明的智慧结晶和精华所在，是中华民族的根和魂，是我们在世界文化激荡中站稳脚跟的根基。","o":["中华优秀传统文化","社会主义先进文化","革命文化号","中国特色社会主义文化"],"a":[0],"src":"真题模拟","n":127,"t":"单选","e":"不忘本来才能开辟未来，善于继承才能更好创新。中华优秀传统文化是中华文明的智慧结晶和精华所在，是中华民族的根和魂。要坚持把马克思主义基本原理同中华优秀传统文化相结合，推动中华优秀传统文化创造性转化、创新性发展，让中华文明展现出永久魅力和时代风来。","c":"第十章 建设社会主义文化强国","p":"217"},{"id":201,"stem":"国家富强、民族振兴的根本出发点和落脚点是（）","o":["社会安定","政治稳定","人民幸福","国际和平"],"a":[2],"src":"真题模拟","n":128,"t":"单选","e":"全面建设社会主义现代化国家，出发点和落脚点是让人民生活越过越好。必须始终坚持把实现人民对美好生活的向往作为现代化建设的出发点和落脚点，不断增进民生福祉，努力使人民生活更加幸福美好。","c":"第十一章 以保障和改善民生为重点加强社会建设","p":"226"},{"id":202,"stem":"（），是全面建成小康社会的底线任务。","o":["增加城乡居民收入","打赢脱贫攻坚战","提升国内生产总值","增加城乡居民人均收入"],"a":[1],"src":"真题模拟","n":129,"t":"单选","e":"打赢脱贫攻坚战，消除绝对贫困，是全面建成小康社会的底线任务，是必须抓紧抓好的第一民生工程。","c":"第十一章 以保障和改善民生为重点加强社会建设","p":"226"},{"id":203,"stem":"（）是立党为公、执政为民的本质要求。","o":["反腐败","艰苦奋斗","深化改革","为民造福"],"a":[3],"src":"真题模拟","n":130,"t":"单选","e":"增进民生福祉是坚持立党为公、执政为民的本质要求。中国共产党是人民的党，任何时候都把群众利益放在第一位。","c":"第十七章 全面从严治党","p":"225"},{"id":204,"stem":"抓民生也是抓发展。离开（）谈改善民生是无源之水、无本之木。","o":["经济发展","政治文明","文化繁荣","社会和谐"],"a":[0],"src":"真题模拟","n":131,"t":"单选","e":"正确把握民生和发展的关系，是保障和改善民生的重要前提。发展是改善民生的物质基础。离开发展谈改善民生是无源之水、无本之木。如果发展不能回应人民的期待，不能让群众得到实际利益，这样的发展就失去意义，也不可能持续。民生连着内需、连着发展。抓民生也是抓发展，持续不断改善民生，能够有效解决群众后顾之忧，调动人们发展生产的积极性，增进社会消费预期，利于扩大内需，催生新的增长点。要全面把握民生和发展相互牵动、互为条件的关系，使民生改善和经济发展有效对接，相得益彰，形成改善民生与促进发展有机统一的长效机制。","c":"第十一章 以保障和改善民生为重点加强社会建设","p":"228"},{"id":205,"stem":"（）是政府联系群众的最终一公里。","o":["乡村人民政府","居委会","基层党支部","城乡社区"],"a":[3],"src":"真题模拟","n":132,"t":"单选","e":"基层治理是国家治理的基石，城乡社区是社会治理最基本的单元，是党和政府联系、服务居民群众的“最后一公里”。社会治理的重心必须向基层下移，落实到城乡社区，有效防范化解社会矛盾和风险，维护城乡社区群众和谐稳定的生活，努力打造和谐有序、绿色文明、创新包容、共建共享的幸福家园。","c":"第十一章 以保障和改善民生为重点加强社会建设","p":"238"},{"id":206,"stem":"（）是最大的民生工程、民心工程、根基工程，是社会稳定的重要保障。","o":["生产","共同富裕","就业","生活水平"],"a":[2],"src":"真题模拟","n":133,"t":"单选","e":"习近平指出：“就业是最大的民生工程、民心工程、根基工程，必须抓紧抓实抓好。”国充分就业则民心安、社会稳，如果就业出了问题、大规模失业则民心浮、社会乱。劳动者只有拥有一份职业，一份工作，才能平等融人社会生活，也才更有尊严。实施就业优先战略，把就业摆在经济社会发展优先位置，突出就业作为基本民生的重要作用，有利于不断扩大就业容量、创造和增加收人、改善人民生活品质。","c":"第十一章 以保障和改善民生为重点加强社会建设","p":"232"},{"id":207,"stem":"提出人与自然是和谐共生的生命共同体，绿水青山就是金山银山，是对（）的新发展。","o":["马克思主义自然观","马克思主义社会矛盾学说","马克思主义认识论","马克思主义国家学说"],"a":[0],"src":"真题模拟","n":134,"t":"单选","e":"生态环境是人类生存最为基础的条件，生态文明建设是关系中华民族永续发展的根本大计。党的十八大以来，以习近平同志为核心的党中央把生态文明建设纳入中国特色社会主义事业总体布局，牢固树立和践行绿水青山就是金山银山的理念，以前所未有的力度抓生态文明建设，推动生态环境保护发生历史性、转折性、全局性变化。要深入贯彻习近平生态文明思想，全面推进美丽中国建设，以高品质生态环境支撑高质量发展，加快推进人与自然和谐共生的现代化，共谋全球生态文明建设之路。是对马克思主义自然观的一个延续与发展.","c":"第十二章 建设社会主义生态文明","p":"241"},{"id":208,"stem":"（）就是金山银山","o":["绿水青山","青山绿水","美好环境","人才"],"a":[0],"src":"真题模拟","n":135,"t":"单选","e":"生态环境是人类生存最为基础的条件，生态文明建设是关系中华民族永续发展的根本大计。党的十八大以来，以习近平同志为核心的党中央把生态文明建设纳入中国特色社会主义事业总体布局，牢固树立和践行绿水青山就是金山银山的理念，以前所未有的力度抓生态文明建设，推动生态环境保护发生历史性、转折性、全局性变化。要深入贯彻习近平生态文明思想，全面推进美丽中国建设，以高品质生态环境支撑高质量发展，加快推进人与自然和谐共生的现代化。","c":"第十二章 建设社会主义生态文明","p":"241"},{"id":209,"stem":"保护生态环境必须依靠最严格制度最（）法治。","o":["健全","规范","严密","以上都对"],"a":[2],"src":"真题模拟","n":136,"t":"单选","e":"坚持把建设美丽中国转化为全体人民自觉行动。生态文明是人民群众共同参与共同建设共同享有的事业，每个人都是生态环境的保护者，建设者、受益者。要在始终坚持用最严格制度最严密法治保护生态环境、保持常态化外部压力的同时，激发起全社会共同呵护生态环境的内生动力，增强全民节约意识、环保意识、生态意识，培育生态道德和行为准则，开展全民绿色行动，动员全社会都以实际行动减少能源资源消耗和污染排放，加快形成绿色生产方式和生活方式。","c":"第十二章 建设社会主义生态文明","p":"250"},{"id":210,"stem":"大自然是人类赖以生存发展的基本条件。尊重自然、顺应自然、保护自然，是全面建设社会主义现代化国家的（）","o":["内在要求","终极目标","基本属性","以上都对"],"a":[0],"src":"真题模拟","n":137,"t":"单选","e":"大自然是人类赖以生存发展的基本条件，尊重自然、顺应自然、保护自然是全面建设社会主义现代化国家的内在要求。习近平指出，“要像保护眼睛一样保护生态环境，像对待生命一样对待生态环境”。必须站在中华民族永续发展的高度，坚持绿水青山就是金山银山的理念，推进生态文明建设和生态环境保护，建设人与自然和谐共生的现代化。","c":"第十二章 建设社会主义生态文明","p":"242"},{"id":211,"stem":"实施全面（）战略，推进各类资源节约集约利用，加快构建废弃物循环利用体系。","o":["发展","节约","斗争","合作"],"a":[1],"src":"真题模拟","n":138,"t":"单选","e":"推进各类资源节约集约利用。生态环境问题，归根到底是资源过度开发、粗放利用、奢侈消费造成的。加快发展方式绿色转型，必须在转变资源利用方式、提高资源利用效率上下功夫。要树立节约集约循环利用的资源观，实行最严格的耕地保护、水资源管理制度，更加重视资源利用的系统效率，更加重视在资源开发利用过程中减少对生态环境的损害，更加重视资源的再生循环利用，加快构建废弃物循环利用体系，推动各种废弃物和垃圾集中处理和资源化利用，实现生产系统和生活系统循环链接。全面推动吃、穿、住、行、用、游等各领域消费绿色转型升级，拒绝奢华和浪费，形成节约适度、绿色低碳、文明健康的生活方式和消费模式。","c":"第十二章 建设社会主义生态文明","p":"249"},{"id":212,"stem":"要树立尊重自然、顺应自然、保护自然的生态文明理念，增强（）的意识。","o":["金山银山不如绿水青山","绿水青山就是金山银山","金山银山就是绿水青山","绿水青山胜过金山银山"],"a":[1],"src":"真题模拟","n":139,"t":"单选","e":"大自然是人类赖以生存发展的基本条件，尊重自然、顺应自然、保护自然是全面建设社会主义现代化国家的内在要求。习近平指出，“要像保护眼睛一样保护生态环境，像对待生命一样对待生态环境”。必须站在中华民族永续发展的高度，坚持绿水青山就是金山银山的理念，推进生态文明建设和生态环境保护，建设人与自然和谐共生的现代化。","c":"第十二章 建设社会主义生态文明","p":"242"},{"id":213,"stem":"（）是民族复兴的根基，社会稳定是国家强盛的前提。","o":["经济发展","国家安全","文化教育","依法治国"],"a":[1],"src":"真题模拟","n":140,"t":"单选","e":"国家安全是民族复兴的根基，社会稳定是国家强盛的前提。纵览世界各国发展史，国家的兴盛往往是在国家安全最稳固的时候，国家的衰落往往与安全政策失当密切相关。","c":"第十三章 维护和塑造国家安全","p":"160"},{"id":214,"stem":"总体国家安全观关键在（）","o":["‌国土安全","坚持全国一盘棋","经济安全","总体"],"a":[3],"src":"真题模拟","n":141,"t":"单选","e":"总体国家安全观的关键是“总体”。强调“大安全”理念，涌盖政治、军事、国土、经济、金融、文化、社会、科技、网络、粮食、生态、资源、核、海外利益、太空、深海、极地、生物、人工智能、数据等诸多领城，而且将随着社会发展不断动态调整.","c":"第十三章 维护和塑造国家安全","p":"263"},{"id":215,"stem":"（）与人民群众切身利益关系最密切，是人民群众安全感的晴雨表，是社会安定的风向标。","o":["经济安全","军事安全","政治安全","社会安全"],"a":[3],"src":"真题模拟","n":142,"t":"单选","e":"维护社会安全。社会安全与人民群众切身利益关系最密切，是人民群众安全感的晴雨表，是社会安定的风向标。","c":"第十三章 维护和塑造国家安全","p":"269"},{"id":216,"stem":"每年（）被确定为全民国家安全教育日。","o":["4月15日","5月17日","6月15日","7月30日"],"a":[0],"src":"真题模拟","n":143,"t":"单选","e":"维护国家安全的民心基础更加巩固。坚持把强化人民群众的国家安全意识作为国家安全的固本之策和长久之计，将每年4月15日确定为全民国家安全教育日，把国家安全教育纳入国民教育和精神文明建设体系，持续深入开展国家安全教育进机关、进学校、进企业、进乡村、进社区、进军营、进网络活动，加强国家安全公益宣传.","c":"第十三章 维护和塑造国家安全","p":"265"},{"id":217,"stem":"世界未有之大变局正在加速演变。（）仍然是时代主题，但是不稳定不确定性更加突出。","o":["发展与共享","和平与融合","和平与发展","开放与包容"],"a":[2],"src":"真题模拟","n":144,"t":"单选","e":"当今世界，和平与发展仍然是时代主题，但并不太平。","c":"第五章 全面深化改革开放","p":"279"},{"id":218,"stem":"关于中国共产党成立百年的宝贵经验，下列说法不准确的是：（）","o":["爱国统一战线是实现中华民族伟大复兴的战略支撑","勇于自我革命是中国共产党区别于其他政党的显著标志","马克思主义是我们立党立国的根本指导思想","中国特色社会主义是实现中华民族伟大复兴的正确道路"],"a":[0],"src":"真题模拟","n":145,"t":"单选","e":"巩固国防和强大人民军队是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的战略支撑。","c":"第一章 新时代坚持和发展中国特色社会主义","p":"278"},{"id":219,"stem":"人民军队在新形势下强军目标是：听党指挥、能打胜仗、作风优良。这意味着我国要建设一支强大的人民军队。以下属于要建设一支强大的人民军队的原因的是（）","o":["人民军队要坚持科技强军战略","人民军队是人民民主专政的坚强柱石","国防观念决定国防素质的高低","必须要坚持党对人民军队的绝对领导"],"a":[1],"src":"真题模拟","n":146,"t":"单选","e":"人民军队始终是捍卫国家主权、统一和领土完整的坚强柱石，必须做好随时打硬仗的准备，坚决捍卫国家核心利益，决不后退一步，决不丢失一寸领土。","c":"第十四章 建设巩固国防和强大人民军队","p":"280"},{"id":220,"stem":"能打胜仗是（）,反映军队的根本职能和军队建设的根本指向。","o":["核心","保证","灵魂","关键"],"a":[0],"src":"真题模拟","n":147,"t":"单选","e":"能打胜仗是核心，反映军队的根本职能和军队建设的根本指向。军队首先是一个战斗队，是为打仗而存在的。能打仗、打胜仗是军队的根本价值所在。人民军队素以能征善战著称于世，创造过许多辉煌战绩。","c":"第十四章 建设巩固国防和强大人民军队","p":"283"},{"id":221,"stem":"坚持走中国特色强军之路，全面推进国防和军队现代化，到（）把人民军队全面建成世界一流军队。","o":["本世纪末","二〇二〇","本世纪中叶","二〇三五"],"a":[2],"src":"真题模拟","n":148,"t":"单选","e":"党的十九大提出，确保到2020年基本实现机械化，信息化建设取得重大进展，战略能力有大的提升，力争到2035年基本实现国防和军队现代化，到本世纪中叶把人民军队全面建成世界一流军队。","c":"第十四章 建设巩固国防和强大人民军队","p":"284"},{"id":222,"stem":"把（）作为唯一的根本的标准，是有效履行我军根本职能的内在要求，也是提高军队建设质量效益的客观需要。","o":["政治建军","军事改革","战斗力","军事创新"],"a":[2],"src":"真题模拟","n":149,"t":"单选","e":"牢固树立战斗力这个唯一的根本的标准。人民军队永远是战斗队，人民军队的生命力在于战斗力，主责主业是备战打仗。把战斗力作为唯一的根本的标准，是有效履行人民军队根本职能的要求，也是提高军队建设质量和效益的要求。","c":"第十四章 建设巩固国防和强大人民军队","p":"291"},{"id":223,"stem":"力争到二〇三五年______国防和军队现代化，到本世纪中叶把人民军队______世界一流军队。（）","o":["全面实现；基本建成","全面实现；全面建成","基本实现；基本建成","基本实现；全面建成"],"a":[3],"src":"真题模拟","n":150,"t":"单选","e":"党的十九大提出，确保到2020年基本实现机械化，信息化建设取得重大进展，战略能力有大的提升，力争到2035年基本实现国防和军队现代化，到本世纪中叶把人民军队全面建成世界一流军队。","c":"第十四章 建设巩固国防和强大人民军队","p":"284"},{"id":224,"stem":"军队是要准备打仗的，一切工作都必须坚持（）标准，向能打仗、打胜仗聚焦。","o":["战斗力","斗争力","战争力","硬实力"],"a":[0],"src":"真题模拟","n":151,"t":"单选","e":"能打胜仗是核心，反映军队的根本职能和军队建设的根本指向。军队首先是一个战斗队，是为打仗而存在的。能打仗、打胜仗是军队的根本价值所在。人民军队素以能征善战著称于世，创造过许多辉煌战绩。新中国成立之前，人民军队先后打了400多场战役，将日本侵略者赶出了中国，打败了国民党反动集团。新中国成立后，人民军队在朝鲜战场上打败了武装到牙齿的对手，在多次边境自卫作战中捍卫了国家领土完整。人民军队因此赢得了世界各国军队的尊重。但也要看到，能打胜仗的能力标准是随着战争实践发展而不断变化的，以前能打胜仗不等于现在能打胜仗。人民军队必须牢固树立战斗力这个唯一的根本的标准，坚持一切建设和工作向能打胜仗聚焦，锻造召之即来、来之能战、战之必胜的精兵劲旅，确保一旦有事，敢于亮剑、果断出手、决战决胜。","c":"第十四章 建设巩固国防和强大人民军队","p":"283"},{"id":225,"stem":"国防和军队改革取得历史性突破，形成军委管总、战区主战、（）新格局，人民军队组织架构和力量体系实现革命性重塑。","o":["党委领导","战区主建","军种主战","军种主建"],"a":[3],"src":"真题模拟","n":152,"t":"单选","e":"改革是决定人民军队发展壮大、制胜未来的关键一招。新时代，我们党全面实施改革强军战略，大刀阔斧深化国防和军队改革，按照军委管总、战区主战、军种主建的总原则改革领导指挥体制，实现军队组织架构的历史性变革.","c":"第十四章 建设巩固国防和强大人民军队","p":"289"},{"id":226,"stem":"培养“四有”新时代革命军人，锻造“四铁”过硬部队。“四有”指的是（）","o":["有理想、有本领、有担当、有希望","有志气、有底气、有骨气、有勇气","有灵魂、有本事、有血性、有品德","有本领、有胆略、有灵魂、有斗志"],"a":[2],"src":"真题模拟","n":153,"t":"单选","e":"党的十八大以来，以习近平同志为核心的党中央领导人民军队扭住政治建军原则不放松，果断决策整肃人民军队政治纲纪，在古田召开全军政治工作会议，对新时代政治建军作出部署，以整风精神推进政治整训，人民军队政治生态根本好转，军心士气极大振奋，集聚起强军兴军的强大正能量。政治工作永远是人民军队的生命线，要充分发挥政治工作对强军兴军的生命线作用，培养有灵魂、有本事、有血性、有品德的新时代革命军人，锻造具有铁一般信仰、铁一般信念、铁一般纪律、铁一般担当的过硬部队。","c":"第十四章 建设巩固国防和强大人民军队","p":"288"},{"id":227,"stem":"（）是强军的必由之路。","o":["改革","科技","人才","创新"],"a":[0],"src":"真题模拟","n":154,"t":"单选","e":"习近平强军思想的主要内容集中体现为“十一个明确”中明确改革是强军的必由之路。","c":"第十四章 建设巩固国防和强大人民军队","p":"278"},{"id":228,"stem":"（）是决定军队建设的政治方向。","o":["军民融合是关键","能打胜仗是核心","听党指挥是灵魂","作风优良是保证"],"a":[2],"src":"真题模拟","n":155,"t":"单选","e":"听党指挥是灵魂，决定军队建设的政治方向。坚持党对人民军队的绝对领导是人民军队永远不变的军魂。","c":"第十四章 建设巩固国防和强大人民军队","p":"283"},{"id":229,"stem":"（）是两岸关系的政治基础。","o":["继续推进两岸“三通","促进两岸人文交流","协商解决两岸同胞关心的问题","一个中国原则"],"a":[3],"src":"真题模拟","n":156,"t":"单选","e":"坚持一个中国原则和“九二共识”，这是统一的政治基础.","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":"310"},{"id":230,"stem":"一国两制就是在统一的国家之内，国家主体实行（），个别地区依法实行资本主义制度。","o":["现代化","军事工作","社会主义制度","资本主义制度"],"a":[2],"src":"真题模拟","n":157,"t":"单选","e":"一国两制”是中国特色社会主义制度创新的重要成果。作为一项基本国策，“一国两制”是指在统一的国家之内，国家主体实行社会主义制度，个别地区依法实行资本主义制度。","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":"297"},{"id":231,"stem":"中央依据宪法和基本法对特别行政区拥有（）","o":["行政管理权","高度自治权","全面管治权","独立的司法权和终审权"],"a":[2],"src":"真题模拟","n":158,"t":"单选","e":"坚持中央全面管治权和保障特别行政区高度自治权相统一。我国是单一制国家，中央对包括香港、澳门特别行政区在内的所有地方行政区域拥有全面管治权。全面管治权与高度自治权在本质上是统一的。全面管治权是授权特别行政区高度自治的前提和基础，高度自治权是中央行使全面管治权的体现。","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":"299"},{"id":232,"stem":"一国两制”是一个完整的概念。“一国”是实行“两制”的（），“两制”从属和派生于“一国”并统一于“一国”之内。","o":["目标和原则","前提和基础","方向和路径","结果和目标"],"a":[1],"src":"真题模拟","n":159,"t":"单选","e":"准确把握“一国”和“两制”的关系。“一国两制”方针是一个完整的体系。维护国家主权、安全、发展利益是“一国两制”方针的最高原则，在这个前提下，香港、澳门保持原有的资本主义制度长期不变，享有高度自治权。“一国”是实行“两制”的前提和基础，“两制”从属和派生于“一国”，并统一于“一国”之内。","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":"299"},{"id":233,"stem":"中央政府对特别行政区拥有（），这是特别行政区高度自治权的源头。","o":["自主选择权","全面管治权","高度管理权","立法管治权"],"a":[1],"src":"真题模拟","n":160,"t":"单选","e":"坚持中央全面管治权和保障特别行政区高度自治权相统一。我国是单一制国家，中央对包括香港、澳门特别行政区在内的所有地方行政区域拥有全面管治权。全面管治权与高度自治权在本质上是统一的。全面管治权是授权特别行政区高度自治的前提和基础，高度自治权是中央行使全面管治权的体现。","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":"299"},{"id":234,"stem":"我们要建设和平之路、繁荣之路、开放之路、绿色之路、创新之路、（），使共建“一带一路”成为当今世界深受欢迎的国际公共产品和国际合作平台。","o":["科技之路","富裕之路","共享之路","文明之路"],"a":[3],"src":"真题模拟","n":161,"t":"单选","e":"一带一路”倡议根植历史、更面向未来，源于中国、更属于世界。2013年，习近平提出了共同建设“丝绸之路经济带”和“21世纪海上丝绸之路”的倡议，受到国际社会普遍欢迎。共建“一带一路”，秉持共商共建共享原则，坚持开放、绿色、廉洁理念，以高标准、可持续、惠民生为目标，全面推进政策沟通、设施联通、贸易畅通、资金融通、民心相通，努力建设和平之路、繁荣之路、开放之路、绿色之路、创新之路、文明之路.","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":"33"},{"id":235,"stem":"坚持以（）为原则推动“一带一路”建设。","o":["中华民族伟大复兴","维护世界和平、促进共同发展","共商共建共享","维护党中央权威"],"a":[2],"src":"真题模拟","n":162,"t":"单选","e":"坚持以相互尊重、合作共赢为基础走和平发展道路，坚持独立自主的和平外交政策，始终不渝奉行互利共赢的开放战略，以共商共建共享为原则推动“一带一路”建设，始终做世界和平的建设者、全球发展的贡献者、国际秩序的维护者。","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":"319"},{"id":236,"stem":"（），习近平先后提出共建“丝绸之路经济带”和“21世纪海上丝绸之路”的重大倡议。","o":["2015年9月和10月","2014年9月和10月","2013年9月和10月","2012年9月和10月"],"a":[2],"src":"真题模拟","n":163,"t":"单选","e":"一带一路”倡议根植历史、更面向未来，源于中国、更属于世界。2013年，习近平提出了共同建设“丝绸之路经济带”和“21世纪海上丝绸之路”的倡议，受到国际社会普遍欢迎。共建“一带一路”，","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":"334"},{"id":237,"stem":"构建人类命运共同体思想，核心是“建设持久和平、普遍安全、共同繁荣、（）的世界”。","o":["开放包容、合作共赢","清洁美丽、合作共赢","合作共赢、持续发展","开放包容、清洁美丽"],"a":[3],"src":"真题模拟","n":164,"t":"单选","e":"构建人类命运共同体，就是要携手世界各国人民共同建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。","c":"第五章 全面深化改革开放","p":"329"},{"id":238,"stem":"中国始终坚持（）的外交政策宗旨。","o":["建设“一带一路","积极参与全球治理","维护世界和平、促进共同发展","构建人类命运共同体"],"a":[2],"src":"真题模拟","n":165,"t":"单选","e":"中国始终倡导和坚持和平共处五项原则，一贯坚持独立自主的和平外交政策，从来都是维护世界和平、促进共同发展的坚定力量。走和平发展道路是基于中国历史文化传统作出的必然选择。中华民族是爱好和平的民族，中华文明具有突出的和平性。","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":"322"},{"id":239,"stem":"坚持走（）道路，推动建设新型国际关系。","o":["共同发展","和平发展","合作共赢","相互尊重"],"a":[1],"src":"真题模拟","n":166,"t":"单选","e":"必须坚定奉行独立自主的和平外交政策，坚持走和平发展道路，推动构建新型国际关系，坚决维护国家主权、安全、发展利益，彰显外交为民宗旨，走出一条中国特色大国外交新路，奋力开创新时代中国特色大国外交新局面。","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":"321"},{"id":240,"stem":"中国特色大国外交，坚持以（）为底线维护国家主权、安全、发展利益。","o":["深化外交布局","公平正义","国家核心利益","维护世界和平、促进共同发展"],"a":[2],"src":"真题模拟","n":167,"t":"单选","e":"中国特色大国外交坚持正确的原则要求。坚持以国家核心利益为底线维护国家主权、安全、发展利益，坚决遏制和打击一切形式的分裂行径，积极保障经济金融安全，有效维护海外利益，有效防范和化解各种风险挑战，为改革发展和民族复兴保驾护航。","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":"319"},{"id":241,"stem":"坚持党要管党、全面从严治党，以党的（）为统领。","o":["政治建设","思想建设","组织建设","作风建设"],"a":[0],"src":"真题模拟","n":168,"t":"单选","e":"新时代党的建设总要求；坚持和加强党的全面领导，坚持党要管党、全面从严治党，以加强党的长期执政能力建设、先进性和纯洁性建设为主线，以党的政治建设为统领，以坚定理想信念宋旨为根基，以调动全党积极性、主动性、创造性为着力点，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量，把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。","c":"第十七章 全面从严治党","p":"342"},{"id":242,"stem":"习近平新时代中国特色社会主义思想核心要义是（）","o":["坚持党的领导","坚持以人民为中心","坚持和发展中国特色社会主义","五位一体”总体布局"],"a":[2],"src":"真题模拟","n":169,"t":"单选","e":"坚持和发展中国特色社会主义，是改革开放以来我们党全部理论和实践的鲜明主题，也是习近平新时代中国特色社会主义思想的核心要义。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":243,"stem":"把习近平新时代中国特色社会主义思想载入宪法的会议是（）","o":["党的十九大","十三届全国人大一次会议","党的十九届二中全会","党的十九届三中全会"],"a":[1],"src":"真题模拟","n":170,"t":"单选","e":"党的十九大通过的党章修正案，把习近平新时代中国特色社会主义思想确立为党的指导思想，十三届全国人大一次会议把这一思想载入宪法。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":244,"stem":"习近平新时代中国特色社会主义的主要创立者是（）","o":["习近平","以习近平同志为核心的党中央","以习近平同志为核心的中央军事委员会","以习近平同志为核心的中共中央政治局常委会"],"a":[0],"src":"真题模拟","n":171,"t":"单选","e":"习近平新时代中国特色社会主义思想，是党和人民实践经验和集体智慧的结晶，主要创立者是习近平。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":245,"stem":"习近平新时代中国特色社会主义思想的主体内容是（）","o":["十个明确","十三个方面成就","十四个坚持","六个必须坚持"],"a":[0],"src":"真题模拟","n":172,"t":"单选","e":"十个明确\"是习近平新时代中国特色社会主义思想的主体内容，集中体现了这一思想体系的主要观点和基本精神，构成了这一思想体系的四梁八柱，发挥着统摄作用。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":246,"stem":"习近平新时代中国特色社会主义思想的基本方略是（）","o":["十个明确","十三个方面成就","十四个坚持","六个必须坚持"],"a":[2],"src":"真题模拟","n":173,"t":"单选","e":"十四个坚持\"是习近平新时代中国特色社会主义思想的重要组成部分，是在治国理政各方面作出的理论分析和政策指导，构成了新时代坚持和发展中国特色社会主义的基本方略。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":247,"stem":"习近平新时代中国特色社会主义思想的理论与实践成果是（）","o":["十个明确","十三个方面成就","十四个坚持","六个必须坚持"],"a":[1],"src":"真题模拟","n":174,"t":"单选","e":"十三个方面成就\"对新时代伟大实践进行了科学总结，全景式地展示了习近平新时代中国特色社会主义思想的理论与实践成果。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":248,"stem":"习近平新时代中国特色社会主义思想的根本价值立场是（）","o":["人民至上","自信自立","守正创新","问题导向"],"a":[0],"src":"真题模拟","n":175,"t":"单选","e":"坚持人民至上是习近平新时代中国特色社会主义思想的根本价值立场，体现了历史唯物主义群众史观。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":249,"stem":"关系党的事业兴衰成败第一位的问题是","o":["组织问题","理论基础","物质基础","道路问题"],"a":[3],"src":"真题模拟","n":176,"t":"单选","e":"道路问题是关系党的事业兴衰成败第一位的问题。","c":"综合 / 跨章节","p":""},{"id":250,"stem":"党和人民历经千辛万苦、付出巨大代价取得的根本成就是","o":["中国特色社会主义","中华人民共和国成立75周年","中国共产党成立100周年","全面建成小康社会"],"a":[0],"src":"真题模拟","n":177,"t":"单选","e":"中国特色社会主义是党和人民历经千辛万苦、付出巨大代价取得的根本成就，是实现中华民族伟大复兴的必由之路。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":251,"stem":"历史已经并将继续证明，只有（）才能救中国，只有坚持和发展（）才能实现中华民族伟大复兴。","o":["社会主义中国特色社会主义","中国特色社会主义社会主义","马克思主义社会主义","马克思主义中国特色社会主义"],"a":[0],"src":"真题模拟","n":178,"t":"单选","e":"历史和实践充分证明，只有社会主义才能救中国，只有社会主义才能发展中国，只有坚持和发展中国特色社会主义才能实现中华民族伟大复兴。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":252,"stem":"党的十九大对我国发展新的历史方位作出的重大政治判断是","o":["我国社会主要矛盾发生了变化","我国开启了强起来的时代","中国特色社会主义进入新时代","分\"两步走\"实现社会主义现代化强国"],"a":[2],"src":"真题模拟","n":179,"t":"单选","e":"经过长期努力，中国特色社会主义进入了新时代，这是我国发展新的历史方位。党的十九大作出的这一重大政治论断，赋予党的历史使命、理论遵循、目标任务以新的时代内涵，为我们深刻把握当代中国发展的新阶段新特征，科学制定党的路线方针政策提供了时代坐标和基本依据。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":253,"stem":"党的十九大提出，我国主要矛盾已经转化为","o":["人民日益增长的物质文化生活需要和不平衡不充分的发展之间的矛盾","人民日益增长的美好生活需要和落后的社会生产之间的矛盾","人民对于建立先进的工业国的需要与落后的农业国之间的矛盾","人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾"],"a":[3],"src":"真题模拟","n":180,"t":"单选","e":"2017年10月，党的十九大指出，中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":254,"stem":"我们党鲜明的政治品格和强大的政治优势是","o":["马克思主义科学理论","邓小平理论","三个代表\"重要思想","科学发展观"],"a":[0],"src":"真题模拟","n":182,"t":"单选","e":"拥有马克思主义科学理论指导是我们党鲜明的政治品格和强大的政治优势，是我们党坚定信仰信念、把握历史主动的根本所在。","c":"综合 / 跨章节","p":""},{"id":255,"stem":"新时代党和国家事业发展的根本遵循是","o":["习近平新时代中国特色社会主义思想","邓小平理论","三个代表\"重要思想","科学发展观"],"a":[0],"src":"真题模拟","n":183,"t":"单选","e":"习近平新时代中国特色社会主义思想是新时代中国共产党的思想旗帜，是新时代党和国家事业发展的根本遵循。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":256,"stem":"国家的生命线、人民的幸福线是","o":["党的基本路线","党的基本理论","党的基本方略"],"a":[0],"src":"真题模拟","n":184,"t":"单选","e":"党的基本路线是国家的生命线、人民的幸福线。党的基本路线明确了中国特色社会主义发展的历史方位、主体力量、兴国之要、立国之本、强国之路和奋斗目标，必须牢牢坚持、毫不动摇。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":257,"stem":"中国特色社会主义事业总体布局的中心是","o":["生态文明建设","精神文明建设","政治文明建设","经济建设"],"a":[3],"src":"真题模拟","n":185,"t":"单选","e":"要按照\"五位一体\"总体布局的整体性目标要求，坚持以经济建设为中心，努力推动社会主义物质文明、政治文明、精神文明、社会文明、生态文明协调发展，不断推进和拓展中国式现代化，不断丰富和发展人类文明新形态。","c":"第十章 建设社会主义文化强国","p":""},{"id":258,"stem":"2012年11月29日，习近平率中央政治局常委和中央书记处的同志来到国家博物馆参观展览。这次参加的展览是","o":["《奋斗之路》","《振兴之路》","《复兴之路》","《大国之路》"],"a":[2],"src":"真题模拟","n":186,"t":"单选","e":"2012年11月29日，习近平率中央政治局常委和中央书记处的同志来到国家博物馆，参观《复兴之路》展览。","c":"综合 / 跨章节","p":""},{"id":259,"stem":"提出到2020年全面建成小康社会奋斗目标的是","o":["党的十六大","党的十七大","党的十八大","党的十九大"],"a":[2],"src":"真题模拟","n":187,"t":"单选","e":"党的十八大提出了到2020年全面建成小康社会的奋斗目标。全面建成小康社会标志着我们跨过了实现现代化建设第三步战略目标必经的承上启下的重要发展阶段。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":""},{"id":260,"stem":"2021年7月1日，习近平在天安门城楼上庄严宣告，经过全党全国各族人民持续奋斗，我们实现了（）","o":["社会主义现代化","中华民族伟大复兴","第一个百年奋斗目标","第二个百年奋斗目标"],"a":[2],"src":"真题模拟","n":188,"t":"单选","e":"2021年7月1日，习近平在天安门城楼上庄严宣告，经过全党全国各族人民持续奋斗，我们实现了第一个百年奋斗目标，在中华大地上全面建成了小康社会，历史性地解决了绝对贫困问题，正在意气风发向着全面建成社会主义现代化强国的第二个百年奋斗目标迈进。","c":"第八章 发展全过程人民民主","p":""},{"id":261,"stem":"中华民族伟大复兴的形象表达是","o":["共同富裕","中国梦","自强不息","坚韧不拔"],"a":[1],"src":"真题模拟","n":189,"t":"单选","e":"中国梦是中华民族伟大复兴的形象表达。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":262,"stem":"近代以来中华民族最伟大的梦想是","o":["实现民族解放、国家独立","摆脱贫困","全面建成小康社会","实现中华民族的伟大复兴"],"a":[3],"src":"真题模拟","n":190,"t":"单选","e":"实现中华民族伟大复兴，就是中华民族近代以来最伟大的梦想。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":""},{"id":263,"stem":"在中国，实现强国建设、民族复兴的唯一正确道路是","o":["中国式资本化","中国式现代化","中国式军事化","中国式民主化"],"a":[1],"src":"真题模拟","n":191,"t":"单选","e":"中国式现代化是强国建设、民族复兴的唯一正确道路。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":""},{"id":264,"stem":"近代中国谋求现代化的第一份蓝图是（）","o":["《建国方略》","《中华民国临时约法》","《中华民国训政时期约法》","《中华民国宪法》"],"a":[0],"src":"真题模拟","n":192,"t":"单选","e":"孙中山领导辛亥革命试图以建立资产阶级共和国、振兴实业等方案来实现现代化，他的《建国方略》被称为近代中国谋求现代化的第一份蓝图。","c":"第九章 全面依法治国","p":""},{"id":265,"stem":"我国全体人民整体迈进现代化，人口规模超过现有发达国家的总和，将极大改变现代化的世界版图。这说明中国式现代化是（）的现代化。","o":["全体人民共同富裕","物质文明和精神文明相协调","人口规模巨大","人与自然和谐共生"],"a":[2],"src":"真题模拟","n":193,"t":"单选","e":"中国式现代化是人口规模巨大的现代化。我国全体人民整体迈进现代化，人口规模超过现有发达国家的总和，将极大改变现代化的世界版图。","c":"第十章 建设社会主义文化强国","p":""},{"id":266,"stem":"全面建设社会主义现代化国家的主心骨和领航者是","o":["各民主党派","中国共产党","人民群众","知识分子"],"a":[1],"src":"真题模拟","n":194,"t":"单选","e":"中国共产党是全面建设社会主义现代化国家的主心骨和领航者，具有严密的组织体系、强有力和广泛的社会动员能力。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":""},{"id":267,"stem":"推进现代化最坚实的根基、最深厚的力量是","o":["各民主党派","中国共产党","人民群众","知识分子"],"a":[2],"src":"真题模拟","n":195,"t":"单选","e":"中国式现代化是造福人民的现代化。人民是推进现代化最坚实的根基、最深厚的力量。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":""},{"id":268,"stem":"要深刻洞察世界发展大势，准确把握人民群众共同愿望，深入探索经济社会发展规律，制定好规划和政策体系。这说明在推进中国式现代化过程中要处理好","o":["效率与公平的关系","守正与创新的关系","战略与策略的关系","顶层设计与实践探索的关系"],"a":[3],"src":"真题模拟","n":196,"t":"单选","e":"题干所述属于在推进中国式现代化过程中要正确处理顶层设计与实践探索的关系的内容。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":""},{"id":269,"stem":"实施战略的环境条件随时都在发生变化，每时每刻都会遇到新情况新问题，要把战略的原则性和策略的灵活性有机结合起来，这说明在推进中国式现代化过程中要处理好","o":["效率与公平的关系","守正与创新的关系","战略与策略的关系","顶层设计与 const CHAPTERS  = ["第一章 新时代坚持和发展中国特色社会主义", "第二章 以中国式现代化全面推进中华民族伟大复兴", "第三章 坚持党的全面领导", "第四章 坚持以人民为中心", "第五章 全面深化改革开放", "第六章 推动高质量发展", "第七章 教育、科技、人才", "第八章 发展全过程人民民主", "第九章 全面依法治国", "第十章 建设社会主义文化强国", "第十一章 以保障和改善民生为重点加强社会建设", "第十二章 建设社会主义生态文明", "第十三章 维护和塑造国家安全", "第十四章 建设巩固国防和强大人民军队", "第十五章 坚持“一国两制”和推进祖国完全统一", "第十六章 中国特色大国外交和推动构建人类命运共同体", "第十七章 全面从严治党", "综合 / 跨章节"];
const LS_KEY = 'xg15040_quiz_v1';

/* ---------- 状态 ---------- */
let store = { stats:{answered:0,correct:0}, wrong:[], fav:[], prog:{} };
try{ const raw = localStorage.getItem(LS_KEY); if(raw) store = Object.assign(store, JSON.parse(raw)); }catch(e){}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }

const S = { mode:'seq', queue:[], idx:0, sel:[], locked:false, sess:{answered:0,correct:0},
            filter:{ src:'全部', type:'全部', chap:'全部' } };
let ROUND_WRONG=new Set();   // 本轮错题 id
let ROUND_ANS={};            // 本轮每题作答记录 id -> [选项下标]

/* ---------- 工具 ---------- */
const $ = s=>document.querySelector(s);
const letter = i=>String.fromCharCode(65+i);
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $('#'+id).classList.add('active'); $('#'+id).scrollTop=0; }
function eq(a,b){ return a.length===b.length && a.slice().sort().join()===b.slice().sort().join(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- 筛选 ---------- */
function filtered(){
  return QUESTIONS.filter(q=>{
    if(S.filter.src!=='全部' && q.src!==S.filter.src) return false;
    if(S.filter.type!=='全部' && q.t!==S.filter.type) return false;
    if(S.filter.chap!=='全部' && q.c!==S.filter.chap) return false;
    return true;
  });
}
function renderChips(el, values, key, allLabel='全部'){
  el.innerHTML='';
  [allLabel].concat(values).forEach(v=>{
    const b=document.createElement('button');
    b.className='chip'+(S.filter[key]===v?' on':'');
    b.textContent = v===allLabel?allLabel:(v.length>14?v.slice(0,12)+'…':v);
    if(v.length>14) b.title=v;
    b.onclick=()=>{ S.filter[key]=v; renderChips(el,values,key,allLabel); updateCount(); };
    el.appendChild(b);
  });
}
function updateCount(){
  const n = filtered().length;
  $('#curCount').textContent=n;
}
function initFilters(){
  const srcs = [...new Set(QUESTIONS.map(q=>q.src))];
  renderChips($('#fSrc'), srcs, 'src');
  renderChips($('#fType'), ['单选','多选'], 'type');
  renderChips($('#fChap'), CHAPTERS, 'chap');
}

/* ---------- 首页统计 ---------- */
function renderHome(){
  $('#sTotal').textContent = QUESTIONS.length;
  $('#footTotal').textContent = QUESTIONS.length;
  $('#sDone').textContent = store.stats.answered;
  $('#sAcc').textContent = store.stats.answered? Math.round(store.stats.correct/store.stats.answered*100)+'%' : '--';
  $('#wrongCnt').textContent = store.wrong.length + ' 题待复习';
  $('#favCnt').textContent = store.fav.length + ' 题已收藏';
}

/* ---------- 开始练习 ---------- */
function start(mode){
  S.mode=mode;
  let ids;
  if(mode==='wrong'){ ids = store.wrong.slice(); }
  else if(mode==='fav'){ ids = store.fav.slice(); }
  else { ids = filtered().map(q=>q.id); if(mode==='rand') shuffle(ids); }
  S.queue = ids.filter(id=>QUESTIONS[id]);
  S.idx=0; S.sess={answered:0,correct:0};
  ROUND_WRONG=new Set(); ROUND_ANS={};
  if(S.queue.length===0){
    const el=$('#quizBody');
    el.innerHTML = '<div class="empty"><div class="big">'+
      (mode==='wrong'?'🎉':(mode==='fav'?'☆':'∅'))+'</div>'+
      (mode==='wrong'?'太棒了，暂无错题。<br>继续保持！':(mode==='fav'?'还没有收藏题目。<br>答题时点右上角 ☆ 收藏。':'当前筛选条件下没有题目。<br>请调整筛选条件。'))+
      '<div style="height:20px"></div><button class="btn pri" style="max-width:200px;margin:0 auto;display:block" onclick="goHome()">返回首页</button></div>';
    show('quiz'); return;
  }
  show('quiz');
  render();
}
function goHome(){ show('home'); renderHome(); }

/* ---------- 渲染题目 ---------- */
function render(){
  const q = QUESTIONS[S.queue[S.idx]];
  const answered = Object.prototype.hasOwnProperty.call(ROUND_ANS, q.id);
  S.sel = answered ? ROUND_ANS[q.id].slice() : [];
  S.locked = answered;
  $('#counter').textContent = (S.idx+1)+'/'+S.queue.length;
  const doneCnt = S.queue.filter(id=>Object.prototype.hasOwnProperty.call(ROUND_ANS,id)).length;
  $('#pbarIn').style.width = (doneCnt/S.queue.length*100)+'%';
  const isFav = store.fav.includes(q.id);
  $('#favBtn').textContent = isFav?'★':'☆';
  $('#favBtn').classList.toggle('star', isFav);

  const srcTxt = q.src + ' · 第' + q.n + '题';
  let html = '<div class="qmeta">'+
    '<span class="badge b-src">'+srcTxt+'</span>'+
    '<span class="badge '+(q.t==='多选'?'b-multi':'b-type')+'">'+q.t+'题</span>'+
    '</div>';
  html += '<div class="qcard"><div class="qstem"><span class="qno">'+(S.idx+1)+'.</span>'+esc(q.stem)+'</div></div>';
  html += '<div class="opts" id="opts"></div>';
  html += '<div class="submit-wrap" id="submitWrap"></div>';
  html += '<div class="explain" id="explain"></div>';
  html += '<div class="qnav">'+
      '<button class="btn ghost" id="prevBtn"'+(S.idx===0?' disabled':'')+'>上一题</button>'+
      '<button class="btn pri" id="nextBtn">'+(S.idx===S.queue.length-1?'完成本轮':'下一题')+'</button>'+
    '</div>';
  $('#quizBody').innerHTML = html;

  const opts=$('#opts');
  q.o.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='opt'; d.dataset.i=i;
    d.style.animationDelay=(i*0.045)+'s';
    d.innerHTML='<div class="kk">'+letter(i)+'</div><div class="tx">'+esc(t)+'</div><div class="mk"></div>';
    if(answered){
      if(q.a.includes(i)){ d.classList.add('ok'); d.querySelector('.mk').textContent='✓'; }
      else if(S.sel.includes(i)){ d.classList.add('no'); d.querySelector('.mk').textContent='✕'; }
    } else if(S.sel.includes(i)){ d.classList.add('sel'); }
    d.onclick=()=>pick(i);
    opts.appendChild(d);
  });
  if(answered){ showExplain(q, eq(S.sel,q.a)); }
  else if(q.t==='多选'){ renderSubmit(true); }
  $('#prevBtn').onclick=prev; $('#nextBtn').onclick=next;
}
function renderSubmit(showIt){
  const w=$('#submitWrap');
  if(!showIt){ w.innerHTML=''; return; }
  w.innerHTML='<button class="btn pri" id="subBtn">提交答案（可多选）</button>';
  $('#subBtn').onclick=submitMulti;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 选择 ---------- */
function pick(i){
  if(S.locked) return;
  const q=QUESTIONS[S.queue[S.idx]];
  if(q.t==='单选'){
    S.sel=[i]; judge();
  }else{
    const p=S.sel.indexOf(i);
    if(p>=0) S.sel.splice(p,1); else S.sel.push(i);
    document.querySelectorAll('.opt').forEach(o=>{
      o.classList.toggle('sel', S.sel.includes(+o.dataset.i));
    });
  }
}
function submitMulti(){ if(S.locked||S.sel.length===0) return; judge(); }

/* ---------- 判定 ---------- */
function judge(){
  S.locked=true;
  const q=QUESTIONS[S.queue[S.idx]];
  const ok = eq(S.sel, q.a);
  ROUND_ANS[q.id] = S.sel.slice();
  if(!ok) ROUND_WRONG.add(q.id);
  S.sess.answered++; if(ok) S.sess.correct++;
  store.stats.answered++; if(ok) store.stats.correct++;
  if(!ok){ if(!store.wrong.includes(q.id)) store.wrong.push(q.id); }
  else { const w=store.wrong.indexOf(q.id); if(w>=0) store.wrong.splice(w,1); }
  save();

  document.querySelectorAll('.opt').forEach(o=>{
    const i=+o.dataset.i;
    o.classList.remove('sel');
    if(q.a.includes(i)){ o.classList.add('ok'); o.querySelector('.mk').textContent='✓'; }
    else if(S.sel.includes(i)){ o.classList.add('no'); o.querySelector('.mk').textContent='✕'; }
  });
  renderSubmit(false);
  $('#pbarIn').style.width=((S.idx+1)/S.queue.length*100)+'%';
  showExplain(q, ok);
  if(q.t==='多选'){ const o=$('#subBtn'); if(o) o.disabled=true; }
}
function showExplain(q, ok){
  const el=$('#explain');
  const ansTxt = q.a.map(letter).join(' ');
  let h='<div class="ex-head '+(ok?'ex-right':'ex-wrong')+'"><span class="dot">'+(ok?'✓':'✕')+'</span>'+(ok?'回答正确':'回答错误')+'</div>';
  h+='<div class="ex-ans">正确答案：<b>'+ansTxt+'</b>　你的选择：<b style="color:'+(ok?'var(--ok)':'var(--no)')+'">'+(S.sel.map(letter).join(' ')||'未作答')+'</b></div>';
  if(q.e){ h+='<div class="ex-body"><b style="color:var(--tx)">解析：</b>'+esc(q.e)+'</div>'; }
  else{ h+='<div class="ex-body" style="color:var(--tx3)">本套资料未附解析，答案依据原文档标注。可对照下方知识点章节复习。</div>'; }
  h+='<div class="ex-src"><b>知识点：</b><span class="k">'+esc(q.c)+'</span><br>'+
     '<b>来源：</b>'+esc(q.src)+' · 第'+q.n+'题'+(q.p?' · 《电子教辅》P'+q.p:'')+'</div>';
  el.className='explain show';
  el.innerHTML=h;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ---------- 翻页 ---------- */
function next(){
  if(S.idx>=S.queue.length-1){ finish(); return; }
  S.idx++; render();
}
function prev(){ if(S.idx>0){ S.idx--; render(); } }

/* ---------- 结算 ---------- */
function finish(){
  const a=S.sess.answered, c=S.sess.correct;
  const acc = a? Math.round(c/a*100):0;
  $('#rAcc').textContent=acc+'%';
  $('#rTitle').textContent = acc>=90?'非常出色！':acc>=75?'表现良好':acc>=60?'继续加油':'需要加强';
  $('#rTxt').textContent='本轮作答 '+a+' 题，答对 '+c+' 题，答错 '+(a-c)+' 题';
  const arc=$('#ringArc');
  arc.style.strokeDashoffset = 351.9*(1-acc/100);

  const list=$('#rList');
  const wrongs=[...ROUND_WRONG].map(id=>QUESTIONS[id]).filter(Boolean);
  let h='';
  if(wrongs.length){
    h+='<div class="sec-title" style="margin:6px 4px 11px"><i></i>本轮错题回顾（'+wrongs.length+'）</div>';
    wrongs.forEach(q=>{
      const my=(ROUND_ANS[q.id]||[]).map(letter).join(' ')||'未作答';
      h+='<div class="item"><div class="q">'+esc(q.stem)+'</div>'+
         '<div class="a">你的选择：<em>'+my+'</em>　正确答案：<i>'+q.a.map(letter).join(' ')+'</i></div>'+
         '<div class="a" style="margin-top:5px;color:var(--tx3)">'+esc(q.src)+' · 第'+q.n+'题 · '+esc(q.c)+'</div></div>';
    });
    h+='<div style="height:6px"></div><button class="btn pri" style="width:100%" id="redoWrong">立即重做本轮错题（'+wrongs.length+'）</button>';
  } else {
    h+='<div class="empty" style="padding:40px 20px"><div class="big">🎉</div>本轮全部答对，太棒了！<br><span style="font-size:13px">保持这个状态，考试稳了。</span></div>';
  }
  list.innerHTML=h;
  const rd=$('#redoWrong');
  if(rd) rd.onclick=()=>{ S.queue=[...ROUND_WRONG].filter(id=>QUESTIONS[id]); S.idx=0;
    S.sess={answered:0,correct:0}; ROUND_WRONG=new Set(); ROUND_ANS={}; show('quiz'); render(); };
  show('result');
}

/* ---------- 事件 ---------- */
$('#themeBtn').onclick=()=>{
  const cur=document.documentElement.getAttribute('data-theme');
  const nx = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',nx);
  $('#themeBtn').textContent = nx==='dark'?'☀':'☾';
  try{ localStorage.setItem('xg15040_theme',nx); }catch(e){}
};
$('#backBtn').onclick=()=>{ if(confirm('确定退出本轮练习？')) goHome(); };
$('#favBtn').onclick=()=>{
  const q=QUESTIONS[S.queue[S.idx]]; if(!q) return;
  const i=store.fav.indexOf(q.id);
  if(i>=0){ store.fav.splice(i,1); $('#favBtn').textContent='☆'; }
  else { store.fav.push(q.id); $('#favBtn').textContent='★'; }
  save(); renderHome();
};
$('#rHome').onclick=goHome;
$('#rAgain').onclick=()=>start(S.mode);
$('#resetBtn').onclick=()=>{
  if(confirm('确定清空全部练习记录（错题本、收藏、统计）？此操作不可恢复。')){
    store={stats:{answered:0,correct:0},wrong:[],fav:[],prog:{}}; save(); renderHome();
  }
};
document.querySelectorAll('.mode-btn[data-mode]').forEach(b=>{
  b.onclick=()=>start(b.dataset.mode);
});
document.addEventListener('keydown',e=>{
  if(!$('#quiz').classList.contains('active')) return;
  const k=e.key.toUpperCase();
  if('ABCD'.includes(k)) pick('ABCD'.indexOf(k));
  if(k==='ENTER'){ const q=QUESTIONS[S.queue[S.idx]]; if(q&&q.t==='多选') submitMulti(); else next(); }
});

/* ---------- 初始化 ---------- */
(function init(){
  const th=localStorage.getItem('xg15040_theme');
  if(th){ document.documentElement.setAttribute('data-theme',th); $('#themeBtn').textContent = th==='dark'?'☀':'☾'; }
  else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches){
    document.documentElement.setAttribute('data-theme','dark'); $('#themeBtn').textContent='☀';
  }
  initFilters(); updateCount(); renderHome();
})();
</script>
</body>
</html>
