<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#9c1c1c">
<title>习概15040 · 手机刷题</title>
<style>
:root{
  --pri:#c0392b; --pri-d:#8e1b1b; --pri-l:#e05a4a;
  --gold:#d8a84a;
  --bg:#f2f3f6; --bg2:#e9ebf0; --card:#ffffff;
  --tx:#1d2129; --tx2:#606773; --tx3:#9aa1ad; --line:#e8eaef;
  --ok:#149a5b; --ok-bg:#e7f7ee; --ok-bd:#8fd9b4;
  --no:#e5484d; --no-bg:#fdecec; --no-bd:#f3b0b2;
  --shadow:0 6px 22px rgba(24,32,54,.09);
  --shadow-sm:0 2px 10px rgba(24,32,54,.06);
  --r:16px;
}
html[data-theme="dark"]{
  --bg:#121417; --bg2:#191d22; --card:#1c2026;
  --tx:#eef1f5; --tx2:#a9b1bd; --tx3:#767e8b; --line:#2a2f37;
  --ok-bg:#12251b; --ok-bd:#2c6b48; --no-bg:#2a1618; --no-bd:#6e2f33;
  --shadow:0 6px 22px rgba(0,0,0,.35);
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--tx);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  transition:background .3s ease,color .3s ease;
}
#app{position:relative;width:100%;max-width:520px;margin:0 auto;height:100dvh;overflow:hidden;
  background:var(--bg);}
.screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  opacity:0;transform:translateY(14px) scale(.995);pointer-events:none;
  transition:opacity .3s cubic-bezier(.22,.61,.36,1),transform .3s cubic-bezier(.22,.61,.36,1);
  padding:0 0 28px;}
.screen.active{opacity:1;transform:none;pointer-events:auto}

/* ---------- 首页 ---------- */
.hero{background:linear-gradient(150deg,#b3261e 0%,#8e1b1b 62%,#6d1414 100%);
  color:#fff;padding:30px 20px 58px;border-radius:0 0 26px 26px;position:relative;overflow:hidden;}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;
  border-radius:50%;background:radial-gradient(circle,rgba(216,168,74,.42),transparent 68%);}
.hero::before{content:"";position:absolute;left:-40px;bottom:-90px;width:170px;height:170px;
  border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.13),transparent 70%);}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:2}
.hero h1{margin:0;font-size:23px;letter-spacing:.5px;font-weight:800}
.hero .sub{margin:6px 0 0;font-size:12.5px;opacity:.82;letter-spacing:.3px}
.theme-btn{background:rgba(255,255,255,.16);border:none;color:#fff;width:38px;height:38px;
  border-radius:12px;font-size:17px;cursor:pointer;backdrop-filter:blur(4px);
  transition:transform .18s ease,background .2s ease}
.theme-btn:active{transform:scale(.9)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px;position:relative;z-index:2}
.stat{background:rgba(255,255,255,.13);border-radius:14px;padding:11px 8px;text-align:center;
  backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14)}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:.5px}
.stat span{font-size:11px;opacity:.82}

.wrap{padding:0 16px;margin-top:-38px;position:relative;z-index:5}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;
  margin-bottom:14px;transition:background .3s ease,box-shadow .25s ease}
.sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--tx2);
  margin:2px 2px 11px;letter-spacing:.4px}
.sec-title i{width:4px;height:14px;border-radius:3px;background:linear-gradient(var(--pri),var(--gold));display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-ms-overflow-style:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{border:1.4px solid var(--line);background:var(--card);color:var(--tx2);
  padding:7px 14px;border-radius:999px;font-size:13px;white-space:nowrap;cursor:pointer;
  transition:all .22s cubic-bezier(.22,.61,.36,1);user-select:none}
.chip:active{transform:scale(.94)}
.chip.on{background:linear-gradient(135deg,var(--pri),var(--pri-d));color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(192,57,43,.32)}
.mode-btn{display:flex;align-items:center;gap:14px;width:100%;border:none;cursor:pointer;
  background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);
  margin-bottom:12px;text-align:left;transition:transform .2s ease,box-shadow .25s ease;color:var(--tx)}
.mode-btn:active{transform:scale(.975)}
.mode-btn .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:21px;
  color:#fff;flex:0 0 auto}
.mode-btn .tt{font-size:16px;font-weight:700;margin-bottom:3px}
.mode-btn .ds{font-size:12px;color:var(--tx3)}
.mode-btn .ar{margin-left:auto;color:var(--tx3);font-size:19px}
.g1{background:linear-gradient(135deg,#c0392b,#8e1b1b)}
.g2{background:linear-gradient(135deg,#3d6fb4,#254a80)}
.g3{background:linear-gradient(135deg,#2f9e6d,#1b6b47)}
.g4{background:linear-gradient(135deg,#d8a84a,#b3821f)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.count-note{font-size:12.5px;color:var(--tx2);text-align:center;margin:14px 0 0}
.count-note b{color:var(--pri);font-weight:800}
.foot{text-align:center;font-size:11px;color:var(--tx3);margin:18px 0 0;line-height:1.7;padding:0 10px}

/* ---------- 答题页 ---------- */
.qbar{position:sticky;top:0;z-index:20;background:var(--card);padding:11px 14px 9px;
  border-bottom:1px solid var(--line);box-shadow:0 2px 12px rgba(24,32,54,.05)}
.qbar-row{display:flex;align-items:center;gap:11px}
.iconbtn{background:var(--bg2);border:none;width:36px;height:36px;border-radius:11px;font-size:16px;
  color:var(--tx3);cursor:pointer;flex:0 0 auto;transition:transform .16s ease,background .2s,color .2s}
.iconbtn:active{transform:scale(.9)}
.iconbtn.star{color:var(--gold)}
.pbar{flex:1;height:7px;border-radius:99px;background:var(--bg2);overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--pri),var(--gold));transition:width .45s cubic-bezier(.22,.61,.36,1)}
.counter{font-size:12.5px;font-weight:700;color:var(--tx2);white-space:nowrap;font-variant-numeric:tabular-nums}
.qmeta{display:flex;gap:7px;flex-wrap:wrap;margin:16px 16px 0}
.badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;letter-spacing:.3px}
.b-src{background:var(--bg2);color:var(--tx2)}
.b-type{background:rgba(192,57,43,.1);color:var(--pri)}
.b-multi{background:rgba(61,111,180,.12);color:#3d6fb4}
.qcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:19px 17px;
  margin:12px 16px 0;animation:qin .38s cubic-bezier(.22,.61,.36,1)}
@keyframes qin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.qstem{font-size:16.5px;line-height:1.62;font-weight:600;color:var(--tx)}
.qstem .qno{color:var(--pri);font-weight:800;margin-right:2px}
.opts{margin:14px 16px 0}
.opt{display:flex;gap:11px;align-items:flex-start;background:var(--card);border:1.6px solid var(--line);
  border-radius:14px;padding:13px 14px;margin-bottom:11px;cursor:pointer;font-size:15px;line-height:1.5;
  color:var(--tx);transition:transform .18s ease,border-color .22s ease,background .25s ease,box-shadow .25s;
  animation:oin .34s backwards cubic-bezier(.22,.61,.36,1)}
@keyframes oin{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.opt:active{transform:scale(.985)}
.opt .kk{flex:0 0 auto;width:25px;height:25px;border-radius:9px;background:var(--bg2);color:var(--tx2);
  display:grid;place-items:center;font-size:13px;font-weight:800;transition:all .22s ease}
.opt .tx{flex:1;min-width:0;padding-top:1px}
.opt.sel{border-color:var(--pri);background:rgba(192,57,43,.055)}
.opt.sel .kk{background:var(--pri);color:#fff}
.opt.ok{border-color:var(--ok-bd);background:var(--ok-bg)}
.opt.ok .kk{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no-bd);background:var(--no-bg);animation:shake .42s}
.opt.no .kk{background:var(--no);color:#fff}
.opt .mk{margin-left:auto;font-weight:800;font-size:15px}
.opt.ok .mk{color:var(--ok)} .opt.no .mk{color:var(--no)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.explain{display:none;margin:14px 16px 0;border-radius:var(--r);background:var(--card);
  box-shadow:var(--shadow);border:1px solid var(--line);padding:15px 16px}
.explain.show{display:block;animation:exin .42s cubic-bezier(.22,.61,.36,1)}
@keyframes exin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ex-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:9px}
.ex-head .dot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:13px;color:#fff}
.ex-right{color:var(--ok)} .ex-wrong{color:var(--no)}
.ex-right .dot{background:var(--ok)} .ex-wrong .dot{background:var(--no)}
.ex-ans{font-size:14px;margin-bottom:9px;color:var(--tx2)}
.ex-ans b{color:var(--pri);font-weight:800}
.ex-body{font-size:14.5px;line-height:1.74;color:var(--tx2);white-space:pre-wrap}
.ex-src{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:12.5px;
  color:var(--tx3);line-height:1.85}
.ex-src b{color:var(--tx2);font-weight:700}
.ex-src .k{color:var(--pri);font-weight:700}
.qnav{display:flex;gap:12px;margin:16px 16px 0}
.btn{flex:1;border:none;border-radius:14px;padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;
  transition:transform .18s ease,opacity .2s,box-shadow .25s;color:#fff}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--pri),var(--pri-d));box-shadow:0 6px 16px rgba(192,57,43,.3)}
.btn.ghost{background:var(--card);color:var(--tx2);box-shadow:var(--shadow-sm);border:1.4px solid var(--line)}
.btn:disabled{opacity:.42;box-shadow:none}
.submit-wrap{margin:16px 16px 0}
.empty{padding:80px 30px;text-align:center;color:var(--tx3);font-size:14px;line-height:1.9}
.empty .big{font-size:44px;margin-bottom:12px}

/* ---------- 结算 ---------- */
.resu{background:linear-gradient(150deg,#b3261e,#8e1b1b);color:#fff;padding:36px 20px 40px;
  border-radius:0 0 26px 26px;text-align:center}
.ring{width:132px;height:132px;margin:6px auto 16px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column}
.ring .val b{font-size:33px;font-weight:800;line-height:1}
.ring .val span{font-size:11.5px;opacity:.85;margin-top:4px}
.resu .ttl{font-size:19px;font-weight:800}
.resu .txt{font-size:13px;opacity:.85;margin-top:6px}
.rlist{margin:16px}
.rlist .item{background:var(--card);border-radius:14px;padding:14px;margin-bottom:11px;box-shadow:var(--shadow-sm);
  font-size:14px;line-height:1.6}
.rlist .item .q{font-weight:600;margin-bottom:7px}
.rlist .item .a{font-size:13px;color:var(--tx3)}
.rlist .item .a em{font-style:normal;color:var(--no);font-weight:700}
.rlist .item .a i{font-style:normal;color:var(--ok);font-weight:700}
.hidden{display:none !important}
@media(min-width:521px){body{background:var(--bg2)}#app{box-shadow:0 0 44px rgba(0,0,0,.12)}}
</style>
</head>
<body>
<div id="app">

  <!-- ===== 首页 ===== -->
  <section id="home" class="screen active">
    <div class="hero">
      <div class="hero-top">
        <div>
          <h1>习概 15040 · 刷题</h1>
          <p class="sub">习近平新时代中国特色社会主义思想概论</p>
        </div>
        <button class="theme-btn" id="themeBtn" title="切换夜间模式">☾</button>
      </div>
      <div class="stat-row">
        <div class="stat"><b id="sTotal">0</b><span>题库总量</span></div>
        <div class="stat"><b id="sDone">0</b><span>累计已练</span></div>
        <div class="stat"><b id="sAcc">--</b><span>历史正确率</span></div>
      </div>
    </div>

    <div class="wrap">
      <div class="card">
        <div class="sec-title"><i></i>来源筛选</div>
        <div class="chips" id="fSrc"></div>
      </div>
      <div class="card">
        <div class="sec-title"><i></i>题型筛选</div>
        <div class="chips" id="fType"></div>
      </div>
      <div class="card">
        <div class="sec-title"><i></i>知识点章节</div>
        <div class="chips scroll" id="fChap"></div>
      </div>

      <div class="count-note">当前题库：<b id="curCount">0</b> 题</div>

      <div style="height:14px"></div>
      <button class="mode-btn" data-mode="seq">
        <div class="ic g1">☰</div>
        <div><div class="tt">顺序练习</div><div class="ds">按题库顺序逐题精练</div></div>
        <div class="ar">›</div>
      </button>
      <button class="mode-btn" data-mode="rand">
        <div class="ic g2">⇄</div>
        <div><div class="tt">随机练习</div><div class="ds">打乱顺序，检验真实掌握度</div></div>
        <div class="ar">›</div>
      </button>
      <div class="quick">
        <button class="mode-btn" data-mode="wrong" style="margin-bottom:0">
          <div class="ic g3">✕</div>
          <div><div class="tt">错题本</div><div class="ds" id="wrongCnt">0 题待复习</div></div>
        </button>
        <button class="mode-btn" data-mode="fav" style="margin-bottom:0">
          <div class="ic g4">★</div>
          <div><div class="tt">收藏夹</div><div class="ds" id="favCnt">0 题已收藏</div></div>
        </button>
      </div>
      <div style="height:12px"></div>
      <button class="mode-btn" id="resetBtn" style="background:transparent;box-shadow:none;padding:6px 4px">
        <div class="ic" style="background:var(--bg2);color:var(--tx3);width:40px;height:40px;font-size:17px">⟲</div>
        <div><div class="tt" style="font-size:14px">清空练习记录</div><div class="ds">重置错题本、收藏与统计数据</div></div>
      </button>

      <p class="foot">
        题库共 <b id="footTotal">0</b> 道选择题，整理自本目录六份题库文档：<br>
        《15040习概-复习资料》《习概论（真题模拟）》，<br>及 2024年10月 / 2025年4月 / 2025年10月 三套历年真题。<br>
        题目保留原始编号、官方解析与引用页码；<br>「知识点章节」为依据题干关键词自动归类，仅供参考对照。
      </p>
    </div>
  </section>

  <!-- ===== 答题页 ===== -->
  <section id="quiz" class="screen">
    <div class="qbar">
      <div class="qbar-row">
        <button class="iconbtn" id="backBtn">‹</button>
        <div class="pbar"><i id="pbarIn"></i></div>
        <span class="counter" id="counter">0/0</span>
        <button class="iconbtn star" id="favBtn">☆</button>
      </div>
    </div>
    <div id="quizBody"></div>
  </section>

  <!-- ===== 结算页 ===== -->
  <section id="result" class="screen">
    <div class="resu">
      <div class="ring">
        <svg width="132" height="132">
          <circle cx="66" cy="66" r="56" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="11"/>
          <circle id="ringArc" cx="66" cy="66" r="56" fill="none" stroke="#ffd479" stroke-width="11"
            stroke-linecap="round" stroke-dasharray="351.9" stroke-dashoffset="351.9"
            style="transition:stroke-dashoffset 1s cubic-bezier(.22,.61,.36,1)"/>
        </svg>
        <div class="val"><b id="rAcc">0%</b><span>正确率</span></div>
      </div>
      <div class="ttl" id="rTitle">练习完成</div>
      <div class="txt" id="rTxt"></div>
    </div>
    <div class="rlist" id="rList"></div>
    <div class="qnav" style="margin:0 16px 8px">
      <button class="btn ghost" id="rHome">返回首页</button>
      <button class="btn pri" id="rAgain">再练一轮</button>
    </div>
  </section>

</div>
<script>

于中心地位，国家安全归根到底是保障人民利益；国家利益至上是实现政治安全和人民安全的要求和原则。要把政治安全、人民安全、国家利益至上三者统一起来，确保实现党的长期执政、人民安居乐业、国家长治久安。","c":"第十三章 维护和塑造国家安全","p":""},{"id":18,"stem":"在新时代强军目标中，决定军队建设政治方向的是()","o":["光荣传统","听党指挥","能打胜仗","作风优良"],"a":[1],"src":"2024年10月真题","n":19,"t":"单选","e":"听党指挥是灵魂, ”决定军队建设的政治方向,要把听党指挥作为军队建设的首要,任何时候都不能动摇,确保部队绝对忠诚、绝对纯洁、绝对可靠。","c":"第十四章 建设巩固国防和强大人民军队","p":""},{"id":19,"stem":"依据一国两制方针，国家主体实行的的制度是()","o":["新民主主义制度","资本主义制度","社会主义制度","共产主义制度"],"a":[2],"src":"2024年10月真题","n":20,"t":"单选","e":"一国两制是指在统一的国家之内，国家主体实行社会主义制度，个别地区依法实行资本主义制度。","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":""},{"id":20,"stem":"在新时代党解决台湾问题的总体方略中，统一的根本动力是()","o":["坚持团结台湾同胞，争取台湾民心","坚持一个中国原则和九二共识","推动两岸关系融合发展","粉碎台独分裂图谋"],"a":[0],"src":"2024年10月真题","n":21,"t":"单选","e":"坚持团结台湾同胞、争取台湾民心，这是统一的根本动力；坚持粉碎台独分裂图谋，这是统一的必然要求。","c":"第十五章 坚持“一国两制”和推进祖国完全统一","p":""},{"id":21,"stem":"加强发展中国家团结合作，我国秉持的理念是()","o":["总体稳定","均衡发展","以邻为伴","真实亲诚"],"a":[3],"src":"2024年10月真题","n":22,"t":"单选","e":"秉持真实亲诚理念和正确义利观，加强同发展中国家团结合作。","c":"第十六章 中国特色大国外交和推动构建人类命运共同体","p":""},{"id":22,"stem":"在全人类共同价值中，体现人类共同理想的是()","o":["天下为公","民主自由","和平发展","公平正义"],"a":[3],"src":"2024年10月真题","n":23,"t":"单选","e":"和平与发展是我们的共同事业，公平正义是我们的共同理想，民主自由是我们的共同追求","c":"第九章 全面依法治国","p":""},{"id":23,"stem":"新时代党的建设的鲜明主题是()","o":["调动积极性","全面从严治党","调动主动性","真抓敢抓"],"a":[1],"src":"2024年10月真题","n":24,"t":"单选","e":"新时代党的建设的鲜明主题是全面从严治党","c":"第十七章 全面从严治党","p":""},{"id":24,"stem":"我们党最彻底的自我革命()","o":["反官僚主义","反形式主义","反腐败主义","反浪费主义"],"a":[2],"src":"2024年10月真题","n":25,"t":"单选","e":"我们党最彻底的自我革命是反腐败主义 26、【简答题】“” “”两个确立是党在新时代取得的重大政治成果。怎样深刻领悟两个确立的决定性意义？ 答案：党的十九届六中全会指出，党确立习近平同志党中央的核心、全党的核心地位，确立习近平新时代中国特色社会主义思想的指导地位，反映了全党全军全国各族人民共同心 “”愿。 两个确立是新时代党和国家事业取得历史性成就、发生历史性变革的决定性因素， 是党和人民应对一切不确定性的最大确定性、最大底气、最大保证。 27、【简答题】如何理解人民对美好生活的向往就是党的奋斗目标？ 答案：坚持人民至上，必须始终把人民放在心中最高的位置。必须把人民对美好生活的向往作为党的奋斗目标，团结带领人民共同创造美好的未来。(1)为人民谋幸福是党始终坚守的初心，让人民过上好日子是党一贯的追求。(2)人民对美好生活的向往就是党的奋斗目标，这体现了我国社会主要矛盾转化对党和国家工作的新要求。必须牢牢把握我国社会主要矛盾的新变化，顺应人民对高品质生活的新期待，在高质量发展中努力为人民创造更美好、更幸福的生活。 28、【简答题】党的十八大以来，我们党对社会主义基本经济制度做了新概括，简述社会主义基本经济制度。 答案：党的十八大以来，以习近平同志为核心的党中央着眼于更好发挥社会主义制度优越性、推动高质量发展，对社会主义基本经济制度作出新概括，将公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制等共同作为社会主义基本经济制度。 29、【简答题】简述我国的根本政治制度和基本政治制度。 答案：人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。中国共产党领导的多党合作和政治协商制度、民族区域自治制度以及基层群众自治制度构成我国的基本政治制度。 30、【简答题】简述中国特色社会主义法治道路的核心要义。 答案：中国特色社会主义法治道路的核心要义是坚持党的全面领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论。 31、【论述题】 结合材料回答问题在新中国成立特别是改革开放以来长期探索和实践基础上，经过十八大以来在理论和实践上的创新突破，我们党成功推进和拓展了中国式现代化。 中国式现代化，是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于 ——自己国情的中国特色。 摘自《习近平著作选读》第一卷，人民出版社2023 年版，第 18 页。 试述中国式现代化的中国特色。 答案：（1）中国式现代化是人口规模巨大的现代化。我国全体人民整体迈进现代化，人口规模超过现有发达国家的总和，将极大改变现代化的世界版图。 （2）中国式现代化是全体人民共同富裕的现代化。这是中国式现代化区别于西方现代化的显著标志。 （3）中国式现代化是物质文明和精神文明相协调的现代化。物质富足、精神富有是社会主义现代化的根本要求。 （4）中国式现代化是人与自然和谐共生的现代化。坚持绿色发展，统筹推进经济社会发展和生态环境保护，确保可持续发展。 （5）中国式现代化是走和平发展道路的现代化。中华民族有崇尚和平的文化基因，渴望和平、追求发展始终是中国人民的精神特征。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":25,"stem":"在四个全面战略布局中居引领地位的是（）。","o":["全面深化改革","全面从严治党","全面依法治国","全面建设社会主义现代化国家"],"a":[3],"src":"2025年4月真题","n":1,"t":"单选","e":"全面建设社会主义现代化国家是战略日标，在“四个全面”中居于引领地位。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":26,"stem":"中国式现代化建设的出发点和落脚点是（）。","o":["农轻重协调发展","实现人民对美好生活的向往","科技跨越式改展","坚持独立自主、自力更生"],"a":[1],"src":"2025年4月真题","n":2,"t":"单选","e":"必须把实现人民对美好生活的向往作为现代化建设的出发点和落脚点。","c":"第二章 以中国式现代化全面推进中华民族伟大复兴","p":""},{"id":27,"stem":"中国特色社会主义最本质的特征是（）。","o":["中国共产党领导","实现人的全面发展","以公有利为主体","以按分配为主体"],"a":[0],"src":"2025年4月真题","n":3,"t":"单选","e":"中国特色社会主义最本质的特征是中国共产党领导，中国特色社会主义制度的最大优势是中国共产党领导，党是最高政治领导力量。","c":"第一章 新时代坚持和发展中国特色社会主义","p":""},{"id":28,"stem":"党执政的最大底气、最深厚的根基是（）。","o":["人民","中国传统文化","综合国力","安定团结"],"a":[0],"src":"2025年4月真题","n":4,"t":"单选","e":"人民是党执政的最大底气，也是党执政最深厚的根基。","c":"第十章 建设社会主义文化强国","p":""},{"id":29,"stem":"下列关于共同富裕的理解正确的是（）。","o":["所有人同时富裕","沿海地区和内陆地区同步富裕","所有人同等富裕","物质生活和精神生活都富裕"],"a":[3],"src":"2025年4月真题","n":5,"t":"单选","e":"共同富裕是全体人民共同富裕，是人民群众物质生活和精神生活都富裕，不是少数人的富裕，也不是整齐划一的平均主义，不是所有人都同时富裕，也不是所有地区同时达到一个富裕水准。","c":"第十章 建设社会主义文化强国","p":""},{"id":30,"stem":"改革开放的首要任务是（）。","o":["解放思想","解放和发展社会生产力","实事求是","解放和增强社会活力"],"a":[1],"src":"
