<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <!-- 局域网访客页：所有脚本仅限本源（自带服务），无任何外链 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'">
  <title>MyTemple Knowledge · 局域网共享</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css?v=20261112-60e24f66">
  <link rel="stylesheet" href="/guest.css?v=20261112-60e24f66">
</head>
<body>
  <!-- PIN 配对门（未持有 token 时唯一可见界面） -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <img src="/logo.png" alt="" class="gate-logo" onerror="this.style.display='none'">
      <h1>局域网共享</h1>
      <p class="gate-sub">请输入桌面端「设置 → 局域网共享」中显示的 6 位口令</p>
      <form id="gateForm">
        <input id="pinInput" class="gate-pin" type="text" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" placeholder="······" aria-label="访问口令" autofocus>
        <button id="gateSubmit" class="gate-btn" type="submit">进入</button>
      </form>
      <p id="gateError" class="gate-error" role="alert"></p>
      <p class="gate-hint">口令由分享者提供，连续输错 5 次将锁定 60 秒。</p>
    </div>
  </div>

  <!-- 访客主界面：左树右编辑器 -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <button id="sidebarToggle" class="tb-btn" type="button" aria-label="切换目录栏">☰</button>
      <strong id="docTitle" class="doc-title">未打开文档</strong>
      <span id="roBadge" class="ro-badge hidden">只读</span>
      <span class="tb-spacer"></span>
      <input id="searchInput" class="search-input" type="search" placeholder="搜索文档…" aria-label="搜索">
      <button id="newDocBtn" class="tb-btn primary" type="button">新建</button>
      <button id="saveBtn" class="tb-btn primary" type="button">保存</button>
    </header>
    <div id="roBanner" class="ro-banner hidden">当前为只读共享，修改不会被保存。</div>
    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <div id="wsTabs" class="ws-tabs"></div>
        <div id="tree" class="tree"></div>
      </aside>
      <main class="editor-wrap">
        <div id="editorHost" class="editor-host"></div>
        <div id="conflictBar" class="conflict-bar hidden">
          <span>文档已被其他人修改，直接保存会覆盖对方内容。</span>
          <button id="conflictMine" type="button" class="tb-btn primary">保留我的版本</button>
          <button id="conflictTheirs" type="button" class="tb-btn">加载最新版本</button>
        </div>
        <div id="toast" class="toast hidden"></div>
      </main>
    </div>
  </div>

  <script type="module" src="/guest.js?v=20261112-60e24f66"></script>
</body>
</html>
