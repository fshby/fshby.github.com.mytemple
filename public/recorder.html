<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>录屏</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", Roboto, sans-serif; }

  .capture-overlay { position: fixed; inset: 0; z-index: 1; background: transparent; user-select: none; }
  .capture-canvas { position: absolute; inset: 0; z-index: 1; cursor: crosshair; }
  .capture-hint {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.85); font-size: 16px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    pointer-events: none; z-index: 3;
  }
  .capture-tooltip {
    position: absolute; z-index: 3;
    background: rgba(0,0,0,0.75); color: #fff;
    font-size: 12px; padding: 2px 6px; border-radius: 3px;
    pointer-events: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .capture-toolbar {
    position: absolute; display: flex; gap: 2px;
    background: rgba(22,28,39,0.96);
    border: 1px solid rgba(100,116,139,0.35);
    border-radius: 8px; padding: 4px 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    z-index: 4; backdrop-filter: blur(10px);
  }
  .capture-btn {
    background: transparent; border: none; color: #cbd5e1;
    padding: 5px 10px; font-size: 13px; border-radius: 4px;
    cursor: pointer; font-family: inherit; transition: background 0.12s;
  }
  .capture-btn:hover { background: rgba(100,116,139,0.25); color: #f1f5f9; }
  .capture-btn-confirm { color: #f87171; font-weight: 600; }
  .capture-btn-confirm:hover { background: rgba(248,113,113,0.18); color: #f87171; }
  .capture-btn-cancel { color: #94a3b8; }

  /* 录屏提示条 */
  .recording-hint {
    position: fixed; top: 12px; left: 50%;
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.8);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 20px;
    padding: 6px 16px;
    color: #f1f5f9; font-size: 14px; z-index: 10;
    backdrop-filter: blur(8px);
  }
  .recording-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ef4444;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .recording-time { font-family: ui-monospace, monospace; margin-left: 4px; }
  .recording-stop-btn {
    background: rgba(239,68,68,0.2);
    border: 1px solid rgba(239,68,68,0.4);
    color: #fca5a5; padding: 2px 10px;
    border-radius: 4px; cursor: pointer;
    font-size: 12px; margin-left: 8px;
  }
  .recording-stop-btn:hover { background: rgba(239,68,68,0.3); }

  .loading-tip {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #fff; font-size: 18px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    z-index: 10;
  }

  /* 录屏保存对话框 */
  .save-dialog {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(22, 28, 39, 0.98);
    border: 1px solid rgba(100, 116, 139, 0.4);
    border-radius: 12px;
    padding: 24px;
    width: 460px; max-width: 90vw;
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
    z-index: 100;
    backdrop-filter: blur(12px);
  }
  .save-dialog h3 {
    margin: 0 0 16px; color: #f1f5f9; font-size: 16px; font-weight: 600;
  }
  .save-dialog label {
    display: block; color: #94a3b8; font-size: 12px; margin-bottom: 6px;
  }
  .save-dialog input[type="text"] {
    width: 100%; padding: 8px 12px;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(100, 116, 139, 0.4);
    border-radius: 6px; color: #f1f5f9;
    font-size: 13px; font-family: inherit;
    box-sizing: border-box;
  }
  .save-dialog input[type="text"]:focus {
    outline: none; border-color: rgba(34, 211, 238, 0.6);
  }
  .save-path-row {
    display: flex; gap: 8px; align-items: stretch;
  }
  .save-path-row input { flex: 1; }
  .save-dialog .browse-btn {
    background: rgba(100, 116, 139, 0.2);
    border: 1px solid rgba(100, 116, 139, 0.4);
    color: #cbd5e1;
    padding: 0 14px;
    border-radius: 6px; cursor: pointer;
    font-size: 12px; font-family: inherit;
    white-space: nowrap;
    transition: background 0.12s;
  }
  .save-dialog .browse-btn:hover {
    background: rgba(100, 116, 139, 0.35); color: #f1f5f9;
  }
  .save-dialog-actions {
    display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px;
  }
  .save-dialog .save-btn {
    background: rgba(34, 211, 238, 0.2);
    border: 1px solid rgba(34, 211, 238, 0.4);
    color: #67e8f9; padding: 7px 18px;
    border-radius: 6px; cursor: pointer;
    font-size: 13px; font-family: inherit; font-weight: 600;
    transition: background 0.12s;
  }
  .save-dialog .save-btn:hover { background: rgba(34, 211, 238, 0.3); }
  .save-dialog .cancel-btn {
    background: transparent;
    border: 1px solid rgba(100, 116, 139, 0.4);
    color: #94a3b8; padding: 7px 16px;
    border-radius: 6px; cursor: pointer;
    font-size: 13px; font-family: inherit;
    transition: background 0.12s;
  }
  .save-dialog .cancel-btn:hover { background: rgba(100, 116, 139, 0.2); color: #cbd5e1; }
  .save-dialog .file-size {
    color: #64748b; font-size: 11px; margin-top: 4px;
  }
</style>
</head>
<body>
<div id="loadingTip" class="loading-tip">正在准备录屏…</div>

<script type="module">
let overlay = null, canvas = null, ctx = null;
let region = null;
let dpr = window.devicePixelRatio || 1;
let recording = false;
let recorder = null;
let chunks = [];
let outCanvas = null, outCtx = null;
let frameImg = null;
let timerInterval = null;
let elapsed = 0;
let bgImg = null;

function getInvoke() {
  if (window.__TAURI__?.core?.invoke) return window.__TAURI__.core.invoke;
  if (window.__TAURI__?.invoke) return window.__TAURI__.invoke;
  return null;
}
function invoke(cmd, args) {
  const fn = getInvoke();
  if (!fn) return Promise.reject(new Error('Tauri invoke 不可用'));
  return fn(cmd, args);
}

// HTTP POST 简化版
function httpPost(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  }).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));
}

// HTTP GET 简化版
function httpGet(url) {
  return fetch(url, { cache: 'no-store' }).then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)));
}

// 获取默认工作区根目录（用于默认保存路径）
async function getDefaultWorkspaceRoot() {
  try {
    const res = await httpGet('/api/workspaces');
    const wsList = res?.workspaces || [];
    const defId = res?.defaultWorkspaceId || 'default';
    const defWs = wsList.find(w => w.id === defId) || wsList[0];
    if (defWs?.root) return defWs.root;
  } catch (_) {}
  return '';
}

function closeRecorderWindow() {
  recording = false;
  document.body.innerHTML = '';
  // 优先 IPC（recorder_window_close 内部会停止原生录屏 + 关闭 recorder 窗口）
  try {
    if (window.__TAURI__?.core?.invoke) {
      window.__TAURI__.core.invoke('recorder_window_close').catch(() => {});
    }
  } catch(_) {}
  // HTTP 兜底：独立端点 /api/recorder/close 关闭 recorder 窗口
  // 关键修复：之前调用 /api/screenshot/close 只关闭截图窗口，录屏窗口残留 always_on_top 挡住鼠标
  httpPost('/api/recorder/close').catch(() => {
    try { window.close(); } catch(_) {}
  });
}

// 录屏窗口启动：纯 HTTP 加载背景帧
function init() {
  // 监听原生录屏帧（如果 IPC 可用）
  if (window.__TAURI__?.event) {
    window.__TAURI__.event.listen('native-record-frame', (e) => {
      if (!recording) return;
      const dataUrl = e?.payload?.dataUrl;
      if (!dataUrl) return;
      frameImg.onload = () => {
        if (!recording || !outCtx) return;
        const sx = Math.round(region.x * dpr);
        const sy = Math.round(region.y * dpr);
        const sw = Math.max(1, Math.round(region.w * dpr));
        const sh = Math.max(1, Math.round(region.h * dpr));
        outCtx.drawImage(frameImg, sx, sy, sw, sh, 0, 0, outCanvas.width, outCanvas.height);
      };
      frameImg.src = dataUrl;
    });
    // 监听后端停止录制请求（Alt+M 热键触发）
    window.__TAURI__.event.listen('recorder-stop-request', () => {
      if (recording) stopRecording(false);
    });
  }

  // 通过 HTTP 加载背景帧
  loadBackgroundFrame();
}

async function loadBackgroundFrame() {
  try {
    const res = await fetch('/api/screenshot/bg', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    bgImg = new Image();
    bgImg.onload = () => {
      document.getElementById('loadingTip').style.display = 'none';
      startRegionSelection();
      // 通知后端显示窗口
      httpPost('/api/screenshot/ready').catch(() => {});
    };
    bgImg.onerror = () => {
      document.getElementById('loadingTip').style.display = 'none';
      startRegionSelection();
      httpPost('/api/screenshot/ready').catch(() => {});
    };
    bgImg.src = url;
  } catch (err) {
    document.getElementById('loadingTip').style.display = 'none';
    startRegionSelection();
    httpPost('/api/screenshot/ready').catch(() => {});
  }
}

function startRegionSelection() {
  overlay = document.createElement('div');
  overlay.className = 'capture-overlay';
  overlay.innerHTML = `
    <canvas class="capture-canvas"></canvas>
    <div class="capture-hint">拖拽框选录屏区域 · ESC 取消</div>
    <div class="capture-tooltip" style="display:none"></div>
  `;
  document.body.appendChild(overlay);

  canvas = overlay.querySelector('.capture-canvas');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  ctx = canvas.getContext('2d');

  const hint = overlay.querySelector('.capture-hint');
  const tooltip = overlay.querySelector('.capture-tooltip');

  let startX = 0, startY = 0, curX = 0, curY = 0, dragging = false;

  const rect = () => {
    const x = Math.min(startX, curX), y = Math.min(startY, curY);
    const w = Math.abs(curX - startX), h = Math.abs(curY - startY);
    return { x, y, w, h };
  };

  const draw = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // 绘制背景图（如果有）
    if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
      const scaleX = canvas.width / (bgImg.naturalWidth / dpr);
      const scaleH = canvas.height / (bgImg.naturalHeight / dpr);
      ctx.drawImage(bgImg, 0, 0, bgImg.naturalWidth, bgImg.naturalHeight, 0, 0, canvas.width, canvas.height);
    }
    if (!dragging && curX === 0) return;
    const r = rect();
    // 半透明遮罩
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.clearRect(r.x, r.y, r.w, r.h);
    // 重绘选区内背景
    if (bgImg && bgImg.complete && bgImg.naturalWidth > 0) {
      const sx = Math.round(r.x * dpr);
      const sy = Math.round(r.y * dpr);
      const sw = Math.max(1, Math.round(r.w * dpr));
      const sh = Math.max(1, Math.round(r.h * dpr));
      ctx.drawImage(bgImg, sx, sy, sw, sh, r.x, r.y, r.w, r.h);
    }
    // 选区边框
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(r.x + 1, r.y + 1, r.w - 2, r.h - 2);
    ctx.setLineDash([]);
    tooltip.style.display = 'block';
    tooltip.textContent = `${Math.round(r.w)} × ${Math.round(r.h)} px`;
    tooltip.style.left = Math.max(8, r.x) + 'px';
    tooltip.style.top = Math.max(8, r.y - 28) + 'px';
  };

  const onDown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    region = null;
    const oldTb = overlay.querySelector('.capture-toolbar');
    if (oldTb) oldTb.remove();
    hint.style.display = 'block';
    hint.textContent = '拖拽框选录屏区域 · ESC 取消';
    startX = curX = e.clientX;
    startY = curY = e.clientY;
    dragging = true;
    draw();
  };
  const onMove = (e) => {
    curX = e.clientX; curY = e.clientY;
    if (dragging) draw();
  };
  const onUp = (e) => {
    if (!dragging) return;
    dragging = false;
    const r = rect();
    if (r.w < 4 || r.h < 4) { draw(); return; }
    region = { x: r.x, y: r.y, w: r.w, h: r.h };
    draw();
    hint.style.display = 'none';
    document.removeEventListener('mousedown', onDown);
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    showRecordToolbar();
  };
  const onKey = (e) => {
    if (e.key === 'Escape') { cleanupAndClose(); }
  };

  document.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
  document.addEventListener('keydown', onKey, true);
}

function showRecordToolbar() {
  const tb = document.createElement('div');
  tb.className = 'capture-toolbar';
  tb.style.display = 'flex';
  tb.innerHTML = `
    <button type="button" class="capture-btn capture-btn-confirm">● 开始录屏</button>
    <button type="button" class="capture-btn capture-btn-cancel">取消</button>
  `;
  overlay.appendChild(tb);

  const btnW = tb.offsetWidth || 200;
  const btnH = tb.offsetHeight || 36;
  let left = region.x + region.w - btnW;
  let top = region.y + region.h + 6;
  if (top + btnH > window.innerHeight) top = region.y - btnH - 6;
  if (left < 4) left = 4;
  if (left + btnW > window.innerWidth) left = window.innerWidth - btnW - 4;
  tb.style.left = left + 'px';
  tb.style.top = top + 'px';

  tb.querySelector('.capture-btn-confirm').addEventListener('click', (e) => {
    e.stopPropagation();
    tb.remove();
    startRecording();
  });
  tb.querySelector('.capture-btn-cancel').addEventListener('click', (e) => {
    e.stopPropagation();
    cleanupAndClose();
  });

  document.addEventListener('keydown', function esc(e) {
    if (e.key === 'Escape') {
      document.removeEventListener('keydown', esc, true);
      cleanupAndClose();
    } else if (e.key === 'Enter') {
      document.removeEventListener('keydown', esc, true);
      tb.remove();
      startRecording();
    }
  }, true);
}

async function startRecording() {
  // 移除选区遮罩，保留透明背景
  if (overlay) {
    overlay.parentNode.removeChild(overlay);
    overlay = null; canvas = null; ctx = null;
  }

  // 初始化输出 canvas
  const sw = Math.max(1, Math.round(region.w * dpr));
  const sh = Math.max(1, Math.round(region.h * dpr));
  outCanvas = document.createElement('canvas');
  outCanvas.width = Math.min(3840, sw);
  outCanvas.height = Math.min(2160, sh);
  outCtx = outCanvas.getContext('2d');
  frameImg = new Image();
  frameImg.crossOrigin = 'anonymous';

  // 画一帧黑底占位
  outCtx.fillStyle = '#000';
  outCtx.fillRect(0, 0, outCanvas.width, outCanvas.height);

  // 关键修复：先调用 api_stop_native_record 确保上次录屏状态完全释放
  // 防止 RecordState 残留导致 api_start_native_record 报"录屏已在进行中"
  try { await invoke('api_stop_native_record'); } catch (_) {}

  // 通知 Rust 开始原生录屏（xcap DXGI 桌面捕获，不弹选择器）
  // start_native_record 内部已有 3 次重试 + DXGI 恢复延迟
  let nativeStarted = false;
  try {
    await invoke('api_start_native_record');
    nativeStarted = true;
  } catch (e) {
    // 原生录屏启动失败，再重试一次（等待 1 秒让 DXGI 恢复）
    try {
      await new Promise(res => setTimeout(res, 1000));
      await invoke('api_start_native_record');
      nativeStarted = true;
    } catch (e2) {
      // 两次都失败，才降级到 getDisplayMedia（会弹桌面选择器）
      nativeStarted = false;
    }
  }

  if (!nativeStarted) {
    // 降级：使用 getDisplayMedia（最后手段，会弹桌面/窗口选择器）
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
      const track = stream.getVideoTracks()[0];
      if (!track) { cleanupAndClose(); return; }
      const video = document.createElement('video');
      video.srcObject = stream;
      video.muted = true;
      await video.play();
      // 用 getDisplayMedia 的帧
      const destStream = outCanvas.captureStream(30);
      const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
        ? 'video/webm;codecs=vp8' : 'video/webm';
      recorder = new MediaRecorder(destStream, { mimeType, videoBitsPerSecond: 4_000_000 });
      chunks = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.start(100);
      recording = true;
      // 渲染循环
      const renderLoop = () => {
        if (!recording) return;
        const vw = video.videoWidth, vh = video.videoHeight;
        const sx = region.x * (vw / window.innerWidth);
        const sy = region.y * (vh / window.innerHeight);
        const sw2 = Math.round(region.w * (vw / window.innerWidth));
        const sh2 = Math.round(region.h * (vh / window.innerHeight));
        outCtx.drawImage(video, sx, sy, sw2, sh2, 0, 0, outCanvas.width, outCanvas.height);
        requestAnimationFrame(renderLoop);
      };
      renderLoop();
      showRecordingHint();
      return;
    } catch (err) {
      cleanupAndClose();
      return;
    }
  }

  // 原生录屏模式：使用 canvas.captureStream + MediaRecorder
  const destStream = outCanvas.captureStream(30);
  const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
    ? 'video/webm;codecs=vp8'
    : (MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : '');
  if (!mimeType) { cleanupAndClose(); return; }

  recorder = new MediaRecorder(destStream, { mimeType, videoBitsPerSecond: 4_000_000 });
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  recorder.start(100);
  recording = true;
  // 录屏中：窗口设为点击穿透，不阻挡用户操作屏幕
  try { invoke('recorder_set_ignore_cursor', { ignore: true }).catch(() => {}); } catch (_) {}
  showRecordingHint();
}

function showRecordingHint() {
  const hint = document.createElement('div');
  hint.className = 'recording-hint';
  hint.id = 'recordingHint';
  hint.innerHTML = `
    <span class="recording-dot"></span>
    录屏中
    <span class="recording-time">00:00</span>
    <span style="color:#94a3b8;font-size:11px;margin-left:8px">按 Alt+M 停止</span>
  `;
  document.body.appendChild(hint);

  elapsed = 0;
  timerInterval = setInterval(() => {
    elapsed++;
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    const t = hint.querySelector('.recording-time');
    if (t) t.textContent = `${m}:${s}`;
  }, 1000);

  // 录制中窗口已点击穿透，停止操作通过 Alt+M 全局热键触发（后端 emit recorder-stop-request）
}

async function stopRecording(cancel) {
  if (!recording) return;
  recording = false;

  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  const hint = document.getElementById('recordingHint');
  if (hint) hint.remove();

  // 通知 Rust 停止原生录屏
  try { await invoke('api_stop_native_record'); } catch (_) {}

  // 停止 MediaRecorder 并等待最后一帧数据
  let savedRecorder = recorder;
  let savedChunks = chunks;
  if (recorder && recorder.state !== 'inactive') {
    recorder.stop();
  }

  // 等待最后一帧
  await new Promise(res => setTimeout(res, 300));

  if (cancel || savedChunks.length === 0) {
    // 清理 MediaRecorder 引用
    recorder = null;
    chunks = [];
    cleanupAndClose();
    return;
  }

  const mimeType = savedRecorder?.mimeType || 'video/webm';
  const blob = new Blob(savedChunks, { type: mimeType });
  // 保存后清理前端引用，避免数据残留
  recorder = null;
  chunks = [];

  // 读取为 base64，然后弹出保存对话框
  const reader = new FileReader();
  let saved = false;
  const saveTimeout = setTimeout(() => {
    if (!saved) {
      saved = true;
      closeRecorderWindow();
    }
  }, 15000);
  reader.onload = () => {
    saved = true;
    clearTimeout(saveTimeout);
    const base64 = reader.result.split(',')[1];
    showSaveDialog(blob, base64);
  };
  reader.onerror = () => {
    saved = true;
    clearTimeout(saveTimeout);
    cleanupAndClose();
  };
  reader.readAsDataURL(blob);
}

// 弹出保存对话框：让用户选择文件名和保存目录
async function showSaveDialog(blob, base64) {
  // 恢复鼠标捕获（保存对话框需要交互）
  try { invoke('recorder_set_ignore_cursor', { ignore: false }).catch(() => {}); } catch (_) {}

  document.body.innerHTML = '';

  // 获取默认保存目录：工作区/Videos
  let defaultDir = '';
  try {
    const wsRoot = await getDefaultWorkspaceRoot();
    if (wsRoot) {
      defaultDir = wsRoot.replace(/[\\/]+$/, '') + (wsRoot.includes('\\') ? '\\Videos' : '/Videos');
    }
  } catch (_) {}

  const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  const defaultName = `recording_${ts}.webm`;
  const sizeMB = (blob.size / 1024 / 1024).toFixed(2);

  const dialog = document.createElement('div');
  dialog.className = 'save-dialog';
  dialog.innerHTML = `
    <h3>保存录屏</h3>
    <div style="margin-bottom:14px">
      <label>文件名</label>
      <input type="text" id="saveFileName" value="${defaultName}" />
    </div>
    <div style="margin-bottom:14px">
      <label>保存位置${defaultDir ? '（默认：工作区/Videos）' : ''}</label>
      <div class="save-path-row">
        <input type="text" id="saveFilePath" value="${defaultDir}" placeholder="选择保存目录..." />
        <button type="button" class="browse-btn" id="browseBtn">浏览...</button>
      </div>
      <div class="file-size">文件大小：${sizeMB} MB</div>
    </div>
    <div class="save-dialog-actions">
      <button type="button" class="cancel-btn" id="cancelSaveBtn">取消</button>
      <button type="button" class="save-btn" id="confirmSaveBtn">保存</button>
    </div>
  `;
  document.body.appendChild(dialog);

  const nameInput = dialog.querySelector('#saveFileName');
  const pathInput = dialog.querySelector('#saveFilePath');
  const browseBtn = dialog.querySelector('#browseBtn');
  const cancelBtn = dialog.querySelector('#cancelSaveBtn');
  const saveBtn = dialog.querySelector('#confirmSaveBtn');

  nameInput.focus();
  nameInput.select();

  // 浏览目录（优先使用 Tauri dialog 插件，比 PowerShell 更可靠）
  browseBtn.addEventListener('click', async () => {
    try {
      const res = await invoke('recorder_browse_folder');
      if (res) {
        pathInput.value = res;
      }
    } catch (_) {
      // 降级：api_browse_folder (PowerShell)
      try {
        const res2 = await invoke('api_browse_folder');
        if (res2?.path) pathInput.value = res2.path;
      } catch (__) {
        try {
          const res3 = await httpGet('/api/browse-folder');
          if (res3?.path) pathInput.value = res3.path;
        } catch (___) {}
      }
    }
  });

  // 保存
  const doSave = () => {
    const fname = nameInput.value.trim() || defaultName;
    const savePath = pathInput.value.trim();
    saveBtn.disabled = true;
    cancelBtn.disabled = true;
    saveBtn.textContent = '保存中...';

    const finish = () => {
      document.body.innerHTML = '';
      closeRecorderWindow();
    };

    invoke('recorder_result', {
      imageBase64: base64,
      action: 'save',
      filename: fname,
      savePath: savePath || undefined,
    }).then(finish).catch(() => {
      // IPC 降级：HTTP（HTTP 结构体用 snake_case 字段名）
      httpPost('/api/recorder/result', {
        image: base64,
        action: 'save',
        filename: fname,
        save_path: savePath || undefined,
      }).then(finish).catch(finish);
    });
  };

  saveBtn.addEventListener('click', doSave);
  cancelBtn.addEventListener('click', () => {
    document.body.innerHTML = '';
    cleanupAndClose();
  });

  // 快捷键：Enter 保存，Esc 取消
  dialog.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doSave(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelBtn.click(); }
  }, true);
}

function cleanupAndClose() {
  // 完整重置所有前端状态，防止下次复用窗口时残留
  recording = false;
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  // 停止 MediaRecorder（如果正在运行）
  if (recorder && recorder.state !== 'inactive') {
    try { recorder.stop(); } catch(_) {}
  }
  recorder = null;
  chunks = [];
  // 清理 DOM
  if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
  overlay = null; canvas = null; ctx = null;
  outCanvas = null; outCtx = null;
  frameImg = null;
  bgImg = null;
  region = null;
  elapsed = 0;
  // 停止原生录屏（释放 RecordState，防止下次 start_native_record 报"录屏已在进行中"
  // → 降级到 getDisplayMedia 弹出桌面/窗口选择器）
  try { invoke('api_stop_native_record'); } catch(_) {}
  document.body.innerHTML = '';
  closeRecorderWindow();
}

// 启动
init();
</script>
</body>
</html>
