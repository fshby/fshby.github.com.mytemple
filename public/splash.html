<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyTemple Knowledge</title>
<meta name="theme-color" content="#3d3830" />
<style>
html,body{margin:0;padding:0;background:#3d3830;height:100%;}
.app-splash{position:fixed;inset:0;z-index:99999;background:#3d3830;overflow:hidden;font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;}
.splash-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;user-select:none;-webkit-user-drag:none;}
.splash-progress-wrap{position:absolute;left:50%;top:75.2%;transform:translate(-50%,-50%);z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(31vw,620px);}
.splash-progress-bar{width:100%;height:18px;padding:4px;box-sizing:border-box;background:rgba(9,12,13,0.48);border:1px solid rgba(248,207,132,0.82);border-radius:999px;overflow:hidden;box-shadow:0 0 14px rgba(255,200,80,0.14),inset 0 0 12px rgba(0,0,0,0.58);}
.splash-progress-fill{height:100%;background:linear-gradient(90deg,#d89a4f,#ffd18a 58%,#9d7441);background-size:200% 100%;border-radius:999px;transition:width 0.4s cubic-bezier(0.4,0,0.2,1);box-shadow:0 0 9px rgba(245,190,108,0.42);width:0%;}
.splash-progress-info{display:flex;justify-content:space-between;width:100%;font-size:12px;color:rgba(255,245,215,0.85);letter-spacing:0.04em;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
</style>
</head>
<body>
<div class="app-splash">
<img class="splash-bg" src="/boot.webp" alt="" onerror="this.style.display='none'"/>
<div class="splash-progress-wrap">
<div class="splash-progress-bar"><div id="splashProgressFill" class="splash-progress-fill"></div></div>
<div class="splash-progress-info">
<span id="splashProgressText">正在启动服务…</span>
<span id="splashProgressPct">0%</span>
</div>
</div>
</div>
<script>try{var i=window.__TAURI__&&(window.__TAURI__.core&&window.__TAURI__.core.invoke||window.__TAURI__.invoke);if(typeof i==="function"){i("plugin:event|emit",{event:"splash_ready",payload:null})}}catch(e){}</script>
</body>
</html>
